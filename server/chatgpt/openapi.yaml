openapi: 3.1.0
info:
  title: ScanGym — Book Any Gym, Anywhere
  description: |
    ScanGym is the world's first universal gym day pass marketplace. 
    Search 1.2M+ gyms in 190+ countries, compare prices (PPP-adjusted), 
    and book a day pass instantly. No membership, no contract.
    
    Booking flow:
    1. Search gyms by location text or GPS coordinates
    2. Show results with ACTUAL prices, ratings, open/closed status
    3. Get gym details (hours, photos, reviews, facilities)
    4. Choose pass type: Day, 3-Day, Weekly, or Monthly
    5. Book a day pass (guest checkout with email)
    6. User receives booking code + payment link
    7. After payment → QR code for gym entry (scan at door)
    
    Pass types & savings:
    - Day Pass: single session (base price)
    - 3-Day Pass: ~30% savings
    - Weekly Pass: ~40% savings  
    - Monthly Pass: best value
    
    Free cancellation up to 2 hours before session.
  version: 2.1.0
servers:
  - url: https://scangym.com
    description: ScanGym Production API

paths:
  /api/live/search:
    get:
      operationId: searchGyms
      x-openai-isConsequential: false
      summary: Search for gyms by location name
      description: |
        Find gyms by city, area, or text query. Returns a ranked list with 
        ACTUAL prices in local currency, ratings, distance, open/closed status.
        
        Results ranked by: closest → cheapest → highest rated → 24/7 bonus.
        
        IMPORTANT: Always show the actual dayPassPrice and currencySymbol 
        from results — never hardcode "£4.49".
        
        Example queries: "gyms in Bolton", "CrossFit Manchester", "24 hour gym London"
      parameters:
        - name: q
          in: query
          required: true
          description: Search query — city name, area, or gym type
          schema:
            type: string
            example: "gym in Bolton"
        - name: lat
          in: query
          required: false
          description: User's latitude for distance-based ranking (improves results)
          schema:
            type: number
            example: 53.5781
        - name: lng
          in: query
          required: false
          description: User's longitude for distance-based ranking
          schema:
            type: number
            example: -2.4282
      responses:
        '200':
          description: List of matching gyms with prices, ratings, and availability
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    description: Total number of gyms found
                  gyms:
                    type: array
                    items:
                      $ref: '#/components/schemas/GymSummary'

  /api/live/nearby:
    get:
      operationId: searchNearbyGyms
      x-openai-isConsequential: false
      summary: Find gyms near GPS coordinates
      description: |
        Search for gyms using latitude/longitude coordinates. More accurate than text search.
        Use this when the user shares their location or you know their coordinates.
        Results ranked by distance first, then price, then ratings.
      parameters:
        - name: lat
          in: query
          required: true
          description: Latitude coordinate
          schema:
            type: number
            example: 53.5781
        - name: lng
          in: query
          required: true
          description: Longitude coordinate
          schema:
            type: number
            example: -2.4282
        - name: radius
          in: query
          required: false
          description: Search radius in meters (default 5000, max 50000)
          schema:
            type: integer
            default: 5000
            maximum: 50000
      responses:
        '200':
          description: Nearby gyms sorted by distance
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  gyms:
                    type: array
                    items:
                      $ref: '#/components/schemas/GymSummary'

  /api/live/place/{placeId}:
    get:
      operationId: getGymDetails
      x-openai-isConsequential: false
      summary: Get full details for a specific gym
      description: |
        Get comprehensive details including pricing for all pass types, 
        opening hours by day, reviews, photos, facilities, and address.
        Use the placeId from search results.
        Always show this before booking so the user can make an informed decision.
      parameters:
        - name: placeId
          in: path
          required: true
          description: Google Places ID of the gym (from search results)
          schema:
            type: string
      responses:
        '200':
          description: Full gym details with pricing, hours, and reviews
          content:
            application/json:
              schema:
                type: object
                properties:
                  gym:
                    $ref: '#/components/schemas/GymDetails'
                  pricing:
                    $ref: '#/components/schemas/Pricing'
                  rating:
                    $ref: '#/components/schemas/Rating'
                  openingHours:
                    type: object
                    description: Opening hours by day of week

  /api/live/check-availability:
    get:
      operationId: checkAvailability
      x-openai-isConsequential: false
      summary: Check if a gym is available for a specific date
      description: |
        Check whether a gym appears available for a requested date/time.
        This is read-only — it does NOT create a booking or payment.
        Use before booking to confirm availability.
      parameters:
        - name: placeId
          in: query
          required: true
          description: Google Places ID of the gym
          schema:
            type: string
        - name: date
          in: query
          required: true
          description: Requested date in YYYY-MM-DD format
          schema:
            type: string
            format: date
        - name: time
          in: query
          required: false
          description: Requested time in HH:MM format (24h), or "anytime"
          schema:
            type: string
            default: "anytime"
      responses:
        '200':
          description: Availability status
          content:
            application/json:
              schema:
                type: object
                properties:
                  available:
                    type: boolean
                    description: Whether the gym appears available for the requested date
                  gym:
                    type: object
                    properties:
                      placeId:
                        type: string
                      name:
                        type: string
                      address:
                        type: string
                  pricing:
                    type: object
                    properties:
                      dayPass:
                        type: number
                      threeDay:
                        type: number
                      weekly:
                        type: number
                      monthly:
                        type: number
                      currency:
                        type: string
                      currencySymbol:
                        type: string
                  date:
                    type: string
                  time:
                    type: string
                  message:
                    type: string

  /api/bookings/guest-create:
    post:
      operationId: bookGymSession
      x-openai-isConsequential: true
      summary: Book a day pass at a gym (guest checkout)
      description: |
        Create a provisional gym booking using guest checkout (no account needed).
        Returns a booking code and payment link. Payment is completed externally 
        on scangym.com — no purchases happen inside ChatGPT.
        After payment, user receives a QR code for gym entry.
        
        IMPORTANT RULES:
        - ALWAYS confirm gym name, pass type, date/time, email, and price with user BEFORE calling this
        - Ask for email if not provided (required for QR code delivery)
        - Default time is "anytime" if not specified
        - Default passType is "Day Pass" if not specified
        - Mention that multi-day passes are available
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - gymId
                - date
                - email
              properties:
                gymId:
                  type: string
                  description: Gym identifier — either the placeId string from search results or a numeric DB id
                date:
                  type: string
                  format: date
                  description: Booking date YYYY-MM-DD
                  example: "2025-06-15"
                time:
                  type: string
                  description: Start time HH:MM (24h) or "anytime"
                  default: "anytime"
                  example: "10:00"
                email:
                  type: string
                  format: email
                  description: User's email for booking confirmation and QR code
                name:
                  type: string
                  description: User's name
                passType:
                  type: string
                  description: Pass type selection
                  enum: ["Day Pass", "3-Day Pass", "Weekly Pass", "Monthly Pass"]
                  default: "Day Pass"
                referral_code:
                  type: string
                  description: Creator referral code for 15% discount (optional)
      responses:
        '200':
          description: Booking created — give user the booking code and payment link
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  booking:
                    $ref: '#/components/schemas/Booking'
        '400':
          description: Missing required fields
        '404':
          description: Gym not found
        '409':
          description: Duplicate booking exists

  /api/bookings/cancel:
    post:
      operationId: cancelBooking
      x-openai-isConsequential: true
      summary: Cancel a gym booking
      description: |
        Cancel an existing booking. Free cancellation up to 2 hours before session.
        Refund is automatic to original payment method (3-5 business days).
        Requires booking ID/code and email for verification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                bookingId:
                  type: integer
                  description: Booking ID to cancel
                bookingCode:
                  type: string
                  description: Human-readable booking code (e.g. 5WCB-8VDY)
                email:
                  type: string
                  format: email
                  description: Email used when booking (for verification)
      responses:
        '200':
          description: Booking cancelled, refund initiated if applicable
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  refunded:
                    type: boolean
                  message:
                    type: string

components:
  schemas:
    GymSummary:
      type: object
      description: Gym summary from search results — use dayPassPrice and currencySymbol for ACTUAL pricing
      properties:
        id:
          type: string
          description: Gym identifier (Google placeId string — use for booking and getGymDetails)
        placeId:
          type: string
          description: Google Places ID (same as id — use for getGymDetails)
        name:
          type: string
          example: "PureGym Bolton"
        address:
          type: string
          example: "123 High Street, Bolton BL1 1AA"
        distance:
          type: number
          description: Distance from search point in km (when coordinates provided)
        distanceText:
          type: string
        dayPassPrice:
          type: number
          description: ACTUAL day pass price in local currency — always show this, never hardcode
          example: 4.49
        currencySymbol:
          type: string
          description: Currency symbol for the price
          example: "£"
        rating:
          type: number
          example: 4.3
        totalReviews:
          type: integer
          example: 127
        openNow:
          type: boolean
          description: Whether the gym is currently open
        is24h:
          type: boolean
          description: Whether the gym is open 24/7

    GymDetails:
      type: object
      properties:
        placeId:
          type: string
          description: Google Places ID
        name:
          type: string
        address:
          type: string
        phone:
          type: string
        website:
          type: string
        googleMapsUrl:
          type: string
        is24Hours:
          type: boolean
          description: Whether the gym is open 24/7
        isSelfService:
          type: boolean
          description: Whether the gym uses self-service entry (keycard/QR/app)
        photos:
          type: array
          items:
            type: string
          description: Photo URLs (from the photos array in response)

    Pricing:
      type: object
      properties:
        dayPass:
          type: number
          description: Day pass price in local currency
        dayPassPrice:
          type: number
          description: Day pass price (same as dayPass, for backward compatibility)
        threeDay:
          type: number
          description: 3-day pass price (~30% savings)
        weekly:
          type: number
          description: Weekly pass price (~40% savings)
        monthly:
          type: number
          description: Monthly pass price (best value)
        currency:
          type: string
          example: "GBP"
        currencySymbol:
          type: string
          example: "£"
        surgeMultiplier:
          type: number
          description: Dynamic pricing multiplier (1.0 = normal)

    Rating:
      type: object
      properties:
        google:
          type: number
          description: Google Maps rating (1-5)
        googleTotal:
          type: integer
          description: Total number of Google reviews
        scangym:
          type: object
          nullable: true
          description: ScanGym community rating (if available)
          properties:
            average:
              type: number
            total:
              type: integer

    Booking:
      type: object
      properties:
        id:
          type: integer
          description: Booking ID (save for cancellation)
        gymId:
          type: integer
          description: Internal numeric gym ID
        gymName:
          type: string
        date:
          type: string
          format: date
        time:
          type: string
        endTime:
          type: string
        passType:
          type: string
          description: Pass type booked
        price:
          type: number
        currency:
          type: string
        bookingCode:
          type: string
          description: Human-readable code (e.g. 5WCB-8VDY)
        paymentUrl:
          type: string
          description: URL to complete payment on scangym.com
        qrCodeUrl:
          type: string
          nullable: true
          description: QR code URL (available after payment)
        status:
          type: string
          enum: [pending, confirmed, cancelled]
