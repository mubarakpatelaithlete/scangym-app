<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>/* Firefox Android reports a bottom safe-area inset (~40px) even though it never draws the page under the system bar, so every bar pinned with env(safe-area-inset-bottom) floated up with a dead strip. Without viewport-fit=cover env() is 0 there, like Chrome. */(function(){if(/Android/.test(navigator.userAgent)&&/Firefox\//.test(navigator.userAgent)){var m=document.querySelector('meta[name="viewport"]');if(m)m.setAttribute("content",m.getAttribute("content").replace(/,\s*viewport-fit=cover/,""));}})();</script>
<title>ScanGym Chats</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0b0b14;color:#e9edef;font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:#e9edef}
.view{position:absolute;inset:0;display:flex;flex-direction:column}
.hidden{display:none!important}
/* header */
.top{padding:14px 16px 0;background:#11111c}
/* the fixed orange "S" brand mark (brand-mark.css) sits at top-left of every tab: keep headers clear of it */
.top h1{padding-left:36px;min-height:28px}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.3px;display:flex;justify-content:space-between;align-items:center}
.search{margin:12px 0 0;display:flex;align-items:center;gap:8px;background:#1d1d2b;border-radius:22px;padding:9px 14px}
.search input{background:none;border:0;outline:0;flex:1}
.tabs{display:flex;gap:8px;padding:12px 0 10px;overflow-x:auto}
.tabs button{padding:7px 14px;border-radius:18px;background:#1d1d2b;color:#aeb7bf;font-weight:600;font-size:14px;white-space:nowrap}
.tabs button.on{background:rgba(255,109,0,.16);color:#FF8A33}
.list{flex:1;overflow-y:auto;padding-bottom:150px}
.row{display:flex;gap:12px;align-items:center;padding:10px 16px;width:100%;text-align:left}
.row:active{background:#171724}
.av{width:48px;height:48px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#fff;position:relative}
.av .dot{position:absolute;right:1px;bottom:1px;width:12px;height:12px;border-radius:50%;background:#25d366;border:2px solid #0b0b14}
.rc{flex:1;min-width:0;border-bottom:1px solid #1a1a26;padding-bottom:10px}
.r1,.r2{display:flex;justify-content:space-between;gap:8px;align-items:center}
.nm{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm{font-size:12px;color:#8696a0;flex:none}
.tm.new{color:#25d366}
.pv{color:#8696a0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{background:#25d366;color:#0b0b14;font-size:12px;font-weight:800;min-width:20px;height:20px;border-radius:10px;padding:0 6px;display:flex;align-items:center;justify-content:center;flex:none}
.empty{padding:40px 24px;text-align:center;color:#8696a0}
.empty b{display:block;color:#e9edef;font-size:17px;margin-bottom:6px}
.fab{position:absolute;right:18px;bottom:86px;width:56px;height:56px;border-radius:16px;background:#FF6D00;color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(255,109,0,.35)}
.cta{display:inline-block;margin-top:14px;background:#FF6D00;color:#fff;font-weight:700;padding:10px 20px;border-radius:22px;text-decoration:none}
/* chat */
.ch{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 46px;background:#11111c}
.ch .back{font-size:24px;padding:0 6px}
.ch .av{width:40px;height:40px;font-size:15px}
.ch .who{flex:1;min-width:0}
.ch .sub{font-size:12px;color:#8696a0}
.ch .sub.on{color:#25d366}
.ch .ic{font-size:19px;padding:6px 8px;opacity:.85}
.msgs{flex:1;overflow-y:auto;padding:12px 10px;background:#0b0b14 radial-gradient(circle at 1px 1px,rgba(255,255,255,.035) 1px,transparent 0) 0 0/22px 22px}
.day{text-align:center;margin:10px 0}
.day span{background:#1d1d2b;color:#aeb7bf;font-size:12px;padding:5px 10px;border-radius:8px}
.b{max-width:80%;padding:6px 8px 4px 10px;border-radius:10px;margin:3px 0;word-wrap:break-word;white-space:pre-wrap;position:relative;font-size:15px;user-select:text}
.b.me{margin-left:auto;background:#3a2412;border-top-right-radius:2px}
.b.them{background:#1d1d2b;border-top-left-radius:2px}
.b.del{font-style:italic;color:#8696a0}
.meta{float:right;margin:6px 0 -2px 10px;font-size:11px;color:#9aa4ab;display:flex;gap:3px;align-items:center}
.tick{font-size:12px;letter-spacing:-3px;color:#9aa4ab}
.tick.read{color:#53bdeb}
.bar{display:flex;align-items:flex-end;gap:8px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:#0b0b14}
.inp{flex:1;display:flex;align-items:flex-end;background:#1d1d2b;border-radius:24px;padding:4px 6px 4px 4px}
.inp textarea{flex:1;background:none;border:0;outline:0;color:#e9edef;font:inherit;resize:none;max-height:120px;padding:8px 4px;height:38px}
.inp button{font-size:22px;padding:6px 8px}
.send{width:46px;height:46px;border-radius:50%;background:#FF6D00;color:#fff;font-size:19px;flex:none;display:flex;align-items:center;justify-content:center}
.emo{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;padding:8px;background:#11111c;max-height:200px;overflow-y:auto}
.emo button{font-size:24px;padding:4px}
.typing{color:#25d366}
/* sheet */
.sheet{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;z-index:5}
.sheet .in{background:#161622;width:100%;border-radius:18px 18px 0 0;padding:16px;max-height:80%;display:flex;flex-direction:column}
.sheet h3{font-size:17px;margin-bottom:10px;display:flex;justify-content:space-between}
.tool{display:flex;gap:14px;align-items:center;padding:14px 16px;width:100%;text-align:left;border-bottom:1px solid #1a1a26}
.tool .ti{width:42px;height:42px;border-radius:12px;background:#1d1d2b;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.tool small{display:block;color:#8696a0;font-size:13px}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:#e9edef;color:#0b0b14;padding:8px 14px;border-radius:18px;font-size:14px;font-weight:600;z-index:9}
.menu{position:absolute;z-index:8;background:#232333;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.5);overflow:hidden}
.menu button{display:block;padding:12px 18px;width:100%;text-align:left}
/* Task 24: WhatsApp parity — top sections, list filters, attach sheet, media bubbles */
/* Task 11: Chats / Calls / Tools live in the fixed bottom band (the ScanGym "second rectangle"
   above the main tab bar), exactly where WhatsApp keeps its Chats / Calls / Updates tabs. */
.seg{position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;background:#0b0b14;border-top:1px solid #1a1a26;padding:6px 0 max(6px,env(safe-area-inset-bottom))}
.seg button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;color:#aeb7bf;font-weight:600;font-size:12px}
.seg button .si{font-size:21px;line-height:1;width:52px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.seg button.on{color:#FF8A33}
.seg button.on .si{background:rgba(255,109,0,.16)}
/* calls */
.cl-in{color:#25d366}.cl-miss{color:#f15c6d}
.callbtn{font-size:22px;padding:8px;flex:none}
#call{position:absolute;inset:0;z-index:20;background:#0b141a;display:flex;flex-direction:column;align-items:center;color:#fff}
#call video#rv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#call video#lv{position:absolute;right:14px;top:70px;width:110px;height:160px;object-fit:cover;border-radius:12px;border:2px solid rgba(255,255,255,.2);background:#222;z-index:2;transform:scaleX(-1)}
#call .ci{position:relative;z-index:2;margin-top:70px;text-align:center}
#call .ci .av{width:96px;height:96px;font-size:34px;margin:0 auto 14px}
#call .ci .cn{font-size:24px;font-weight:700}
#call .ci .cs{color:#b7c2c9;margin-top:6px}
#call .cb{position:absolute;left:0;right:0;bottom:calc(28px + env(safe-area-inset-bottom));z-index:2;display:flex;justify-content:center;gap:18px}
#call .cb button{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.14);font-size:24px;display:flex;align-items:center;justify-content:center}
#call .cb button.off{background:#fff;color:#0b141a}
#call .cb .end{background:#f15c6d}
#call .cb .acc{background:#25d366}
.hic{display:flex;gap:4px;align-items:center}
.hic button{font-size:20px;padding:4px 8px}
.att{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px;padding:6px 2px 10px}
.att button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:#cfd6db}
.att .ai{width:56px;height:56px;border-radius:18px;border:1px solid #2a2a3a;background:#1d1d2b;display:flex;align-items:center;justify-content:center;font-size:24px}
.b img.mm,.b video.mm{display:block;max-width:240px;max-height:300px;border-radius:8px;margin-bottom:2px}
.b a.doc{display:flex;gap:8px;align-items:center;color:#e9edef;text-decoration:none;background:rgba(255,255,255,.06);padding:8px 10px;border-radius:8px}
.fav{color:#FFB020;font-size:13px}
</style>
</head>
<body>
<!-- LIST VIEW -->
<section id="vList" class="view">
  <div class="top">
    <h1>Chats <span class="hic"><button id="btnCam" title="Camera" aria-label="Send a photo">📷</button><button id="btnMore" title="More" aria-label="More options">⋮</button></span></h1>
    <div class="search"><span>🔍</span><input id="q" placeholder="Search chats or people" autocomplete="off"></div>
    <div class="tabs" id="filters" role="tablist">
      <button data-tab="chats" class="on">All</button>
      <button data-tab="unread">Unread</button>
      <button data-tab="fav">Favourites</button>
    </div>
  </div>
  <div id="list" class="list"></div>
  <button id="fab" class="fab" aria-label="New chat">💬</button>
  <nav class="seg" role="tablist" aria-label="Chats sections">
    <button data-sec="chats" class="on"><span class="si">💬</span>Chats</button>
    <button data-sec="calls"><span class="si">📞</span>Calls</button>
    <button data-sec="tools"><span class="si">🧰</span>Tools</button>
  </nav>
</section>

<!-- CHAT VIEW -->
<section id="vChat" class="view hidden">
  <div class="ch">
    <button class="back" id="back" aria-label="Back">‹</button>
    <div class="av" id="cAv"></div>
    <div class="who"><div class="nm" id="cName"></div><div class="sub" id="cSub"></div></div>
    <button class="ic" id="cVideo" aria-label="Video call">📹</button>
    <button class="ic" id="cCall" aria-label="Voice call">📞</button>
  </div>
  <div class="msgs" id="msgs"></div>
  <div id="emo" class="emo hidden"></div>
  <div class="bar">
    <div class="inp">
      <button id="emoBtn" aria-label="Emoji">😊</button>
      <textarea id="txt" rows="1" placeholder="Message"></textarea>
      <button id="attBtn" aria-label="Attach">📎</button>
      <button id="camBtn" aria-label="Camera">📷</button>
    </div>
    <input type="file" id="fPick" class="hidden">
    <button class="send" id="send" aria-label="Send">➤</button>
  </div>
</section>

<div id="call" class="hidden">
  <video id="rv" autoplay playsinline class="hidden"></video>
  <video id="lv" autoplay playsinline muted class="hidden"></video>
  <audio id="ra" autoplay></audio>
  <div class="ci"><div id="callAv"></div><div class="cn" id="callName"></div><div class="cs" id="callState"></div></div>
  <div class="cb" id="callBtns"></div>
</div>
<div id="sheet" class="sheet hidden"><div class="in" id="sheetIn"></div></div>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var S={me:null,threads:[],tab:'chats',open:null,msgs:[],lastId:0,listT:null,chatT:null,typingSent:0};
var COLORS=['#e67e22','#16a085','#8e44ad','#2980b9','#c0392b','#27ae60','#d35400','#7f8c8d'];
function color(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return COLORS[Math.abs(h)%COLORS.length];}
function initials(n){return (n||'?').split(/\s+/).map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function linkify(s){return esc(s).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener" style="color:#53bdeb">$1</a>');}
function api(m,u,b){return fetch('/api/dm'+u,{method:m,credentials:'same-origin',headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined}).then(function(r){return r.json().catch(function(){return{};}).then(function(j){if(!r.ok){var e=new Error(j.error||'Error');e.status=r.status;throw e;}return j;});});}
function toast(t){var d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove();},2200);}
function avatar(name,online){return '<div class="av" style="background:'+color(name)+'">'+esc(initials(name))+(online?'<span class="dot"></span>':'')+'</div>';}
function hhmm(d){d=new Date(d);return d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});}
function when(d){d=new Date(d);var now=new Date();if(d.toDateString()===now.toDateString())return hhmm(d);var y=new Date(now);y.setDate(now.getDate()-1);if(d.toDateString()===y.toDateString())return 'Yesterday';if(now-d<6*864e5)return d.toLocaleDateString([], {weekday:'long'});return d.toLocaleDateString();}
function lastSeen(o){if(o.typing)return '<span class="typing">typing…</span>';if(o.online)return 'online';if(!o.lastSeen)return '';var d=new Date(o.lastSeen);return 'last seen '+(new Date().toDateString()===d.toDateString()?'today at '+hhmm(d):when(d)+' at '+hhmm(d));}
function ticks(m){if(!m.mine||m.deleted)return '';if(m.pending)return '<span class="tick">🕓</span>';return '<span class="tick'+(m.read?' read':'')+'">'+(m.delivered||m.read?'✓✓':'✓')+'</span>';}
function goTop(u){try{window.top.location.href=u;}catch(e){location.href=u;}}

/* ── list ── */
function renderList(){
  var box=$('list'),q=$('q').value.trim().toLowerCase();
  if(S.tab==='calls'){renderCalls(box,q);return;}
  if(S.tab==='tools'){renderTools();return;}
  var list=S.threads.filter(function(t){return (S.tab!=='unread'||t.unread>0)&&(S.tab!=='fav'||FAV[t.id])&&(!q||t.name.toLowerCase().indexOf(q)>=0||(t.lastMessage||'').toLowerCase().indexOf(q)>=0);});
  var h='';
  list.forEach(function(t){
    h+='<button class="row" data-id="'+t.id+'">'+avatar(t.name,t.online)+'<div class="rc"><div class="r1"><span class="nm">'+(FAV[t.id]?'<span class="fav">★</span> ':'')+esc(t.name)+'</span><span class="tm'+(t.unread?' new':'')+'">'+(t.lastMessage?when(t.lastMessageAt):'')+'</span></div><div class="r2"><span class="pv">'+(t.lastFromMe&&t.lastMessage?'<span class="tick'+(t.lastRead?' read':'')+'">✓✓</span> ':'')+esc(preview(t.lastMessage)||'Tap to start chatting')+'</span>'+(t.unread?'<span class="badge">'+t.unread+'</span>':'')+'</div></div></button>';
  });
  if(q.length>=2){h+='<div id="people"></div>';}
  if(!list.length&&q.length<2)h='<div class="empty"><b>'+(S.tab==='unread'?'No unread chats':S.tab==='fav'?'No favourites yet':'No chats yet')+'</b>'+(S.tab==='unread'?'You\'re all caught up.':S.tab==='fav'?'Long-press a chat and tap ★ Add to favourites.':'Tap 💬 to find a friend on ScanGym, or invite one by SMS.')+'</div>';
  box.innerHTML=h;
  Array.prototype.forEach.call(box.querySelectorAll('.row[data-id]'),function(b){b.onclick=function(){if(b.__lp){b.__lp=false;return;}openChat(+b.dataset.id);};
    b.oncontextmenu=function(e){e.preventDefault();rowMenu(b,e.clientX,e.clientY);};
    var lt=null;b.addEventListener('touchstart',function(e){var t=e.touches[0];lt=setTimeout(function(){b.__lp=true;rowMenu(b,t.clientX,t.clientY);},500);},{passive:true});
    ['touchend','touchmove'].forEach(function(ev){b.addEventListener(ev,function(){clearTimeout(lt);},{passive:true});});});
  if(q.length>=2)searchPeople(q,$('people'));
}
var searchT=null;
function searchPeople(q,el){clearTimeout(searchT);searchT=setTimeout(function(){api('GET','/users?q='+encodeURIComponent(q)).then(function(j){
  if(!el.isConnected)return;var h=j.users.length?'<div style="padding:12px 16px 4px;color:#FF8A33;font-size:13px;font-weight:700">PEOPLE ON SCANGYM</div>':'';
  j.users.forEach(function(u){h+='<button class="row" data-u="'+esc(u.id)+'">'+avatar(u.name,u.online)+'<div class="rc"><div class="r1"><span class="nm">'+esc(u.name)+'</span></div><div class="r2"><span class="pv">'+(u.online?'online':'Tap to message')+'</span></div></div></button>';});
  el.innerHTML=h;Array.prototype.forEach.call(el.querySelectorAll('[data-u]'),function(b){b.onclick=function(){startWith(b.dataset.u);};});
}).catch(function(){});},250);}
function startWith(uid){api('POST','/threads',{userId:uid}).then(function(j){closeSheet();$('q').value='';return loadThreads().then(function(){openChat(j.id);});}).catch(function(e){toast(e.message);});}
function loadThreads(){return api('GET','/threads').then(function(j){S.threads=j.threads;if(!S.open)renderList();}).catch(function(e){if(e.status===401)signedOut();});}
function signedOut(){clearInterval(S.listT);$('fab').classList.add('hidden');$('list').innerHTML='<div class="empty"><b>💬 Chat with friends on ScanGym</b>Sign in to message your gym buddies, trainers and creators.<br><a class="cta" href="/more/profile" target="_top">Sign in</a></div>';}

function renderTools(){
  var h='';
  [['✉️','Invite a friend by SMS','Send a text with a link to chat on ScanGym','invite'],
   ['🔗','Share my chat link','Copy a link friends can use to join','link'],
   ['🆕','New chat','Find anyone on ScanGym by name, email or phone','new'],
   ['🏋️','Find a gym buddy','Book a day pass together','buddy'],
   ['🛍️','My catalogue · Add item','List a product in your ScanGym shop','catalogue'],
   ['⚡','Quick replies','Saved messages you send in one tap','quick'],
   ['★','Favourites','Your starred chats','favs'],
   ['📢','Broadcast to followers','For creators: announce to everyone who follows you','broadcast']
  ].forEach(function(t){h+='<button class="tool" data-t="'+t[3]+'"><div class="ti">'+t[0]+'</div><div><b>'+t[1]+'</b><small>'+t[2]+'</small></div></button>';});
  $('list').innerHTML=h;
  Array.prototype.forEach.call($('list').querySelectorAll('.tool'),function(b){b.onclick=function(){tool(b.dataset.t);};});
}
function tool(t){
  if(t==='invite')return inviteSheet();
  if(t==='new')return newChatSheet();
  if(t==='link'){var u='https://www.scangym.com/chats';(navigator.share?navigator.share({title:'Chat with me on ScanGym',url:u}):navigator.clipboard.writeText(u).then(function(){toast('Link copied');})).catch(function(){});return;}
  if(t==='buddy')return goTop('/explore');
  if(t==='catalogue'){try{if(window.top._sgShopOpenSell){window.top._sgShopOpenSell();return;}}catch(e){}return goTop('/shop');}
  if(t==='quick')return quickSheet(null);
  if(t==='favs'){document.querySelector('.seg button[data-sec="chats"]').click();document.querySelector('#filters button[data-tab="fav"]').click();return;}
  if(t==='broadcast')return goTop('/creator');
}
function openSheet(h){$('sheetIn').innerHTML=h;$('sheet').classList.remove('hidden');}
function closeSheet(){$('sheet').classList.add('hidden');}
$('sheet').onclick=function(e){if(e.target===$('sheet'))closeSheet();};
function inviteSheet(){
  openSheet('<h3>Invite by SMS <button onclick="this.closest(\'.sheet\').classList.add(\'hidden\')">✕</button></h3><p style="color:#8696a0;font-size:14px;margin-bottom:10px">We\'ll text them a link to chat with you on ScanGym.</p><div class="search" style="margin:0 0 12px"><input id="ph" type="tel" placeholder="+44 7700 900123"></div><button class="cta" id="phGo" style="border:0;margin:0">Send invite</button>');
  $('ph').focus();$('phGo').onclick=function(){var p=$('ph').value.replace(/[\s()-]/g,'');api('POST','/invite',{phone:p}).then(function(){closeSheet();toast('Invite sent ✓');}).catch(function(e){toast(e.message);});};
}
function newChatSheet(){
  openSheet('<h3>New chat <button onclick="this.closest(\'.sheet\').classList.add(\'hidden\')">✕</button></h3><div class="search" style="margin:0 0 8px"><span>🔍</span><input id="nq" placeholder="Name, email or phone"></div><button class="tool" id="nInv"><div class="ti">✉️</div><div><b>Invite a friend</b><small>Not on ScanGym yet? Send an SMS</small></div></button><div id="nRes" style="overflow-y:auto"></div>');
  $('nInv').onclick=inviteSheet;
  var nq=$('nq');nq.focus();nq.oninput=function(){var v=nq.value.trim();if(v.length<2){$('nRes').innerHTML='';return;}searchPeople(v,$('nRes'));};
}
$('fab').onclick=newChatSheet;
$('btnCam').onclick=function(){if(!S.threads.length){newChatSheet();return;}toast('Open a chat, then tap 📷 to send a photo');};
$('q').oninput=renderList;

function openChat(id){

  $('cAv').outerHTML='<div class="av" id="cAv" style="background:'+color(t.name)+'">'+esc(initials(t.name))+'</div>';

  try{history.pushState({chat:id},'');}catch(e){}

function poll(){
  var id=S.open;if(!id)return;
  api('GET','/threads/'+id+'/messages?after='+S.lastId).then(function(j){
    if(S.open!==id)return;
    $('cName').textContent=j.other.name;var sub=$('cSub');sub.innerHTML=lastSeen(j.other);sub.className='sub'+(j.other.online&&!j.other.typing?' on':'');
    var changed=false;
    j.messages.forEach(function(m){var i=S.msgs.findIndex(function(x){return x.id===m.id;});if(i<0){S.msgs=S.msgs.filter(function(x){return !(x.pending&&x.body===m.body&&m.mine);});S.msgs.push(m);changed=true;}if(m.id>S.lastId)S.lastId=m.id;});
    j.ticks.forEach(function(t){var m=S.msgs.find(function(x){return x.id===t.id;});if(m&&(m.read!==t.read||m.delivered!==t.delivered||m.deleted!==t.deleted)){m.read=t.read;m.delivered=t.delivered;if(t.deleted){m.deleted=true;m.body='';}changed=true;}});
    if(changed||!$('msgs').children.length)renderMsgs();
  }).catch(function(){});
}
function renderMsgs(){
  var box=$('msgs'),atBottom=box.scrollHeight-box.scrollTop-box.clientHeight<80,h='',day='';
  if(!S.msgs.length)h='<div class="day"><span>🔒 Say hi 👋 — messages are private to you two</span></div>';
  S.msgs.forEach(function(m){
    var d=new Date(m.at||Date.now()).toDateString();
    if(d!==day){day=d;var w=when(m.at||Date.now());h+='<div class="day"><span>'+(/:/.test(w)?'Today':w)+'</span></div>';}
    h+='<div class="b '+(m.mine?'me':'them')+(m.deleted?' del':'')+'" data-id="'+m.id+'">'+(m.deleted?'🚫 This message was deleted':bodyHtml(m.body))+'<span class="meta">'+hhmm(m.at||Date.now())+' '+ticks(m)+'</span></div>';
  });
  box.innerHTML=h;
  if(atBottom||S._forceBottom){box.scrollTop=box.scrollHeight;S._forceBottom=false;}
}
function bodyHtml(b){
  if(!b||b.indexOf('📎 /api/dm/file/')!==0)return linkify(b);
  var p=b.slice(2).trim().split('|'),u=p[0],n=p[1]||'file',l=n.toLowerCase();
  if(!/^\/api\/dm\/file\/dm_\d+_[a-f0-9]{16}\.[a-z0-9]{1,5}$/.test(u))return linkify(b);
  if(/\.(jpe?g|png|webp|gif|heic)$/.test(l))return '<a href="'+u+'" target="_blank" rel="noopener"><img class="mm" loading="lazy" alt="Photo" src="'+u+'"></a>';
  if(/\.(mp4|mov|webm)$/.test(l))return '<video class="mm" controls playsinline preload="metadata" src="'+u+'"></video>';
  if(/\.(mp3|m4a|ogg|wav|aac)$/.test(l))return '<audio controls preload="none" src="'+u+'" style="max-width:240px"></audio>';
  return '<a class="doc" href="'+u+'" target="_blank" rel="noopener">📄 <span>'+esc(n)+'</span></a>';
}

function renderCalls(box,q){
  box.innerHTML='<div class="empty">Loading calls…</div>';
  api('GET','/calls/log').then(function(j){
    if(S.tab!=='calls')return;
    var list=j.calls.filter(function(c){return !q||c.name.toLowerCase().indexOf(q)>=0;});
    if(!list.length){box.innerHTML='<div class="empty"><b>📞 No calls yet</b>Open any chat and tap 📞 for voice or 📹 for video.</div>';return;}
    var h='<div style="padding:12px 16px 4px;color:#FF8A33;font-size:13px;font-weight:700">RECENT</div>';
    list.forEach(function(c){
      var arrow=c.missed?'<span class="cl-miss">'+(c.outgoing?'↗':'↙')+'</span>':'<span class="cl-in">'+(c.outgoing?'↗':'↙')+'</span>';
      h+='<div class="row">'+avatar(c.name,false)+'<div class="rc"><div class="r1"><span class="nm'+(c.missed&&!c.outgoing?' cl-miss':'')+'">'+esc(c.name)+'</span>'
        +'<button class="callbtn" data-t="'+c.threadId+'" data-k="'+(c.video?'video':'voice')+'" aria-label="Call back">'+(c.video?'📹':'📞')+'</button></div>'
        +'<div class="r2"><span class="pv">'+arrow+' '+esc(c.label)+' · '+when(c.at)+'</span></div></div></div>';
    });
    box.innerHTML=h;
    Array.prototype.forEach.call(box.querySelectorAll('.callbtn'),function(b){b.onclick=function(){callStart(+b.dataset.t,b.dataset.k);};});
  }).catch(function(e){if(e.status===401)signedOut();else box.innerHTML='<div class="empty">Could not load calls</div>';});
}
function ring(on){
  try{if(!on){if(C&&C.ringT){clearInterval(C.ringT);C.ringT=null;}return;}
    var ac=new (window.AudioContext||window.webkitAudioContext)();C.ac=ac;
    var beep=function(){var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=C&&C.incoming?620:440;g.gain.value=.08;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.9);};
    beep();C.ringT=setInterval(beep,2500);}catch(e){}
}
function callUI(state){
  if(!C)return;$('call').classList.remove('hidden');
  $('callAv').innerHTML=avatar(C.name,false);$('callName').textContent=C.name;$('callState').textContent=state;

    $('cDec').onclick=function(){api('POST','/calls/'+C.id+'/end',{reason:'declined'}).catch(function(){});callCleanup('');};
    $('cAcc').onclick=callAccept;return;}
  b.innerHTML=(C.kind==='video'?'<button id="cFlip" aria-label="Flip camera">🔄</button><button id="cCam" aria-label="Camera">🎥</button>':'<button id="cSpk" aria-label="Video">📹</button>')
    +'<button id="cMute" aria-label="Mute">🎙️</button><button class="end" id="cEnd" aria-label="End call">📵</button>';
  $('cMute').onclick=function(){var t=C.stream&&C.stream.getAudioTracks()[0];if(!t)return;t.enabled=!t.enabled;this.classList.toggle('off',!t.enabled);};
  $('cEnd').onclick=function(){api('POST','/calls/'+C.id+'/end',{}).catch(function(){});callCleanup('Call ended');};
  if($('cCam'))$('cCam').onclick=function(){var t=C.stream&&C.stream.getVideoTracks()[0];if(!t)return;t.enabled=!t.enabled;this.classList.toggle('off',!t.enabled);};
  if($('cFlip'))$('cFlip').onclick=flipCam;
  if($('cSpk'))$('cSpk').onclick=function(){toast('Start a 📹 video call from the chat to use camera');};
}
function media(kind){return navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true},video:kind==='video'?{facingMode:'user',width:{ideal:640},height:{ideal:960}}:false});}
function makePC(){
  return getIce().then(function(ice){
    var pc=new RTCPeerConnection({iceServers:ice});C.pc=pc;
    C.stream.getTracks().forEach(function(t){pc.addTrack(t,C.stream);});
    pc.onicecandidate=function(e){if(e.candidate&&C&&C.id)api('POST','/calls/'+C.id+'/ice',{candidate:e.candidate.toJSON()}).catch(function(){});else if(e.candidate)C.pendingIce.push(e.candidate.toJSON());};
    pc.ontrack=function(e){var st=e.streams[0];if(C.kind==='video'){$('rv').srcObject=st;$('rv').classList.remove('hidden');}else $('ra').srcObject=st;};
    pc.onconnectionstatechange=function(){if(!C)return;var s=pc.connectionState;
      if(s==='connected'){ring(false);C.t0=C.t0||Date.now();tick();}
      if(s==='failed'){api('POST','/calls/'+C.id+'/end',{}).catch(function(){});callCleanup('Call failed — poor connection');}};
    if(C.kind==='video'){$('lv').srcObject=C.stream;$('lv').classList.remove('hidden');}
    return pc;
  });
}
function tick(){if(!C||!C.t0)return;var s=Math.round((Date.now()-C.t0)/1000);$('callState').textContent=Math.floor(s/60)+':'+('0'+s%60).slice(-2);clearTimeout(C.tickT);C.tickT=setTimeout(tick,1000);}
function callStart(threadId,kind){
  if(C){toast('You are already on a call');return;}
  if(!window.RTCPeerConnection||!navigator.mediaDevices){toast('Calls are not supported in this browser');return;}
  var t=S.threads.find(function(x){return x.id===threadId;})||{name:$('cName').textContent||'Call'};
  C={threadId:threadId,kind:kind,name:t.name,incoming:false,pendingIce:[],iceSeen:0};
  callUI(kind==='video'?'Starting video…':'Calling…');
  media(kind).then(function(st){C.stream=st;return makePC();}).then(function(pc){
    return pc.createOffer().then(function(o){return pc.setLocalDescription(o);}).then(function(){
      return api('POST','/threads/'+threadId+'/call',{kind:kind,offer:{type:pc.localDescription.type,sdp:pc.localDescription.sdp}});});
  }).then(function(j){
    if(!C)return;C.id=j.id;C.pendingIce.splice(0).forEach(function(c){api('POST','/calls/'+C.id+'/ice',{candidate:c}).catch(function(){});});
    $('callState').textContent='Ringing…';ring(true);callPoll();
  }).catch(function(e){callCleanup(e&&e.name==='NotAllowedError'?'Allow microphone'+(kind==='video'?' & camera':'')+' to call':(e.message||'Could not start call'));});
}
function callPoll(){
  if(!C||!C.id)return;
  api('GET','/calls/'+C.id+'?since='+C.iceSeen).then(function(j){
    if(!C)return;
    if(j.status==='ended'){callCleanup(j.reason==='declined'?'Call declined':j.reason==='missed'?'No answer':'Call ended');return;}
    var p=Promise.resolve();
    if(j.answer&&!C.answered){C.answered=true;$('callState').textContent='Connecting…';p=C.pc.setRemoteDescription(j.answer);}
    p.then(function(){(j.ice||[]).forEach(function(c){C.pc.addIceCandidate(c).catch(function(){});});C.iceSeen=j.iceCount;});
    C.pollT=setTimeout(callPoll,C.pc&&C.pc.connectionState==='connected'?4000:1000);
  }).catch(function(){if(C)C.pollT=setTimeout(callPoll,2000);});
}
function callAccept(){
  ring(false);$('callState').textContent='Connecting…';
  media(C.kind).then(function(st){C.stream=st;return makePC();}).then(function(pc){
    callUI('Connecting…');
    return pc.setRemoteDescription(C.offer).then(function(){return pc.createAnswer();}).then(function(a){return pc.setLocalDescription(a);}).then(function(){
      C.answered=true;return api('POST','/calls/'+C.id+'/answer',{answer:{type:pc.localDescription.type,sdp:pc.localDescription.sdp}});});
  }).then(function(){C.pendingIce.splice(0).forEach(function(c){api('POST','/calls/'+C.id+'/ice',{candidate:c}).catch(function(){});});callPoll();})
  .catch(function(e){api('POST','/calls/'+(C&&C.id)+'/end',{}).catch(function(){});callCleanup(e&&e.name==='NotAllowedError'?'Allow microphone to answer':'Could not connect');});
}
function flipCam(){
  if(!C||!C.stream)return;C.facing=C.facing==='environment'?'user':'environment';
  navigator.mediaDevices.getUserMedia({video:{facingMode:C.facing}}).then(function(st){
    var nt=st.getVideoTracks()[0],old=C.stream.getVideoTracks()[0];
    var snd=C.pc.getSenders().find(function(s){return s.track&&s.track.kind==='video';});if(snd)snd.replaceTrack(nt);
    if(old){C.stream.removeTrack(old);old.stop();}C.stream.addTrack(nt);$('lv').srcObject=C.stream;
    $('lv').style.transform=C.facing==='user'?'scaleX(-1)':'none';
  }).catch(function(){toast('Could not switch camera');});
}
function callCleanup(msg){
  if(!C)return;ring(false);clearTimeout(C.pollT);clearTimeout(C.tickT);
  try{if(C.ac)C.ac.close();}catch(e){}
  try{if(C.pc)C.pc.close();}catch(e){}
  if(C.stream)C.stream.getTracks().forEach(function(t){t.stop();});
  ['rv','lv'].forEach(function(id){$(id).srcObject=null;$(id).classList.add('hidden');});$('ra').srcObject=null;
  C=null;$('call').classList.add('hidden');if(msg)toast(msg);
  if(S.tab==='calls'&&!S.open)renderList();
}
function watchIncoming(){
  setInterval(function(){
    if(C||document.hidden)return;
    api('GET','/calls/incoming').then(function(j){
      if(!j.call||C)return;
      C={id:j.call.id,threadId:j.call.threadId,kind:j.call.kind,name:j.call.fromName,offer:j.call.offer,incoming:true,pendingIce:[],iceSeen:0};
      callUI(j.call.kind==='video'?'Incoming video call…':'Incoming voice call…');ring(true);
      (function waitEnd(){if(!C||C.id!==j.call.id||C.pc)return;api('GET','/calls/'+C.id).then(function(s){if(C&&!C.pc&&s.status==='ended')callCleanup('Missed call');else setTimeout(waitEnd,1500);}).catch(function(){});})();
    }).catch(function(){});
  },3000);
}

/* ── boot ── */
api('GET','/me').then(function(j){S.me=j;loadThreads();watchIncoming();S.listT=setInterval(function(){if(!S.open&&!document.hidden)loadThreads();},5000);}).catch(signedOut);
})();
</script>
