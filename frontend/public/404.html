<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found — ScanGym</title>
<style>
  :root{--orange:#FF6D00;}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#0B0B0D;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       padding:32px 20px;text-align:center}
  .wrap{max-width:420px}
  .badge{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
         color:var(--orange);border:1px solid rgba(255,109,0,.35);background:rgba(255,109,0,.08);
         border-radius:999px;padding:6px 12px}
  h1{font-size:26px;line-height:1.25;margin:20px 0 10px}
  p{color:rgba(255,255,255,.62);font-size:15px;line-height:1.55;margin:0 0 24px}
  .btns{display:flex;flex-direction:column;gap:10px}
  a.btn{display:block;padding:14px 18px;border-radius:14px;text-decoration:none;font-weight:700;font-size:15px}
  a.primary{background:var(--orange);color:#0B0B0D}
  a.ghost{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:#fff}
  .foot{margin-top:22px;font-size:12px;color:rgba(255,255,255,.32)}
</style>
</head>
<body>
  <div class="wrap">
    <span class="badge">Error 404</span>
    <h1>We can’t find that page</h1>
    <p>The link may be old or mistyped. Everything still works — jump back in below.</p>
    <div class="btns">
      <a class="btn primary" href="/">Find a gym</a>
      <a class="btn ghost" href="/book">Book a session</a>
      <a class="btn ghost" href="/partner">List your gym</a>
    </div>
    <p class="foot">Still stuck? Email help1@scangym.org and we’ll sort it.</p>
  </div>
</body>
</html>
