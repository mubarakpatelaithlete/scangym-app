<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ScanGym - Book a Gym. Anywhere.</title>
<meta name="description" content="Find and book gyms near you. 24-hour day passes, QR entry, no membership needed.">

<!-- Preconnect to critical origins (eliminate DNS+TCP+TLS latency) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://js.stripe.com" crossorigin>
<link rel="preconnect" href="https://maps.googleapis.com">
<link rel="preconnect" href="https://maps.gstatic.com" crossorigin>

<!-- DNS prefetch for secondary domains (resolve DNS in parallel) -->
<link rel="dns-prefetch" href="https://api.stripe.com">
<link rel="dns-prefetch" href="https://lh3.googleusercontent.com">
<link rel="dns-prefetch" href="https://streetviewpixels-pa.googleapis.com">
<link rel="dns-prefetch" href="https://places.googleapis.com">

<!-- Preload critical resources (browser fetches immediately, high priority) -->
<link rel="preload" href="/styles.css" as="style">
<link rel="preload" href="/app.ctr575.js" as="script" fetchpriority="high">

<!-- Pre-compiled Tailwind CSS (replaces CDN runtime — 5KB gzip vs 100KB JS) -->
<link rel="stylesheet" href="/styles.css">

<!-- Fonts: reduced to 3 weights (400, 600, 700) with display=swap -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet"></noscript>

<!-- Critical CSS inlined (above-the-fold renders instantly without external CSS) -->
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:#0f172a;color:#e2e8f0;-webkit-font-smoothing:antialiased}
h1,h2,h3,.font-brand{font-family:'Sora',sans-serif}
#app{min-height:100vh}
.fade-in{animation:fi .3s ease-in}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.gym-card:hover{transform:translateY(-4px);box-shadow:0 12px 40px rgba(249,115,22,.15)}
.gym-card{transition:all .2s}
.badge{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
.skeleton{background:linear-gradient(90deg,#1e293b 25%,#334155 50%,#1e293b 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>

<!-- Speculation Rules for instant page transitions (Chrome 121+) -->
<script type="speculationrules">
{
  "prerender": [{
    "where": { "href_matches": "/*" },
    "eagerness": "moderate"
  }],
  "prefetch": [{
    "where": { "href_matches": "/*" },
    "eagerness": "moderate"
  }]
}
</script>

</head>
<body class="bg-dark min-h-screen">
<div id="app">
  <!-- Skeleton UI: shown instantly, replaced when app.js renders (v5 — bottom tab only) -->
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:0 24px;text-align:center">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:40px">
      <span style="font-size:28px">🏋️</span>
      <span style="font-family:Sora,sans-serif;font-weight:800;font-size:24px;color:white">Scan<span style="color:#F97316">Gym</span></span>
    </div>
    <div class="skeleton" style="width:100%;max-width:320px;height:48px;border-radius:14px;margin:0 auto 12px"></div>
    <div class="skeleton" style="width:100%;max-width:320px;height:48px;border-radius:14px;margin:0 auto 16px"></div>
    <div class="skeleton" style="width:200px;height:16px;border-radius:8px;margin:0 auto"></div>
  </div>
  <!-- Skeleton tab bar (matches JS BottomTabBar order: Reels | Book | Profile) -->
  <div style="position:fixed;bottom:0;left:0;right:0;height:64px;background:rgba(10,10,22,.97);display:flex;align-items:center;justify-content:space-around;border-top:1px solid rgba(255,255,255,.08);padding-bottom:env(safe-area-inset-bottom,0)">
    <div style="text-align:center"><span style="font-size:24px">🎬</span><br><span style="font-size:10px;color:#f97316;font-weight:600">Reels</span></div>
    <div style="text-align:center;opacity:.45"><span style="font-size:24px">🏋️</span><br><span style="font-size:10px;color:rgba(255,255,255,.4);font-weight:600">Book</span></div>
    <div style="text-align:center;opacity:.45"><span style="font-size:24px">👤</span><br><span style="font-size:10px;color:rgba(255,255,255,.4);font-weight:600">Profile</span></div>
  </div>
</div>

<!-- Prefetch config data while JS loads (eliminates render-block wait) -->
<script>window.__configPromise=fetch('/api/config').then(r=>r.json()).catch(()=>({mapsKey:'',stripeKey:'',brand:'ScanGym',gymCount:1200000,liveSearch:true}));</script>

<!-- Register service worker for instant repeat visits -->
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
  });
}
</script>

<script src="/robust-location.js" defer></script>
<script src="/app.ctr575.js" defer></script>
</body>
</html>
