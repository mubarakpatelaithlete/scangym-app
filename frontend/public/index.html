<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ScanGym - Book a Gym. Anywhere.</title>
<meta name="description" content="Find and book gyms near you. 24-hour day passes, QR entry, no membership needed.">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{colors:{brand:'#F97316',accent:'#00e676',dark:'#0f172a',card:'#1e293b'}}}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif;background:#0f172a;color:#e2e8f0}h1,h2,h3,.font-brand{font-family:'Sora',sans-serif}.fade-in{animation:fi .3s ease-in}@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.gym-card:hover{transform:translateY(-4px);box-shadow:0 12px 40px rgba(249,115,22,.15)}.gym-card{transition:all .2s}.badge{animation:pulse 2s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}</style>
</head>
<body class="bg-dark min-h-screen">
<div id="app"></div>
<script src="/robust-location.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
