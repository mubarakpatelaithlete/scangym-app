<!-- Perf Round 1: USP banner rendered statically (was injected by JS 2s late, which
     made it the LCP element and pushed LCP to ~8s under mobile throttling). -->
<div id="sg-usp-banner" style="position:fixed;top:0;left:0;right:0;z-index:var(--sg-z-usp,9800);background:linear-gradient(90deg,rgba(255,109,0,.95),rgba(230,98,0,.95));padding:6px 12px;text-align:center;font-size:11px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px">&#127947;&#65039; <span>30 gyms in 30 days &mdash; No subscription. Pay only when you go.</span> <span onclick="this.parentElement.style.display='none'" style="opacity:.6;font-size:14px;cursor:pointer;margin-left:8px">&#10005;</span></div>
<!-- The USP banner is position:fixed, so it reserved no space and simply sat on top
     of the first rows of .sg-tab-content — on Book it covered "Showing gyms in
     Boardman", on Profile it covered the promo strip. Measure it and offset the
     scroll container while it is on screen, then release the offset when it goes. -->
<script>(function(){
  /* Top spacing for the fixed promo banners is owned by sg-dock.js, which
     stacks #sg-usp-banner then #sg-sps and sets the matching padding-top on
     .sg-tab-content. Adding a second offset here double-counted the banner
     height and pushed the sticky strip down onto the location banner. This
     block now only auto-dismisses the banner and lets sg-dock re-layout. */
  var b=document.getElementById('sg-usp-banner');
  if(!b)return;
  setTimeout(function(){
    if(!b.parentElement)return;
    b.style.transition='opacity 1s';
    b.style.opacity='0';
    setTimeout(function(){b.remove();},1000);
  },7000);
})();</script>

<script>
/* PERF: lazy-load non-first-paint patch scripts (partner/admin/wallet tooling)
   after the load event, at idle — keeps ~180KB of JS off the critical path. */
(function(){
  var LAZY=['/partner-editable.js?v=1.3','/smart-lock-finder.js?v=1.1','/batch2.js?v=1.5','/batch3.js?v=1.3','/batch4.js?v=1.0','/wallet-withdraw.js?v=1.2','/admin-dashboard.js?v=1.0','/nps-survey.js?v=1.0','/ux-v5-improvements.js?v=1.0','/ux-v6-speed.js?v=1.0'];
  function load(){LAZY.forEach(function(src){var s=document.createElement('script');s.src=src;s.defer=true;document.head.appendChild(s);});}
  function idle(){('requestIdleCallback' in window)?requestIdleCallback(load,{timeout:2000}):setTimeout(load,300);}
  if(document.readyState==='complete'){idle();}else{window.addEventListener('load',idle);}
})();
</script>
