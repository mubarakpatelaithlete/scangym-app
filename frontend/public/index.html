<!-- The app renders its headings client-side, so the document shipped with no
     <h1> at all: Google saw a page whose main heading was nothing. This is the
     one true heading for the shell; visible headings inside the app can repeat
     as <h2>. Clipped rather than display:none so it still counts. -->
<h1 style="position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0">Book a gym day pass anywhere — ScanGym</h1>
<!-- Perf Round 1: USP banner rendered statically (was injected by JS 2s late, which
     made it the LCP element and pushed LCP to ~8s under mobile throttling). -->
<!-- Task 64 (owner, 2026-10-01): the "30 gyms in 30 days" banner is gone — it covered the Home category tabs. -->
<!-- The USP banner is position:fixed, so it reserved no space and simply sat on top
     of the first rows of .sg-tab-content — on Book it covered "Showing gyms in
     Boardman", on Profile it covered the promo strip. Measure it and offset the
     scroll container while it is on screen, then release the offset when it goes. -->
