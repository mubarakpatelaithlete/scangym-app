<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Everything ScanGym — every way to use it</title>
<meta name="description" content="Every place ScanGym works: the app tabs, the messengers and AI assistants it lives in, the stores it ships from, and the tools built into it.">
<link rel="canonical" href="https://scangym.com/everything">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="/manifest.json">
<style>
  :root{--bg:#0f172a;--card:rgba(255,255,255,.055);--line:rgba(255,255,255,.12);--txt:#fff;--dim:rgba(255,255,255,.55);--orange:#ff6a1a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:96px}
  header{padding:26px 18px 10px;max-width:760px;margin:0 auto}
  h1{font-size:26px;line-height:1.15;margin:0 0 6px;font-weight:800;letter-spacing:-.02em}
  .sub{color:var(--dim);font-size:14px;margin:0}
  main{max-width:760px;margin:0 auto;padding:0 18px}
  section{margin:22px 0 0}
  h2{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);font-weight:700;margin:0 0 10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  a.item,div.item{display:flex;flex-direction:column;gap:3px;padding:13px 13px 12px;border:1px solid var(--line);border-radius:14px;background:var(--card);text-decoration:none;color:inherit;transition:transform .12s,border-color .12s}
  a.item:active{transform:scale(.975)}
  a.item:hover{border-color:rgba(255,255,255,.28)}
  .item .name{font-weight:650;font-size:14.5px;display:flex;align-items:center;gap:7px}
  .item .why{font-size:11.5px;color:var(--dim)}
  .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .dot.live{background:#22c55e;box-shadow:0 0 6px rgba(34,197,94,.7)}
  .dot.soon{background:#f59e0b}
  .item.pending{opacity:.62}
  .count{display:inline-block;margin-top:10px;font-size:12px;color:var(--dim)}
  footer{max-width:760px;margin:30px auto 0;padding:0 18px;color:var(--dim);font-size:12px}
  a.back{color:var(--orange);text-decoration:none;font-weight:600}
  .skeleton{height:64px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <h1>Everything ScanGym</h1>
  <p class="sub">Every way to use ScanGym, in one place. Green means it works right now; amber is on the way.</p>
  <span class="count" id="count"></span>
</header>
<main id="root">
  <div class="grid">
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
  </div>
</main>
<footer>
  <p><a class="back" href="/more/profile">&larr; Back to ScanGym</a></p>
</footer>
<script src="/everything/everything.js" defer></script>
</body>
</html>
