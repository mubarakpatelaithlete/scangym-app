        if(absD > screenH * SNAP_THRESHOLD || absV > SNAP_VELOCITY){
          if(dragDelta < 0){
            next = currentIndex + 1; // snapTo handles bounds + load-more
          } else if(dragDelta > 0 && currentIndex > 0){
            next = currentIndex - 1;
          }
        }
        snapTo(next, true);
        if(next !== currentIndex && navigator.vibrate) navigator.vibrate(10);

        if(hint){
          var h = hint;
          hint = null;
          h.style.opacity = '0';
          h.style.transition = 'opacity .3s';
          setTimeout(function(){ if(h.parentNode) h.parentNode.removeChild(h); }, 400);
        }
      }, {passive: true});

      document.body.addEventListener('touchmove', function(e){
        if(isDragging) e.preventDefault();
      }, {passive: false});

      // ── ⑱ Desktop wheel — improved trackpad/mouse handling ──
      var wheelAccum    = 0;
      var wheelLock     = false;
      var wheelResetId  = null;
      var lastWheelTime = 0;

      window.addEventListener('wheel', function(e){
        if(!searchPanel.hidden) return;
        e.preventDefault();
        if(wheelLock) return;

        var now = Date.now();
        var dt = now - lastWheelTime;
        lastWheelTime = now;

        // Detect trackpad vs mouse: trackpad sends many small deltas quickly
        var isTrackpad = dt < 50 && Math.abs(e.deltaY) < 40;
        var threshold = isTrackpad ? 80 : 50;

        wheelAccum += e.deltaY;
        if(wheelResetId) clearTimeout(wheelResetId);
        wheelResetId = setTimeout(function(){ wheelAccum = 0; }, isTrackpad ? 200 : 150);

        if(Math.abs(wheelAccum) > threshold){
          wheelLock = true;
          var dir = wheelAccum > 0 ? 1 : -1;
          wheelAccum = 0;
          setTimeout(function(){ wheelLock = false; }, SNAP_DURATION + 50); // Ultra-fast: was +80 (170ms cooldown vs 360ms)
          var next = currentIndex + dir;
          if(next >= 0 && next < allVideos.length){
            snapTo(next, true);
          }
        }
      }, {passive: false});

      // ── Keyboard nav ──
      document.addEventListener('keydown', function(e){
        if(!searchPanel.hidden){if(e.key === 'Escape') closeReelsSearch();return;}
        if(e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
        if(e.key === ' '){ e.preventDefault(); tapPlayPause(renderedReels[currentIndex]); return; }
        if(e.key === 'l' && allVideos[currentIndex]){ toggleSocial('like', allVideos[currentIndex]); return; }
        if(e.key === 'c' && allVideos[currentIndex]){ openComments(allVideos[currentIndex]); return; }
        if(e.key === 'ArrowDown' || e.key === 'j'){
          snapTo(currentIndex + 1, true); // snapTo handles bounds + load-more
        } else if(e.key === 'ArrowUp' || e.key === 'k'){
          if(currentIndex > 0) snapTo(currentIndex - 1, true);
        } else if(e.key === 'm'){
          toggleMute();
        }
      });

      // ═══════════════════════════════════════════════════════════
      //  SNAP ENGINE
      // ═══════════════════════════════════════════════════════════

      function setTrackPosition(y){
        track.style.transform = 'translate3d(0,' + y + 'px,0)';
      }

      function snapTo(index, animate){
        if(index < 0) return;
        // Wall-hit: if user tries to go past loaded reels, trigger load-more but stay put
        if(index >= allVideos.length){
          if(feedHasMore){
            pendingAdvance = true; // auto-advance when data arrives
            if(!feedLoading) loadMoreFeed();
          }
          return;
        }
        var prevIndex = currentIndex;
        currentIndex  = index;
        sgRememberWatch(allVideos[index]);
        // H7 FIX: Persist reel position so it survives tab-switches & reloads
        try { sessionStorage.setItem('sg_reel_idx', String(index)); } catch(e){}
        trackOffset   = -(index * screenH);
        if(animate){
          track.classList.add('snapping');
          setTimeout(function(){ track.classList.remove('snapping'); }, SNAP_DURATION + 10);
        }
        setTrackPosition(trackOffset);
        reconcileWindow(index);
        // One YouTube iframe, on the slide you are looking at. Mounting happens
        // after reconcileWindow so the target slide's DOM exists.
        syncSocialEmbeds(index);
        updateReelCounter(); // FIX: update counter on every navigation
        if(prevIndex !== index){
          // M4 fix: Update URL to reflect current reel (enables sharing from address bar)
          try {
            var vid = allVideos[index];
            if(vid && vid.id){
              var newUrl = window.location.pathname + '?v=' + encodeURIComponent(vid.id);
              window.history.replaceState(null, '', newUrl);
            }
          } catch(e){}
          // ⑯ Audio crossfade
          crossfadeTransition(prevIndex, index);
          // FIX #5: Use smart prefetch with abort controller for far-away fetches
          smartPrefetch(index);
          prefetchAhead(index);
          applySmartPreload(index);
          // ⑨ Check if we need to load more
          if(allVideos.length - index <= LOAD_MORE_AT && feedHasMore && !feedLoading){
            loadMoreFeed();
          }
          // ⑬ Sound hint — show on the FIRST reel (index 0), not the second
          if(!soundHintShown && isMuted && index === 0){
            soundHintShown = true;
            showSoundHint();
          }
        }
      }

      // ═══════════════════════════════════════════════════════════
      //  ⑯ CROSSFADE TRANSITION
      // ═══════════════════════════════════════════════════════════

      // ═══════════════════════════════════════════════════════════
      //  G7 FIX: FULL ANALYTICS — views, likes, shares, saves, CTA clicks
      //  Sends to POST /api/reels/analytics with session_id + new event format
      //  so data populates reel_views, reel_interactions, AND video_performance
      // ═══════════════════════════════════════════════════════════
      var _sgSessionId = (function(){
        try {
          var key = 'sg_analytics_sid';
          var sid = sessionStorage.getItem(key);
          if(!sid){
            sid = Date.now().toString(36) + Math.random().toString(36).slice(2,10);
            sessionStorage.setItem(key, sid);
          }
          return sid;
        } catch(e){ return 'anon_' + Math.random().toString(36).slice(2,10); }
      })();

      var eventBuffer = []; // batch all analytics events
      var ANALYTICS_FLUSH_INTERVAL = 10000; // flush every 10s

      function trackEvent(action, index, extras){
        if(index < 0 || index >= allVideos.length) return;
        var video = allVideos[index];
        var evt = {
          video_id: video.id || String(index),
          category: video.category || '',
          action: action
        };
        if(extras){
          if(extras.watch_ms !== undefined) evt.watch_ms = Math.round(extras.watch_ms);
          if(extras.watch_pct !== undefined) evt.watch_pct = Math.round(extras.watch_pct);
        }
        eventBuffer.push(evt);
      }

      // Backward-compat wrapper — existing onReelChange calls this
      function trackView(index, durationMs, watchPercent){
        var watchPct = Math.round((watchPercent || 0) * 100);
        var action = (durationMs < 1500 && watchPct < 15) ? 'skip' : 'view';
        trackEvent(action, index, { watch_ms: durationMs, watch_pct: watchPct });
      }

      function flushAnalytics(){
        if(eventBuffer.length === 0) return;
        var batch = eventBuffer.splice(0, eventBuffer.length);
        var payload = JSON.stringify({ session_id: _sgSessionId, events: batch });
        // Prefer sendBeacon (works on tab close), fall back to fetch
        if(navigator.sendBeacon){
          navigator.sendBeacon('/api/reels/analytics', new Blob([payload], {type:'application/json'}));
        } else {
          fetch('/api/reels/analytics', {method:'POST', headers:{'Content-Type':'application/json'}, body:payload}).catch(function(){});
        }
      }

      setInterval(flushAnalytics, ANALYTICS_FLUSH_INTERVAL);
      document.addEventListener('visibilitychange', function(){
        if(document.visibilityState === 'hidden') flushAnalytics();
      });

      // ═══════════════════════════════════════════════════════════
      //  FIX C2: Listen for commands from parent app
      // ═══════════════════════════════════════════════════════════
      var _reelsWasPaused = false; // track if we were paused by parent

      window.addEventListener('message', function(e){
        if(!e.data || !e.data.type) return;
        switch(e.data.type){
          case 'sg-reels-visibility':
            if(e.data.visible){
              // Tab switched TO reels — resume playback
              if(_reelsWasPaused){
                _reelsWasPaused = false;
                playVideo(currentIndex);
              }
              // A social slide has no <video> to resume: remount its embed.
              syncSocialEmbeds(currentIndex);
            } else {
              // Tab switched AWAY from reels — pause to save battery/data
              var reel = renderedReels[currentIndex];
              if(reel){
                var vid = reel.querySelector('video');
                if(vid && !vid.paused){
                  _reelsWasPaused = true;
                  vid.pause();
                  stopProgressLoop();
                }
              }
              // An iframe cannot be paused from here, so drop it — otherwise a
              // YouTube reel keeps playing audio behind another tab.
              unmountSocialEmbed(currentIndex);
              flushAnalytics();
            }
            break;
          case 'sg-reels-mute':
            // Parent wants to sync mute state
            if(typeof e.data.muted === 'boolean'){
              isMuted = e.data.muted;
              try { localStorage.setItem('sg_muted', isMuted ? '1' : '0'); } catch(e2){}
              var reel = renderedReels[currentIndex];
              if(reel){
                var vid = reel.querySelector('video');
                if(vid) vid.muted = isMuted;
                applySocialMute(reel.querySelector('.reel-social-embed iframe'));
              }
              var btn = document.querySelector('.mute-btn');
              if(btn) btn.textContent = isMuted ? '\uD83D\uDD07' : '\uD83D\uDD0A';
            }
            break;
          case 'sg-reels-get-status':
            // Parent requesting current status
            _sendStatusToParent();
            break;
        }
      });

      // G5 fix: Navigate via parent postMessage when inside iframe, else direct
      function _ctaNavigate(path){
        trackEvent('cta_click', currentIndex); // G7 fix: track CTA clicks
        flushAnalytics(); // flush before navigating away
        if(window.parent && window.parent !== window){
          window.parent.postMessage({type:'sg-navigate', path: path}, '*');
        } else {
          window.location.href = path;
        }
      }

      function _sendStatusToParent(){
        if(window.parent && window.parent !== window){
          var vid = renderedReels[currentIndex] ? renderedReels[currentIndex].querySelector('video') : null;
          window.parent.postMessage({
            type: 'sg-reels-status',
            index: currentIndex,
            total: feedServerTotal || allVideos.length, // G3 fix: use server total for consistent count
            playing: vid ? !vid.paused : false,
            muted: isMuted,
            video: currentIndex < allVideos.length ? {
              name: allVideos[currentIndex].name || '',
              category: allVideos[currentIndex].category || ''
            } : null
          }, '*');
        }
      }

      // Notify parent that reels player is ready
      if(window.parent && window.parent !== window){
        window.parent.postMessage({type:'sg-reels-ready'}, '*');
      }

      // Track time spent on each reel
      var viewStartTime = Date.now();
      var viewStartIndex = 0;

      function onReelChange(prevIndex, nextIndex){
        var now = Date.now();
        var elapsed = now - viewStartTime;
        if(prevIndex >= 0 && prevIndex < allVideos.length){
          var vid = renderedReels[prevIndex] ? renderedReels[prevIndex].querySelector('video') : null;
          var watchPct = (vid && vid.duration && !isNaN(vid.duration)) ? vid.currentTime / vid.duration : 0;
          trackView(prevIndex, elapsed, watchPct);
        }
        viewStartTime = now;
        viewStartIndex = nextIndex;
        // FIX C2: Notify parent of reel change
        _sendStatusToParent();
      }

      function crossfadeTransition(prevIndex, nextIndex){
        clearAllFades();
        if(autoScrollTimer){ clearTimeout(autoScrollTimer); autoScrollTimer = null; }
        stopQualityAdaptation(); // Stop adaptation for previous video
        onReelChange(prevIndex, nextIndex);

        // Pause previous with fade-out
        var prevReel = renderedReels[prevIndex];
        if(prevReel){
          var prevVid = prevReel.querySelector('video');
          if(prevVid){
            if(!isMuted && prevVid.volume > 0){
              fadeVolume(prevVid, prevVid.volume, 0, CROSSFADE_MS, function(){
                prevVid.pause();
                prevVid.currentTime = 0;
              });
            } else {
              prevVid.pause();
              prevVid.currentTime = 0;
            }
            var bar = prevReel.querySelector('.reel-progress-bar');
            if(bar) bar.style.width = '0%';
            var buf = prevReel.querySelector('.reel-progress-buffered');
            if(buf) buf.style.width = '0%';
          }
        }
        stopProgressLoop();

        // Play next with fade-in
        var nextReel = renderedReels[nextIndex];
        if(nextReel){
          var nextVid = nextReel.querySelector('video');
          if(nextVid){
            nextVid.muted = isMuted;
            if(!isMuted){
              nextVid.volume = 0;
              nextVid.play().then(function(){
                removeTapOverlay(nextReel);
              }).catch(function(){
                // Fallback: force muted play — but keep user preference intact
                nextVid.muted = true;
                nextVid.play().then(function(){
                  removeTapOverlay(nextReel);
                  if(!isMuted) showSoundHint();
                }).catch(function(){
                  showTapToPlay(nextReel, nextVid, nextIndex);
                });
              });
              fadeVolume(nextVid, 0, 1, CROSSFADE_MS);
            } else {
              nextVid.play().then(function(){
                removeTapOverlay(nextReel);
              }).catch(function(){
                showTapToPlay(nextReel, nextVid, nextIndex);
              });
            }
            startProgressLoop(nextReel, nextVid);
            capturePoster(nextVid, nextIndex);
            // ⑰ Remove canvas preview once video plays
            nextVid.addEventListener('playing', function onPlay(){
              nextVid.removeEventListener('playing', onPlay);
              nextVid.classList.add('has-frame');
              removeFramePreview(nextReel);
            }, {once: true});

            // ── AUTO-SCROLL: advance to next reel when video ends ──
            nextVid.addEventListener('ended', function onEnded(){
              nextVid.removeEventListener('ended', onEnded);
              // Small pause (800ms) before auto-advancing for a smooth feel
              autoScrollTimer = setTimeout(function(){
                if(currentIndex === nextIndex && !isDragging){
                  snapTo(currentIndex + 1, true);
                }
              }, 800);
            }, {once: true});
          }
        }
      }

      // ═══════════════════════════════════════════════════════════
      //  VIRTUAL DOM WINDOW — ⑮ uses video pool
      // ═══════════════════════════════════════════════════════════

      function reconcileWindow(centerIndex){
        // OPTIMIZATION #4: Shrink render window under memory pressure
        var renderWin = memoryWarning ? 2 : RENDER_WINDOW;
        var minIdx = Math.max(0, centerIndex - renderWin);
        var maxIdx = Math.min(allVideos.length - 1, centerIndex + renderWin);

        // Remove elements outside window
        var keys = Object.keys(renderedReels);
        for(var k = 0; k < keys.length; k++){
          var idx = parseInt(keys[k]);
          if(idx < minIdx || idx > maxIdx){
            var el = renderedReels[idx];
            // ⑮ Release video back to pool instead of destroying
            releaseVideo(idx);
            track.removeChild(el);
            delete renderedReels[idx];
          }
        }

        // Add missing elements within window
        for(var i = minIdx; i <= maxIdx; i++){
          if(!renderedReels[i]){
            var reel = createReel(allVideos[i], i);
            track.appendChild(reel);
            renderedReels[i] = reel;
          }
        }
        pinActiveRow();
      }

      /* Task 12 (owner, 2026-09-30): "when scrolling on home page - button also
         scrolls or moves with reel". Each reel builds its own row, and the row
         lived inside the slide, so it rode the track while you swiped. Now the
         row of the reel in front of you is moved into one fixed host outside the
         track (the same node, so its click handlers come with it) and goes back
         to its slide when another reel takes over. Swiping moves the video; the
         buttons stay put, as on TikTok, Shorts and Reels. */
      var rowHost = null;
      function pinActiveRow(){
        loadSocialSoon();
        if(!rowHost){
          rowHost = document.createElement('div');
          rowHost.id = 'sg-reel-row-host';
          document.body.appendChild(rowHost);
        }
        var reel = renderedReels[currentIndex];
        var held = rowHost.querySelector('.reel-actions');
        if(held && held._sgHome === reel) return;
        if(held){
          if(held._sgHome && held._sgHome.isConnected) held._sgHome.appendChild(held);
          else rowHost.removeChild(held);
        }
        if(!reel) return;
        var row = reel.querySelector(':scope > .reel-actions');
        if(!row) return;
        row._sgHome = reel;
        rowHost.appendChild(row);
      }

      // FIX #2: Smart preloading — preload current + next 3 fully (was 2)
      function applySmartPreload(centerIndex){
        var keys = Object.keys(renderedReels);
        for(var k = 0; k < keys.length; k++){
          var idx = parseInt(keys[k]);
          var el  = renderedReels[idx];
          var vid = el.querySelector('video');
          if(!vid) continue;
          // Preload current + next 3 videos fully, rest metadata only
          vid.preload = sgDataSaver() ? (idx === centerIndex ? 'auto' : 'none') : ((idx >= centerIndex - 1 && idx <= centerIndex + 3) ? 'auto' : 'metadata');
          // FIX #2: Force load for next video if it hasn't started
          if(idx === centerIndex + 1 && vid.readyState < 1){
            vid.load();
          }
        }
      }

      function upgradePreload(index){
        var el = renderedReels[index];
        if(!el) return;
        var vid = el.querySelector('video');
        if(!vid) return;
        vid.preload = 'auto';
        if(vid.readyState < 2) vid.load();
        // Also upgrade the one after
        var el2 = renderedReels[index + 1];
        if(el2){
          var vid2 = el2.querySelector('video');
          if(vid2){ vid2.preload = 'auto'; if(vid2.readyState < 2) vid2.load(); }
        }
      }

      // ═══════════════════════════════════════════════════════════
      //  VIDEO MANAGEMENT
      // ═══════════════════════════════════════════════════════════

      function playVideo(i){
        var reel = renderedReels[i];
        if(!reel) return;
        var vid = reel.querySelector('video');
        if(!vid) return;
        vid.muted = isMuted;

        // OPTIMIZATION #3b: Connection-aware poster holding
        // On slow connections, wait for enough buffer before playing
        var bufThreshold = getBufferThreshold();
        function doPlay(){
          var playAttempt = vid.play();
          if(playAttempt && typeof playAttempt.then === 'function'){
            playAttempt.then(function(){
              // Autoplay succeeded — remove any tap-to-play overlay
              removeTapOverlay(reel);
            }).catch(function(err){
              // Autoplay blocked — retry muted but DON'T overwrite user's
              // stored preference. Just mute this playback attempt.
              vid.muted = true;
              var retry = vid.play();
              if(retry && typeof retry.then === 'function'){
                retry.then(function(){
                  removeTapOverlay(reel);
                  if(!isMuted) showSoundHint(); // user wanted sound — show hint to tap
                }).catch(function(){
                  // Autoplay truly blocked — show tap-to-play overlay
                  showTapToPlay(reel, vid, i);
                });
              }
            });
          }
          // OPTIMIZATION #1b: Start quality adaptation for current video
          startQualityAdaptation(vid, i);
        }

        if(bufThreshold > 0){
          // Wait for buffer before playing (shows poster/blurhash longer)
          vid.preload = 'auto';
          vid.load();
          waitForBuffer(vid, bufThreshold, doPlay);
        } else {
          doPlay();
        }

        startProgressLoop(reel, vid);
        capturePoster(vid, i);

        // ── AUTO-SCROLL: advance to next reel when video ends ──
        vid.addEventListener('ended', function onEnded(){
          vid.removeEventListener('ended', onEnded);
          autoScrollTimer = setTimeout(function(){
            if(currentIndex === i && !isDragging){
              snapTo(currentIndex + 1, true);
            }
          }, 800);
        }, {once: true});
      }

      // ── Tap-to-play fallback when autoplay is blocked ──
      function showTapToPlay(reel, vid, index){
        if(reel.querySelector('.tap-to-play')) return;
        var overlay = document.createElement('div');
        overlay.className = 'tap-to-play';
        overlay.style.cssText = 'position:absolute;top:0;left:0;right:0;bottom:0;z-index:16;'
          + 'display:flex;flex-direction:column;align-items:center;justify-content:center;'
          + 'cursor:pointer;background:rgba(0,0,0,0.3);';
        overlay.innerHTML = '<div style="width:72px;height:72px;border-radius:50%;'
          + 'background:rgba(255,109,0,0.9);display:flex;align-items:center;justify-content:center;'
          + 'box-shadow:0 4px 24px rgba(255,109,0,0.4);">'
          + '<svg width="32" height="32" viewBox="0 0 24 24" fill="#fff" stroke="none">'
          + '<polygon points="6,3 20,12 6,21"/></svg></div>'
          + '<p style="color:#fff;font-size:14px;font-weight:600;margin-top:12px;'
          + 'text-shadow:0 1px 8px rgba(0,0,0,.8);">Tap to play</p>';
        overlay.addEventListener('click', function(){
          // Start muted to guarantee playback, then restore user preference
          vid.muted = true;
          vid.play().then(function(){
            removeTapOverlay(reel);
            // Restore user's saved mute preference after playback starts
            vid.muted = isMuted;
            if(!isMuted) vid.volume = 1;
          }).catch(function(){});
        }, {once: true});
        reel.appendChild(overlay);
      }

      function removeTapOverlay(reel){
        var o = reel.querySelector('.tap-to-play');
        if(o) o.remove();
      }

      // pauseVideo() removed (C4 fix) — was dead code, never called anywhere

      // ── PERF FIX #5: Enhanced poster capture with localStorage persistence ──
      // TikTok pre-generates thumbnails server-side. We capture first frame client-side
      // and persist to localStorage so repeat visits show posters instantly.
      var POSTER_STORAGE_KEY = 'sg_reel_posters_v1';
      var POSTER_MAX_STORED = 30; // Keep last 30 poster frames in localStorage

      // Load persisted posters on startup
      (function loadPersistedPosters(){
        try {
          var stored = localStorage.getItem(POSTER_STORAGE_KEY);
          if(stored){
            var parsed = JSON.parse(stored);
            // parsed is { cdnKey: dataUrl, ... }
            window._persistedPosters = parsed;
          }
        } catch(e){}
        if(!window._persistedPosters) window._persistedPosters = {};
      })();

      function getPersistedPoster(video){
        var key = video.cdnKey || video.id || '';
        return key ? (window._persistedPosters[key] || null) : null;
      }

      function persistPoster(video, dataUrl){
        var key = video.cdnKey || video.id || '';
        if(!key || !dataUrl) return;
        try {
          window._persistedPosters[key] = dataUrl;
          // Trim to max entries
          var keys = Object.keys(window._persistedPosters);
          if(keys.length > POSTER_MAX_STORED){
            var toRemove = keys.slice(0, keys.length - POSTER_MAX_STORED);
            for(var i = 0; i < toRemove.length; i++) delete window._persistedPosters[toRemove[i]];
          }
          localStorage.setItem(POSTER_STORAGE_KEY, JSON.stringify(window._persistedPosters));
        } catch(e){} // localStorage full — no big deal
      }

      function capturePoster(vid, index){
        if(posterCache[index]) return;
        var doCapture = function(){
          try{
            if(vid.videoWidth === 0 || vid.videoHeight === 0) return;
            var canvas = document.createElement('canvas');
            // PERF FIX #5: Smaller poster = faster decode (180px wide is enough for blur-up)
            var scale = Math.min(180 / vid.videoWidth, 320 / vid.videoHeight, 1);
            canvas.width  = Math.round(vid.videoWidth * scale);
            canvas.height = Math.round(vid.videoHeight * scale);
            var ctx = canvas.getContext('2d');
            ctx.drawImage(vid, 0, 0, canvas.width, canvas.height);
            var dataUrl = canvas.toDataURL('image/webp', 0.5);
            if(dataUrl && dataUrl.length > 100){
              posterCache[index] = dataUrl;
              vid.poster = dataUrl;
              // Persist for next visit
              if(index < allVideos.length) persistPoster(allVideos[index], dataUrl);
            }
          } catch(e){}
        };
        if(vid.readyState >= 2){
          requestAnimationFrame(doCapture);
        } else {
          vid.addEventListener('loadeddata', function onLoad(){
            vid.removeEventListener('loadeddata', onLoad);
            requestAnimationFrame(doCapture);
          });
        }
      }

      // ── rAF progress ──
      function startProgressLoop(reel, vid){
        stopProgressLoop();
        var bar = reel.querySelector('.reel-progress-bar');
        var buf = reel.querySelector('.reel-progress-buffered');
        if(!bar) return;
        function tick(){
          if(vid.duration && !isNaN(vid.duration)){
            bar.style.width = (vid.currentTime / vid.duration * 100) + '%';
            if(buf && vid.buffered.length > 0){
              buf.style.width = (vid.buffered.end(vid.buffered.length - 1) / vid.duration * 100) + '%';
            }
          }
          progressRafId = requestAnimationFrame(tick);
        }
        progressRafId = requestAnimationFrame(tick);
      }

      function stopProgressLoop(){
        if(progressRafId){ cancelAnimationFrame(progressRafId); progressRafId = null; }
      }

      // ── Prefetch — use fetch() + Cache API for real pre-download ──
      // PERF FIX #1 + #3: Fixed cache name (was hardcoded to v4), removed mode:'cors'
      // that was breaking CDN edge caching, added connection-aware prefetch depth
      /* Task 109 batch 3 (TikTok Data Saver): only the reel on screen downloads. */
      /* Task 109 batch 4 (TikTok Screen time): a gentle reminder after 30/60/90 min. */
      var sgScreenStart = Date.now();
      function sgScreenLimit(){ try { return parseInt(localStorage.getItem('sg_screen_limit') || '0', 10) || 0; } catch(e){ return 0; } }
      setInterval(function(){ var n = sgScreenLimit(); if(n && !document.hidden && Date.now() - sgScreenStart > n * 60000){ sgScreenStart = Date.now(); showToast('\u23F1\uFE0F You\u2019ve been watching for ' + n + ' min \u2014 time for a stretch or a workout?'); } }, 30000);
      function sgDataSaver(){ try { return localStorage.getItem('sg_data_saver') === '1'; } catch(e){ return false; } }
      function prefetchAhead(fromIndex){
        if(sgDataSaver()) return;
        // PERF FIX #3: Adaptive prefetch depth based on connection speed
        var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        var prefetchCount = PREFETCH_AHEAD;
        if(conn){
          var ect = conn.effectiveType;
          if(ect === 'slow-2g' || ect === '2g') prefetchCount = 1;
          else if(ect === '3g') prefetchCount = 3;
        }

        var urls = [];
        for(var i = fromIndex + 1; i <= fromIndex + prefetchCount && i < allVideos.length; i++){
          // OPTIMIZATION #1: Prefetch the quality variant matching current connection
          var url = resolveVideoUrl(allVideos[i]);
          // Task 156: YouTube/TikTok/Instagram links are pages, not media files — fetching them only burns data and fails CORS.
          if(!url || prefetchedUrls[url] || /youtube\.com|youtu\.be|tiktok\.com|instagram\.com/i.test(url)) continue;
          prefetchedUrls[url] = true;
          urls.push(url);
        }
        if(urls.length === 0) return;

        // CORS headers now enabled on cdn.scangym.com — safe to use cors mode
        if(window.caches){
          caches.open('reels-v8-video').then(function(cache){
            urls.forEach(function(url, idx){
              setTimeout(function(){
                cache.match(url).then(function(existing){
                  if(!existing){
                    fetch(url, { mode: 'cors', credentials: 'omit' }).then(function(resp){
                      if(resp.ok) cache.put(url, resp);
                    }).catch(function(){});
                  }
                });
              }, idx < 2 ? 0 : idx * 400);
            });
          });
        }

        // Also tell service worker to cache these videos
        if(navigator.serviceWorker && navigator.serviceWorker.controller){
          navigator.serviceWorker.controller.postMessage({ type: 'PRECACHE_VIDEOS', urls: urls });
        }
      }

      // ═══════════════════════════════════════════════════════════
      //  PAGINATED FEED
      // ═══════════════════════════════════════════════════════════

      var feedSeed = null; // seeded shuffle for consistent pagination

      function loadFeed(){
        feedLoading = true;

        // PERF: Use server-injected prefetched feed if available (skips ~800ms API call)
        var prefetchedPromise;
        if (window.__PREFETCHED_FEED) {
          prefetchedPromise = Promise.resolve(window.__PREFETCHED_FEED);
          window.__PREFETCHED_FEED = null; // free memory
        } else {
          // #9: Try geo-language feed first, fallback to regular
          var _userLang = (navigator.language || 'en').split('-')[0];
          prefetchedPromise = fetch('/api/reels/geo-feed?limit=' + PAGE_SIZE + '&offset=0&lang=' + _userLang)
            .then(function(r){
              if(!r.ok) throw new Error('Geo feed error');
              return r.json().then(function(d){ var vids = d.reels || d.videos || []; if(!vids.length) throw new Error('Geo feed empty'); return {videos: vids, total: d.total}; });
            })
            .catch(function(){
              return fetch('/api/reels/feed?limit=' + PAGE_SIZE + '&offset=0&shuffle=true')
                .then(function(r){ if(!r.ok) throw new Error('Feed error'); return r.json(); });
            });
        }

        prefetchedPromise
          .then(function(data){
            allVideos = data.videos || [];
            feedOffset = allVideos.length;
            feedHasMore = data.hasMore;
            feedSeed = data.seed; // save seed for consistent pagination
            feedServerTotal = data.total || allVideos.length;
            feedLoading = false;
            if(allVideos.length === 0){
              showFatalError('No reels available yet');
              return;
            }
            // PERF v2: Only decode blurhash for video 0 (current) synchronously.
            // Defer the rest to after first paint via requestIdleCallback.
            if(allVideos[0] && allVideos[0].blurhash && !posterCache[0]){
              var bh0 = decodeBlurHash(allVideos[0].blurhash, 4, 3);
              if(bh0) posterCache[0] = bh0;
            }
            // Check persisted poster for video 0 only
            if(!posterCache[0] && allVideos[0]){
              var pp0 = getPersistedPoster(allVideos[0]);
              if(pp0) posterCache[0] = pp0;
            }
            // Defer rest of blurhash + poster loading to after first paint
            var _deferPosterWork = function(){
              for(var i = 1; i < Math.min(allVideos.length, 5); i++){
                if(allVideos[i].blurhash && !posterCache[i]){
                  var bh = decodeBlurHash(allVideos[i].blurhash, 4, 3);
                  if(bh) posterCache[i] = bh;
                }
              }
              for(var i = 1; i < Math.min(allVideos.length, 10); i++){
                if(!posterCache[i]){
                  var pp = getPersistedPoster(allVideos[i]);
                  if(pp) posterCache[i] = pp;
                }
              }
            };
            if(window.requestIdleCallback) requestIdleCallback(_deferPosterWork);
            else setTimeout(_deferPosterWork, 100);

            // M4 fix: Deep-link support — if URL has ?v=ID, start at that reel
            var startIndex = 0;
            try {
              var urlParams = new URLSearchParams(window.location.search);
              var deepLinkId = urlParams.get('v');
              if(deepLinkId){
                for(var di = 0; di < allVideos.length; di++){
                  if(String(allVideos[di].id) === String(deepLinkId)){
                    startIndex = di;
                    break;
                  }
                }
              }
              /* A shared link whose reel is not on the first page: fetch the full
                 list once and put that reel first, so the link always opens it. */
              if(deepLinkId && startIndex === 0 && String((allVideos[0] || {}).id) !== String(deepLinkId)){
                fetch('/api/reels/feed?limit=200&offset=0&shuffle=false').then(function(r){ return r.json(); }).then(function(d){
                  var hit = (d.videos || []).filter(function(x){ return String(x.id) === String(deepLinkId); })[0];
                  if(hit) applyVideoList([hit].concat(allVideos.filter(function(x){ return String(x.id) !== String(deepLinkId); })), {hasMore: feedHasMore, total: feedServerTotal, offset: feedOffset});
                }).catch(function(){});
              }
            } catch(e){ /* URLSearchParams not supported — start at 0 */ }

            // H7 FIX: Restore saved reel position (only if no deep-link override)
            if(startIndex === 0){
              try {
                var saved = parseInt(sessionStorage.getItem('sg_reel_idx'), 10);
                if(!isNaN(saved) && saved > 0 && saved < allVideos.length){
                  startIndex = saved;
                }
              } catch(e){}
            }

            reconcileWindow(startIndex);
            syncSocialEmbeds(startIndex);
            loading.style.display = 'none';
            updateReelCounter(); // FIX: update counter after feed loads
            // FIX C1: Try play immediately, and also retry once video has data
            playVideo(startIndex);
            var firstReel = renderedReels[startIndex];
            if(firstReel){
              var firstVid = firstReel.querySelector('video');
              if(firstVid && firstVid.paused){
                firstVid.addEventListener('canplay', function onCanPlay(){
                  firstVid.removeEventListener('canplay', onCanPlay);
                  if(firstVid.paused && currentIndex === startIndex){
                    playVideo(startIndex);
                  }
                });
              }
            }
            // If deep-linked, snap to the correct position
            if(startIndex > 0){
              currentIndex = startIndex;
              trackOffset = -(startIndex * screenH);
              setTrackPosition(trackOffset);
            }
            // OPTIMIZATION #4: Start memory management loop
            startMemoryManagement();

            // OPTIMIZATION #5: Prefetch poster frames via SW for instant display
            // Poster frames are tiny (~10-30KB JPEG) — prefetch next 15 for zero-delay poster rendering
            if(navigator.serviceWorker && navigator.serviceWorker.controller){
              var posterUrls = [];
              for(var pi = 0; pi < Math.min(allVideos.length, 15); pi++){
                if(allVideos[pi].cdnKey){
                  posterUrls.push('/api/reels/poster/' + allVideos[pi].cdnKey);
                }
                if(allVideos[pi].posterUrl){
                  posterUrls.push(allVideos[pi].posterUrl);
                }
              }
              if(posterUrls.length > 0){
                navigator.serviceWorker.controller.postMessage({ type: 'PRECACHE_POSTERS', urls: posterUrls });
              }
            }

            // Defer prefetch to avoid competing with first video load
            setTimeout(function(){
              prefetchAhead(startIndex);
              applySmartPreload(startIndex);
            }, 500);
          })
          .catch(function(err){
            console.error('Feed load error:', err);
            feedLoading = false;
            showFatalError('Failed to load reels. Please try again.');
          });
      }

      function loadMoreFeed(){
        if(feedLoading || !feedHasMore) return;
        feedLoading = true;
        fetch('/api/reels/feed?limit=' + PAGE_SIZE + '&offset=' + feedOffset + '&shuffle=true'
          + (feedSeed ? '&seed=' + feedSeed : '')
          + (activeCategory ? '&category=' + encodeURIComponent(activeCategory) : ''))
          .then(function(r){
            if(!r.ok) throw new Error('Feed error');
            return r.json();
          })
          .then(function(data){
            var newVideos = data.videos || [];
            allVideos = allVideos.concat(newVideos);
            feedOffset += newVideos.length;
            feedHasMore = data.hasMore;
            // G3 FIX: Update the server total so counter stays consistent
            if(data.total) feedServerTotal = data.total;
            feedLoading = false;
            reconcileWindow(currentIndex);
            syncSocialEmbeds(currentIndex);
            updateReelCounter(); // FIX: update total when more reels load
            // Auto-advance if user was waiting at the wall
            if(pendingAdvance && currentIndex < allVideos.length - 1){
              pendingAdvance = false;
              snapTo(currentIndex + 1, true);
            }
          })
          .catch(function(err){
            console.error('Feed load more error:', err);
            feedLoading = false;
            // Retry after 2s if user is still waiting at the wall
            if(feedHasMore){
              setTimeout(function(){
                if(!feedLoading && currentIndex >= allVideos.length - 2) loadMoreFeed();
              }, 2000);
            }
          });
      }

      // ═══════════════════════════════════════════════════════════
      //  REEL ELEMENT CREATION — ⑮ uses video pool
      // ═══════════════════════════════════════════════════════════

      // ═══════════════════════════════════════════════════════════
      //  SOCIAL (YOUTUBE) REELS
      // ═══════════════════════════════════════════════════════════
      // Why this lives here and not in a patch file: every function and every
      // piece of state in this player is scoped to the IIFE that starts at the
      // top of this file. `allVideos` and `createReel` are not on window, so an
      // external script cannot reach them — the previous attempt
      // (reels/social-embed.js) polled for a global `allVideos` that never
      // existed and silently did nothing. Social support has to be part of the
      // player, not layered on top of it.
      //
      // The performance rule that killed the first attempt: one YouTube iframe
      // is ~2-3 MB of player JS. Mounting one per slide in a 20-slide feed is
      // what "iframe embeds degraded performance" meant. So: at most ONE iframe
      // exists at any moment, and only for the slide on screen.

      var mountedSocialIndex = null;

      function socialEmbedUrl(video){
        var id = String(video.externalId || '').replace(/^yt_/, '');
        if(!id) return null;
        // mute=1 is not a preference, it is the price of autoplay: browsers
        // refuse unmuted autoplay without a gesture. enablejsapi lets us unmute
        // afterwards via postMessage when the user has already tapped unmute.
        return 'https://www.youtube.com/embed/' + encodeURIComponent(id)
          + '?autoplay=1&mute=1&controls=0&playsinline=1&rel=0&modestbranding=1'
          + '&loop=1&playlist=' + encodeURIComponent(id)
          + '&enablejsapi=1&origin=' + encodeURIComponent(location.origin);
      }

      /** Ask a mounted YouTube player to (un)mute. No-op if it isn't ready yet. */
      function applySocialMute(iframe){
        if(!iframe || !iframe.contentWindow) return;
        try{
          iframe.contentWindow.postMessage(JSON.stringify({
            event: 'command', func: isMuted ? 'mute' : 'unMute', args: []
          }), 'https://www.youtube.com');
        }catch(e){}
      }

      function unmountSocialEmbed(index){
        var reel = renderedReels[index];
        if(!reel) return;
        var wrap = reel.querySelector('.reel-social-embed');
        if(!wrap) return;
        // Dropping the iframe is what frees the player's memory; pausing is not
        // enough. The poster underneath keeps the slide looking identical.
        wrap.classList.remove('mounted');
        wrap.innerHTML = '';
        if(mountedSocialIndex === index) mountedSocialIndex = null;
      }

      function mountSocialEmbed(index){
        var reel = renderedReels[index];
        if(!reel || !reel.classList.contains('reel-social')) return;
        var wrap = reel.querySelector('.reel-social-embed');
        if(!wrap || wrap.firstChild) return; // already mounted
        var video = allVideos[index];
        var src = socialEmbedUrl(video);
        if(!src) return;

        var iframe = document.createElement('iframe');
        iframe.src = src;
        iframe.title = video.name || 'ScanGym reel';
        iframe.setAttribute('frameborder', '0');
        iframe.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture');
        iframe.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
        iframe.addEventListener('load', function(){
          wrap.classList.add('mounted');
          if(!isMuted) applySocialMute(iframe);
        });
        wrap.appendChild(iframe);
        mountedSocialIndex = index;

        // View credit for the original creator, once per mount.
        if(!reel.dataset.viewTracked){
          reel.dataset.viewTracked = '1';
          fetch('/api/social-reels/analytics', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({external_id: video.externalId, event: 'view'})
          }).catch(function(){});
        }
      }

      /** Exactly one embed alive: the centre slide's. Everything else is poster. */
      function syncSocialEmbeds(centerIndex){
        var keys = Object.keys(renderedReels);
        for(var k = 0; k < keys.length; k++){
          var idx = parseInt(keys[k], 10);
          if(idx !== centerIndex) unmountSocialEmbed(idx);
        }
        mountSocialEmbed(centerIndex);
      }

      function createSocialReel(video, index){
        var div = document.createElement('div');
        div.className = 'reel reel-social';
        div.style.height = screenH + 'px';
        div.style.top = (index * screenH) + 'px';

        div.dataset.social = video.source || 'youtube';

        // Poster first — this is the whole slide until the embed mounts.
        var poster = document.createElement('img');
        poster.className = 'reel-social-poster';
        poster.src = video.posterUrl || video.thumb || PLACEHOLDER_POSTER;
        poster.alt = '';
        poster.loading = 'lazy';
        poster.decoding = 'async';
        poster.addEventListener('error', function(){ poster.src = PLACEHOLDER_POSTER; });
        div.appendChild(poster);

        // Empty on purpose: mountSocialEmbed fills it, and only for one slide.
        var embedWrap = document.createElement('div');
        embedWrap.className = 'reel-social-embed';
        div.appendChild(embedWrap);

        var brandCircle = document.createElement('div');
        brandCircle.className = 'sg-brand-circle';
        div.appendChild(brandCircle);

        var badge = document.createElement('div');
        badge.className = 'reel-social-badge';
        // No TikTok / YouTube badge (task 22, owner 2026-09-30): ScanGym branding only.

        // No progress bar: we get no timeupdate from an iframe, and a bar that
        // never moves reads as a broken player. Swipe is the only control here.

        var info = document.createElement('div');
        info.className = 'reel-info';
        /* Task 156 (owner, 2026-10-02): no Book a Gym pill on YouTube/social
           cards. It sat on top of YouTube's own player UI. */
        info.innerHTML = tikTokCaption(video)
          + (video.author ? '<span class="reel-social-source">' + escHtml(video.author) + '</span>' : '');
        div.appendChild(info);

        var actions = document.createElement('div');
        actions.className = 'reel-actions';
        var _sb = socialButtons(video);
        div.dataset.sk = socialKey(video);
        actions.innerHTML = _sb.lead
          + '<div class="reel-action" data-action="save">'
          +   '<div class="icon">' + ICONS.save + '</div><span class="label">Save</span></div>'
          + '<div class="reel-action" data-action="share">'
          +   '<div class="icon">' + ICONS.share + '</div><span class="label">Share</span></div>'
          + _sb.tail + SHOP_ACTION;
        div.appendChild(actions);
        actions.querySelectorAll('.reel-action').forEach(function(btn){
          btn.addEventListener('click', function(e){
            e.preventDefault();
            e.stopPropagation();
            if(btn.dataset.action === 'like') toggleSocial('like', video);
            else if(btn.dataset.action === 'repost') toggleSocial('repost', video);
            else if(btn.dataset.action === 'comment') openComments(video);
            else if(btn.dataset.action === 'follow') toggleFollow(video);
            else if(btn.dataset.action === 'shop') openReelShop(video);
            else if(btn.dataset.action === 'share') handleShare(video);
            else if(btn.dataset.action === 'save') handleSave(video, video.url);
          });
        });

        // Tapping the video area opens the original, which is both the honest
        // affordance and how the creator gets the view.
        div.addEventListener('click', function(e){
          if(e.target.closest('.reel-actions') || e.target.closest('.reel-info')) return;
          if(Math.abs(dragDelta) > 10) return;
          window.open(video.url, '_blank', 'noopener');
        });

        return div;
      }

      function createReel(video, index){
        // Social slides share the chrome but not the machinery: no video pool,
        // no variants, no preload ladder, no progress loop.
        if(video && video.type === 'social') return createSocialReel(video, index);

        var div = document.createElement('div');
        div.className = 'reel';
        div.style.height = screenH + 'px';
        div.style.top = (index * screenH) + 'px';
        div.dataset.index = index;

        // OPTIMIZATION #1: Select quality variant based on connection
        var videoUrl = resolveVideoUrl(video);

        // ⑮ Acquire video element from pool
        var vid = acquireVideo(index);
        // M7 FIX: Set up AbortController to clean up ALL event listeners
        // when this element is recycled. Prevents stale closures from
        // accumulated addEventListener calls overwriting video src.
        if(vid._abortCtrl) vid._abortCtrl.abort();
        vid._abortCtrl = new AbortController();
        var poolSignal = vid._abortCtrl.signal;
        vid._reelIndex = index; // Track current index on element itself
        vid._quality = currentQuality; // Track which quality we loaded
        vid.src = videoUrl;
        vid.muted = isMuted;
        // PERF v2: Hint browser to prioritize first video download
        if(index === currentIndex) vid.setAttribute('fetchpriority', 'high');
        else vid.removeAttribute('fetchpriority');

        // PERF FIX #3: Connection-aware preloading
        // On slow connections, only fully preload current video
        var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        var preloadWindow = 2; // default: preload current + next 2
        if(conn){
          var ect = conn.effectiveType;
          if(ect === 'slow-2g' || ect === '2g') preloadWindow = 0;
          else if(ect === '3g') preloadWindow = 1;
        }
        vid.preload = (index >= currentIndex && index <= currentIndex + preloadWindow) ? 'auto' : 'metadata';

        // PERF FIX #5: Poster priority: persisted frame > cached frame > blurhash > placeholder SVG
        // (thumb URLs from reels-videos.json are broken — point to non-existent paths)
        var persisted = getPersistedPoster(video);
        // Priority: cached frame > persisted frame > server poster > blurhash > placeholder
        var poster = posterCache[index] || persisted || null;
        if(!poster && video.cdnKey){
          // Use server-generated poster frame (pre-extracted JPEG)
          poster = '/api/reels/poster/' + video.cdnKey;
        }
        if(!poster && video.blurhash){
          var bh = decodeBlurHash(video.blurhash, 4, 3);
          if(bh){ poster = bh; posterCache[index] = bh; }
        }
        if(!poster) poster = PLACEHOLDER_POSTER;
        if(persisted && !posterCache[index]) posterCache[index] = persisted;
        vid.poster = poster;
        vid.classList.remove('has-frame');
        div.appendChild(vid);

        // H9 fix: Brand orange circle watermark
        var brandCircle = document.createElement('div');
        brandCircle.className = 'sg-brand-circle';
        div.appendChild(brandCircle);

        // Detect horizontal (landscape) videos and apply letterboxing
        // Use server-side orientation field first, then fall back to hints/runtime
        if(video.orientation === 'horizontal'){
          div.classList.add('landscape');
        } else if(!video.orientation){
          var cdnKey = (video.cdnKey || video.url || '').toLowerCase();
          if(cdnKey.indexOf('horizontal') !== -1){
            div.classList.add('landscape');
          }
        }
        vid.addEventListener('loadedmetadata', function(){
          if(vid.videoWidth > vid.videoHeight * 1.2){
            div.classList.add('landscape');
          }
        }, {signal: poolSignal});

        // Error handling — retry with CDN proxy before showing error
        // M7 FIX: Uses poolSignal (AbortController) so stale handlers are
        // automatically removed when this pool element is recycled.
        // Uses vid._reelIndex instead of div.dataset.index to avoid
        // stale closure reads from accumulated addEventListener calls.
        vid._retryCount = 0;
        vid._retrying = false;
        vid.addEventListener('error', function(){
          // Guard: ignore errors fired during source reset
          if(vid._retrying) return;
          var idx = vid._reelIndex;
          if(typeof idx !== 'number' || idx < 0 || idx >= allVideos.length) return;
          if(vid._retryCount === 0){
            vid._retryCount++;
            vid._retrying = true;
            // First retry: try the CORS proxy instead of direct CDN
            var proxyUrl = resolveVideoProxyUrl(allVideos[idx]);
            setTimeout(function(){
              vid.removeAttribute('src');
              vid.src = proxyUrl;
              vid._retrying = false;
              vid.load();
            }, 100);
            return;
          }
          if(vid._retryCount === 1){
            vid._retryCount++;
            vid._retrying = true;
            // Second retry: cache-bust the original URL
            var origUrl = resolveVideoUrl(allVideos[idx]);
            setTimeout(function(){
              vid.removeAttribute('src');
              vid.src = origUrl + (origUrl.indexOf('?') === -1 ? '?' : '&') + '_r=' + Date.now();
              vid._retrying = false;
              vid.load();
            }, 200);
            return;
          }
          if(div.querySelector('.reel-error')) return;
          var errDiv = document.createElement('div');
          errDiv.className = 'reel-error';
          errDiv.innerHTML = '<span>\uD83C\uDFAC</span><p>Video unavailable</p>';
          div.appendChild(errDiv);
          setTimeout(function(){
            if(vid._reelIndex === currentIndex){
              snapTo(currentIndex + 1, true); // snapTo handles bounds
            }

        }, {signal: poolSignal});

        // FIX #3: Always-visible loading overlay — replaces black screen
        var loadingState = document.createElement('div');

        // Mark loaded when video has enough data to play
        function markLoaded(){

        }

        // Also mark loaded if poster/frame is visible (readyState >= 2)

        // Buffering spinner — show when video is waiting for data AFTER initial load
        var bufSpinner = document.createElement('div');
        bufSpinner.className = 'reel-buffering';
        bufSpinner.innerHTML = '<div class="spinner"></div>';
        bufSpinner.style.display = 'none';
        div.appendChild(bufSpinner);

        vid.addEventListener('waiting', function(){ if(loadingState.classList.contains('loaded')) bufSpinner.style.display = 'flex'; }, {signal: poolSignal});
        vid.addEventListener('canplay', function(){ bufSpinner.style.display = 'none'; }, {signal: poolSignal});
        vid.addEventListener('playing', function(){ bufSpinner.style.display = 'none'; }, {signal: poolSignal});

        // Progress bar
        var progressWrap = document.createElement('div');
        progressWrap.className = 'reel-progress';
        var progressBuf = document.createElement('div');

        progressWrap.appendChild(progressBar);
        div.appendChild(progressWrap);
        /* Drag the progress bar to seek, like TikTok. Its own touch handlers stop
           the swipe engine from treating the drag as a scroll. */
        function seekTo(x){
          var r = progressWrap.getBoundingClientRect();
          var p = Math.min(1, Math.max(0, (x - r.left) / r.width));
          if(vid.duration) vid.currentTime = p * vid.duration;
          progressBar.style.width = (p * 100) + '%';
          var f = function(x){ x = Math.max(0, Math.round(x || 0)); return Math.floor(x / 60) + ':' + ('0' + x % 60).slice(-2); };
          scrubT.textContent = f(p * (vid.duration || 0)) + ' / ' + f(vid.duration);
        }
        var scrubT = document.createElement('div'); scrubT.className = 'sg-scrub-t'; div.appendChild(scrubT);
        progressWrap.addEventListener('touchstart', function(e){ e.stopPropagation(); progressWrap.classList.add('scrub'); div.classList.add('sg-scrubbing'); seekTo(e.touches[0].clientX); }, {passive:true});

        var playIcon = document.createElement('div');

        div.appendChild(playIcon);
        vid.addEventListener('play', function(){ div.classList.remove('sg-paused'); if(vid.playbackRate !== sgSpeed) vid.playbackRate = sgSpeed; }, {signal: poolSignal});

        // Creator info
        var hasCreator = video.creator && (video.creator.name || video.creator.handle);

        var info = document.createElement('div');
        info.className = 'reel-info';

        if(hasCreator){
          creatorHtml = '<p class="reel-creator">\uD83C\uDFA5 ' + escHtml(video.creator.name || video.creator.handle || 'Creator') + '</p>';
        }

        var affiliateHtml = '';
        if(hasAffiliate){
          // G5 fix: use onclick + postMessage so CTA navigates the parent app, not the iframe
          var affLink = escHtml(video.creator.affiliateLink);
          affiliateHtml = '<a class="creator-cta" href="' + affLink + '" onclick="event.preventDefault();_ctaNavigate(\'' + affLink + '\')">'
            + '<span class="creator-cta-icon">\uD83D\uDCB0</span>'
            + '<div><div class="creator-cta-text">Book via ' + escHtml(video.creator.name || video.creator.handle || 'Creator') + ' \u2014 ' + sgPrice('day').display + '</div>'
            + '<div class="creator-cta-sub">Creator earns on your booking</div></div></a>';
        } else if(hasCreator){
          // G5 fix: navigate to /explore (not /) so users reach the gym search page
          affiliateHtml = '<a class="creator-cta" href="/explore" onclick="event.preventDefault();_ctaNavigate(\'/explore\')">'
            + '<span class="creator-cta-icon">\uD83D\uDCAA</span>'
            + '<div><div class="creator-cta-text">Book a Gym \u2014 ' + sgPrice('day').display + '</div>'
            + '<div class="creator-cta-sub">No membership needed</div></div></a>';
        }

        // H5 fix: Removed fake view/like counts — no real analytics backend exists yet.
        // Show category + creator info only. Double-tap like still works (saved locally).

        info.innerHTML = tikTokCaption(video) + affiliateHtml; // creator line dropped: @handle already shows it
        info.addEventListener('click', function(e){
          var t = e.target.closest('[data-tag]');
          if(t){ e.preventDefault(); e.stopPropagation(); openTag(t.dataset.tag); return; }

        var _shareLbl = _shareC > 0 ? (_shareC >= 1000 ? (_shareC/1000).toFixed(1).replace(/\.0$/,'')+'K' : String(_shareC)) : 'Share';
        var _saveLbl  = _saveC  > 0 ? (_saveC  >= 1000 ? (_saveC /1000).toFixed(1).replace(/\.0$/,'')+'K' : String(_saveC))  : 'Save';

        // -- "Which reels I haven't shared/saved yet" tracker --

        var _isShared = _sharedReels.shared && _sharedReels.shared.indexOf(video.id) !== -1;
        var _isSaved = _sharedReels.saved && _sharedReels.saved.indexOf(video.id) !== -1;
        var _shareCheck = _isShared ? ' \u2713' : '';
        var _saveCheck = _isSaved ? ' \u2713' : '';

        /* Task 52: TikTok order — Like, Comment, Save, Share, Repost — then Shop. */
        var _sb = socialButtons(video);
        div.dataset.sk = socialKey(video);
        actions.innerHTML = _sb.lead
          + '<div class="reel-action" data-action="save"' + (_isSaved?' style="color:#22c55e"':'') + '>'
          +   '<div class="icon">' + ICONS.save + '</div><span class="label">' + _saveLbl + _saveCheck + '</span></div>'
          + '<div class="reel-action" data-action="share"' + (_isShared?' style="color:#22c55e"':'') + '>'
          +   '<div class="icon">' + ICONS.share + '</div><span class="label">' + _shareLbl + _shareCheck + '</span></div>'
          + _sb.tail + SHOP_ACTION

          _autoEnrollCreator(ev.data.user);

      function doDownload(video, url){
        var fname = (video.name || 'scangym-reel').replace(/[^a-zA-Z0-9_-]/g, '_');
        showToast('\u2B07\uFE0F Downloading...');

        // M5 FIX: Use server-side download endpoint for reliable iOS support.
        // The server sets Content-Disposition: attachment, which forces download
        // even on iOS Safari where <a download> is ignored for cross-origin URLs.
        if(video.cdnKey){
          var _sgCrHandle = _getAffiliateHandle(); // personal /r/<handle> burned into the watermark
          var downloadUrl = '/api/reels/download/' + encodeURIComponent(video.cdnKey)
            + '?name=' + encodeURIComponent(fname) + (_sgCrHandle ? ('&' + 'handle=' + _sgCrHandle) : '');
          // iOS: try Web Share API first (saves to Photos)
          if(isIOS && navigator.canShare){
            fetch(downloadUrl).then(function(res){
              if(!res.ok) throw new Error('Download failed');
              return res.blob();
            }).then(function(blob){
              var file = new File([blob], fname + '.mp4', { type: 'video/mp4' });
              var shareData = { files: [file] };
              if(navigator.canShare(shareData)){
                return navigator.share(shareData).then(function(){
                  showToast('\u2705 Saved!'); _markReelSaved(video.id);
                }).catch(function(err){
                  if(err && err.name === 'AbortError') return;
                  // Share failed — open download URL directly
                  window.location.href = downloadUrl;
                  showToast('\u2705 Downloading...');
                });
              } else {
                window.location.href = downloadUrl;
                showToast('\u2705 Downloading...');
              }
            }).catch(function(){
              window.location.href = downloadUrl;
              showToast('\u2705 Downloading...');
            });
          } else {
            // Android / desktop: navigate to download endpoint (Content-Disposition forces save)
            var a = document.createElement('a');
            a.href = downloadUrl;
            a.download = fname + '.mp4';
            document.body.appendChild(a);
            a.click();
            a.remove();
            showToast('\u2705 Saved!'); _markReelSaved(video.id);
          }
          return;
        }

        // Fallback for non-CDN videos (uploads etc.)
        fetch(url).then(function(res){
          if(!res.ok) throw new Error('Download failed');
          return res.blob();
        }).then(function(blob){
          var blobUrl = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = blobUrl;
          a.download = fname + '.mp4';
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(function(){ URL.revokeObjectURL(blobUrl); }, 1000);
          showToast('\u2705 Saved!'); _markReelSaved(video.id);
        }).catch(function(){
          if(isIOS){
            iosLongPressHint(url);
          } else {
            window.open(url, '_blank');
            showToast('\u2197\uFE0F Opened in new tab');
          }
        });
      }

      // H5 fix: Removed fake engagement counter helpers (hashStr, generateViewCount, formatCount).
      // View/like counts were entirely fabricated from video filenames — no real data behind them.

      // ═══════════════════════════════════════════════════════════
      //  FIX #5: SMART PRELOAD — aggressive for current±3, cancel far-away
      // ═══════════════════════════════════════════════════════════
      var activeAbortControllers = {};

      function smartPrefetch(centerIndex){
        // Cancel any fetches for videos far from current position
        var keys = Object.keys(activeAbortControllers);
        for(var k = 0; k < keys.length; k++){
          var idx = parseInt(keys[k]);
          if(Math.abs(idx - centerIndex) > PREFETCH_AHEAD + 2){
            activeAbortControllers[idx].abort();
            delete activeAbortControllers[idx];
          }
        }

        // Prefetch videos ahead with priority ordering
        for(var i = centerIndex + 1; i <= centerIndex + PREFETCH_AHEAD && i < allVideos.length; i++){
          if(activeAbortControllers[i]) continue; // already fetching
          var url = resolveVideoUrl(allVideos[i]);
          // Task 156: YouTube/TikTok/Instagram links are pages, not media files — fetching them only burns data and fails CORS.
          if(!url || prefetchedUrls[url] || /youtube\.com|youtu\.be|tiktok\.com|instagram\.com/i.test(url)) continue;
          prefetchedUrls[url] = true;

          var controller = new AbortController();
          activeAbortControllers[i] = controller;

          (function(idx, fetchUrl, ctrl){
            // Stagger fetches: immediate for next 2, delayed for rest
            var delay = (idx - centerIndex) <= 2 ? 0 : (idx - centerIndex) * 300;
            setTimeout(function(){
              if(ctrl.signal.aborted) return;
              fetch(fetchUrl, { signal: ctrl.signal, mode: 'cors', credentials: 'omit' })
                .then(function(resp){
                  if(resp.ok && window.caches){
                    caches.open('reels-v8-video').then(function(cache){
                      cache.put(fetchUrl, resp);
                    });
                  }
                  delete activeAbortControllers[idx];
                })
                .catch(function(){
                  delete activeAbortControllers[idx];
                });
            }, delay);
          })(i, url, controller);
        }
      }
