<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/reels/favicon.png" />
    <script src="/ref-capture.js?v=1.0"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <title>ScanGym Reels — Book a Gym. Anywhere.</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ScanGym" />
    <meta property="og:title" content="ScanGym Reels — Book a Gym. Anywhere." />
    <meta property="og:description" content="Discover gyms near you. Day passes, no membership needed. Swipe through real gym content from creators worldwide." />
    <meta property="og:image" content="https://scangym.com/reels/og-image.png" />
    <meta name="theme-color" content="#050816" />
    <!-- PERF: Preconnect to CDN — starts DNS+TCP+TLS 200ms before first video request -->
    <link rel="preconnect" href="https://cdn.scangym.com" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.scangym.com" />
    <!-- PERF: Prefetch feed API while HTML is still parsing -->
    <!-- Phase 3: standalone mode — no iframe dependency -->
    <link rel="manifest" href="/reels/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
      html,body{
        height:100%;height:100dvh;
        overflow:hidden;background:#000;
        font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
        touch-action:none;
        overscroll-behavior:none;
        -webkit-user-select:none;user-select:none;
      }

      /* ── Discovery header: category rail + search, above the video ── */
      #reels-top-bar{position:fixed;top:0;left:0;right:0;z-index:55;display:flex;align-items:center;
        gap:6px;padding:calc(10px + env(safe-area-inset-top,0px)) 8px 10px 52px; /* clear the fixed S logo (brand-mark.css) */
        background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 100%);pointer-events:none}
      #reels-cat-rail{flex:1;min-width:0;display:flex;align-items:center;gap:18px;overflow-x:auto;
        overflow-y:hidden;scrollbar-width:none;-ms-overflow-style:none;
        scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;
        touch-action:pan-x;pointer-events:auto;padding:0 6px}
      #reels-cat-rail::-webkit-scrollbar{display:none}
      /* TikTok fades the top tabs out at the edge instead of cutting a word in half. */
      #reels-cat-rail{-webkit-mask-image:linear-gradient(90deg,#000 82%,transparent);mask-image:linear-gradient(90deg,#000 82%,transparent)}
      .reels-cat{flex:0 0 auto;scroll-snap-align:center;position:relative;border:0;background:none;
        padding:6px 2px 8px;cursor:pointer;white-space:nowrap;
        color:rgba(255,255,255,.62);font:600 15px/1 system-ui;text-shadow:0 1px 3px rgba(0,0,0,.6)}
      .reels-cat[aria-selected="true"]{color:#fff;font-weight:700}
      .reels-cat[aria-selected="true"]::after{content:"";position:absolute;left:50%;bottom:0;
        width:22px;height:2px;border-radius:2px;background:#fff;transform:translateX(-50%)}
      #reels-search-button{flex:0 0 auto;pointer-events:auto;width:40px;height:40px;display:flex;
        align-items:center;justify-content:center;border:0;border-radius:50%;
        background:rgba(0,0,0,.35);color:#fff;cursor:pointer;padding:0}
      #reels-search-button svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;
        stroke-linecap:round}
      /* Reels library search: full-screen discovery surface. */
      #reels-search-panel{position:fixed;inset:0;z-index:80;background:#090b13;color:white;
        padding:calc(22px + env(safe-area-inset-top,0px)) 16px 24px;overflow:auto;touch-action:pan-y}
      #reels-search-panel[hidden]{display:none}
      /* Inside the half sheet (owner, 2026-09-30: the 🔍 button opens the same
         sheet as every other button) the panel is plain flow content. */
      #sg-half-sheet #reels-search-panel{position:static;inset:auto;padding:0;background:transparent;overflow:visible;z-index:auto}
      #sg-half-sheet #reels-search-close{display:none}
      .reels-search-head{display:flex;gap:8px;align-items:center}
      #reels-search-input{min-width:0;flex:1;padding:12px 14px;border:1px solid #2a2d3a;border-radius:24px;
        background:#171925;color:white;font:16px system-ui}
      #reels-search-close{padding:8px 10px;border:0;background:transparent;color:#fff;font:600 20px system-ui;
        cursor:pointer}
      #reels-search-submit{padding:8px 4px;border:0;background:transparent;color:#FF6D00;
        font:700 16px system-ui;cursor:pointer}
      .reels-disc-title{margin:22px 0 10px;font:700 16px system-ui;color:#fff}
      .reels-suggest-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
      .reels-suggest{text-align:left;border:0;background:none;padding:0;cursor:pointer;
        color:rgba(255,255,255,.82);font:15px system-ui;overflow:hidden;text-overflow:ellipsis;
        white-space:nowrap}
      .reels-suggest:first-child,.reels-suggest:nth-child(2){color:#FF6D00}
      .reels-trend{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;border:0;
        background:none;padding:10px 0;cursor:pointer;color:#fff;font:15px system-ui}
      .reels-trend .reels-trend-dot{color:#FF6D00;font-size:10px;line-height:1}
      .reels-trend small{color:rgba(255,255,255,.45);font:12px system-ui;margin-left:auto}
      .reels-recent{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;
        background:none;padding:10px 0;cursor:pointer;color:rgba(255,255,255,.82);font:15px system-ui}
      #reels-search-results{margin-top:20px;padding-bottom:30px}
      .reels-search-result{display:block;width:100%;text-align:left;padding:14px 12px;margin:6px 0;
        border:1px solid #353944;border-radius:12px;background:#171925;color:#fff;font:15px system-ui}
      .reels-search-result small{display:block;color:#ff8a3d;margin-top:4px}
      #reels-search-status{color:#ccc;font:14px system-ui}

      /* ── Reel Track (GPU-accelerated vertical strip) ── */
      #reel-track{
        position:fixed;top:0;left:0;right:0;bottom:0;
        will-change:transform;
        touch-action:none;
      }
      /* v3: 280ms snap with spring overshoot */
      #reel-track.snapping{
        transition:transform 120ms cubic-bezier(0.0,0.0,0.2,1);
      }

      /* ── Individual Reel ── */
      .reel{
        position:absolute;left:0;top:0;
        width:100vw;height:100vh;height:100dvh;
        overflow:hidden;background:#0a0a16;
      }
      .reel video{
        position:absolute;top:0;left:0;width:100%;height:100%;
        object-fit:cover;
        pointer-events:none;
      }
      /* Zoom-crop horizontal (landscape) videos to fill screen — TikTok style.
         Letterboxing kills immersion. Cropping loses some sides but keeps
         the dopamine-critical full-bleed visual. */
      .reel.landscape video{
        object-fit:cover !important;
      }
      .reel.landscape{
        background:#000;
      }

      /* Phase 2: Canvas pre-render overlay (shows poster during swipe) */
      .reel canvas.frame-preview{
        position:absolute;top:0;left:0;width:100%;height:100%;
        object-fit:cover;pointer-events:none;z-index:1;
      }
      .reel video.has-frame{z-index:2;}

      /* ── Social (YouTube) reels ──
         A social slide is a poster with the embed mounted on top, and only for
         the slide you are actually looking at (see mountSocialEmbed). The
         poster carries the layout so a swipe never waits on YouTube, and the
         iframe fades in over it once it exists. Everything else — gradients,
         info block, action rail, brand circle — is the same chrome as a native
         reel, so the tab looks identical. */
      .reel-social-poster{
        position:absolute;top:0;left:0;width:100%;height:100%;
        object-fit:cover;z-index:1;pointer-events:none;
      }
      .reel-social-embed{
        position:absolute;top:0;left:0;width:100%;height:100%;
        z-index:2;opacity:0;transition:opacity .25s ease;
      }
      .reel-social-embed.mounted{opacity:1;}
      .reel-social-embed iframe{
        width:100%;height:100%;border:0;display:block;
        /* Taps belong to the reel (double-tap like, mute) — not to YouTube's
           own UI, which would hijack the gesture and pause our feed. */
        pointer-events:none;
      }
      .reel-social-badge{
        position:absolute;top:14px;right:14px;z-index:20;
        display:flex;align-items:center;gap:5px;
        padding:4px 9px;border-radius:20px;
        background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
        color:#fff;font:600 11px/1 system-ui,-apple-system,sans-serif;
        pointer-events:none;
      }
      .reel-social-source{
        display:inline-block;margin-top:2px;
        color:rgba(255,255,255,.55);
        font:500 11px/1.3 system-ui,-apple-system,sans-serif;
      }

      /* ── "Use this prompt" — TikTok's "Use this sound", for a text-to-video app ──
         Bottom-right of every reel, above the action column's reach. The prompt
         itself is the label (the owner asked for the text on the button), which is
         also what makes the loop obvious: you see what produced the clip you just
         watched. Long prompts scroll on their own like TikTok's sound title. */
      .reel-prompt{
        position:absolute; right:10px; bottom:calc(var(--sg-band-height,76px) + 12px);
        z-index:18; max-width:62%; display:flex; align-items:center; gap:8px;
        padding:8px 12px 8px 10px; border-radius:999px;
        background:rgba(13,16,25,.62); border:1px solid rgba(255,255,255,.14);
        -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
        color:#fff; font-size:12px; font-weight:600; cursor:pointer;
        box-shadow:0 4px 16px rgba(0,0,0,.35);
      }
      .reel-prompt:active{transform:scale(.96)}
      .reel-prompt .rp-spark{color:#FF6D00;font-size:14px;flex:0 0 auto}
      .reel-prompt .rp-text{
        overflow:hidden; white-space:nowrap; text-overflow:ellipsis; max-width:100%;
      }
      /* A prompt too long to read sitting still scrolls once it is on screen. */
      .reel-prompt.rp-long .rp-text{text-overflow:clip}
      .reel-prompt.rp-long .rp-text span{display:inline-block;padding-right:28px;animation:rpMarquee 12s linear infinite}
      @keyframes rpMarquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
      @media (prefers-reduced-motion:reduce){
        .reel-prompt.rp-long .rp-text span{animation:none}
        .reel-prompt.rp-long .rp-text{text-overflow:ellipsis}
      }

      /* Brand circle watermark */
      .sg-brand-circle{position:absolute;top:16px;left:16px;width:28px;height:28px;background:#FF6D00;border-radius:50%;z-index:10;opacity:.85;box-shadow:0 0 10px rgba(255,109,0,.5);pointer-events:none;display:flex;align-items:center;justify-content:center;font:900 15px/1 system-ui,-apple-system,sans-serif;color:#fff;}
.sg-brand-circle::after{content:'S'}

      /* Gradient overlays */
      .reel::before{
        content:'';position:absolute;top:0;left:0;right:0;height:120px;
        background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,transparent 100%);
        z-index:10;pointer-events:none;
      }
      .reel::after{
        /* Task 156 B2: taller, darker fade so white captions stay readable on bright videos. */
        content:'';position:absolute;bottom:0;left:0;right:0;height:300px;
        background:linear-gradient(0deg,rgba(0,0,0,.8) 0%,rgba(0,0,0,.45) 55%,transparent 100%);
        z-index:10;pointer-events:none;
      }

      /* ── Video info (bottom-left) ── */
      /* bottom:132px — the Talk bar (#rchat-fab) sits at bottom:69px, 52px tall,
         so anything below 121px is hidden under it. Rail + info clear it by 11px. */
      /* The band (rails.css) is a solid rectangle now: the media, the title, the
         progress line and the prompt chip all end above it. */
      .reel video, .reel canvas.frame-preview, .reel iframe, .reel .reel-poster{
        height:calc(100% - var(--sg-band-height,76px)) !important;
      }
      .reel-progress{ bottom:var(--sg-band-height,76px) !important; }
      .reel-info{
        position:absolute;bottom:calc(var(--sg-band-height,76px) + 60px);left:16px;right:72px;z-index:20;
        color:#fff;
      }
      .reel-info .reel-title{
        font-size:14px;font-weight:700;line-height:1.35;
        text-shadow:0 1px 8px rgba(0,0,0,.8);
        display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
      }
      .reel-info .reel-category{
        font-size:11px;color:rgba(255,255,255,.55);margin-top:4px;
        text-shadow:0 1px 4px rgba(0,0,0,.5);
      }
      .reel-info .reel-handle{font-size:16px;font-weight:800;margin:0 0 4px;text-shadow:0 1px 8px rgba(0,0,0,.8);}
      .reel-info .reel-title.open{-webkit-line-clamp:unset;display:block;}
      .reel-info .reel-hash{font-weight:700;color:#fff;}
      .reel-info [data-tag]{cursor:pointer;}
      .reel-info .reel-tag{font-weight:800;}
      .reel-info .reel-tag:active,.reel-info .reel-handle:active{opacity:.6;}
      .reel-info .reel-more{background:none;border:0;padding:0;margin:0 0 2px;color:rgba(255,255,255,.75);font:700 13px/1.3 inherit;cursor:pointer;text-shadow:0 1px 6px rgba(0,0,0,.7);}
      .reel .sg-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .15s;z-index:20;filter:drop-shadow(0 2px 12px rgba(0,0,0,.5));}
      .reel.sg-paused .sg-play{opacity:1;}
      .reel video{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;}
      .reel-progress::before{content:'';position:absolute;left:0;right:0;top:-14px;bottom:-4px;}
      .reel-progress.scrub{height:6px !important;}
      .sg-scrub-t{position:absolute;left:0;right:0;bottom:calc(var(--sg-band-height,76px) + 40px);text-align:center;font:800 26px/1 system-ui;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.8);opacity:0;pointer-events:none;z-index:26}
      .reel.sg-scrubbing .sg-scrub-t{opacity:1}
      .reel.sg-scrubbing .reel-info,.reel.sg-scrubbing .reel-actions,.reel.sg-scrubbing .reel-prompt{opacity:0;transition:opacity .15s}
      .reel.sg-fast::after{content:'2x \25B8\25B8';position:absolute;top:70px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);color:#fff;font:800 14px system-ui;padding:6px 14px;border-radius:16px;z-index:27;pointer-events:none}
      body.sg-clear .reel-info,body.sg-clear .reel-actions,body.sg-clear .reel-prompt,body.sg-clear #reels-cat-rail{display:none !important}
      .reel-progress.scrub .reel-progress-bar{background:#fff;}
      .reel-info .reel-sound{display:flex;align-items:center;gap:6px;white-space:nowrap;max-width:230px;color:#fff !important;font-size:13px !important;margin-top:6px !important;}
      .reel-info .reel-sound .rs-clip{overflow:hidden;flex:1;min-width:0;}
      .reel-info .reel-sound .rs-clip span{display:inline-block;animation:sgMarquee 9s linear infinite;}
      .reel-info .reel-disc{flex:none;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle,#FF6D00 0 3px,#222 3.5px 6px,#444 6.5px 7px,#111 7.5px);
        box-shadow:0 0 0 1.5px rgba(255,255,255,.25);animation:sgDisc 4s linear infinite;}
      @keyframes sgDisc{to{transform:rotate(360deg)}}
      @keyframes sgMarquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
      @media (prefers-reduced-motion:reduce){.reel-info .reel-sound span,.reel-info .reel-disc{animation:none}}
      .reel-info .reel-creator{
        font-size:12px;color:#FF6D00;font-weight:600;margin-top:3px;
        text-shadow:0 1px 4px rgba(0,0,0,.5);
      }

      /* ── Creator affiliate CTA ── */
      .creator-cta{
        display:flex;align-items:center;gap:8px;
        margin-top:8px;padding:8px 12px;
        background:rgba(255,109,0,.15);border:1px solid rgba(255,109,0,.3);
        border-radius:12px;cursor:pointer;
        backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
        transition:all .15s;max-width:fit-content;
        text-decoration:none;
      }
      .creator-cta:active{transform:scale(0.96);background:rgba(255,109,0,.25);}
      .creator-cta-icon{font-size:16px;}
      .creator-cta-text{font-size:12px;font-weight:700;color:#FF6D00;line-height:1.2;}
      .creator-cta-sub{font-size:10px;color:rgba(255,255,255,.5);font-weight:500;}

      /* ── Action sidebar (right) ── */
      /* One fixed home for the row of the reel on screen (pinActiveRow). Same
         frame as a slide, so rails.css places the row exactly where it was. */
      #sg-reel-row-host{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;
        pointer-events:none;z-index:25;}
      #sg-reel-row-host .reel-actions{pointer-events:auto;}
      #reel-track .reel-actions{visibility:hidden !important;}
      .reel-actions{
        position:absolute;bottom:132px;right:10px;z-index:20;
        display:flex;flex-direction:column;align-items:center;gap:12px;
      }
      .reel-action{
        display:flex;flex-direction:column;align-items:center;gap:2px;
        cursor:pointer;transition:transform .12s ease;text-decoration:none;
      }
      .reel-action:active{transform:scale(0.82);}
      /* Task 52: liked = red heart, reposted = green, as on TikTok. */
      .reel-action[data-action="like"].sg-on .icon svg{fill:#fe2c55;stroke:#fe2c55;}
      .reel-action[data-action="repost"].sg-on .icon svg{stroke:#22c55e;}
      #sg-cmt-sheet{position:fixed;inset:0;z-index:10050;}
      #sg-cmt-sheet .sg-cmt-back{position:absolute;inset:0;background:rgba(0,0,0,.45);}
      #sg-cmt-sheet .sg-cmt-panel{position:absolute;left:0;right:0;bottom:0;height:62%;background:#12121c;
        border-radius:16px 16px 0 0;display:flex;flex-direction:column;color:#fff;transition:transform .15s;}
      #sg-cmt-sheet .sg-cmt-head{display:flex;align-items:center;justify-content:center;position:relative;padding:14px;
        border-bottom:1px solid rgba(255,255,255,.08);font-weight:700;font-size:14px;}
      #sg-cmt-sheet .sg-cmt-x{position:absolute;right:10px;top:8px;width:32px;height:32px;border:0;border-radius:50%;
        background:#ef4444;color:#fff;font-size:15px;font-weight:700;cursor:pointer;}
      #sg-cmt-sheet .sg-cmt-list{flex:1;overflow-y:auto;padding:8px 16px;-webkit-overflow-scrolling:touch;}
      #sg-cmt-sheet .sg-cmt-row{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05);}
      #sg-cmt-sheet .sg-cmt-name{font-size:12px;color:rgba(255,255,255,.55);font-weight:600;margin-bottom:3px;}
      #sg-cmt-sheet .sg-cmt-body{font-size:14px;line-height:1.35;word-wrap:break-word;}
      #sg-cmt-sheet .sg-cmt-empty{color:rgba(255,255,255,.45);font-size:13px;text-align:center;margin-top:30px;}
      #sg-cmt-sheet .sg-cmt-form{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));
        border-top:1px solid rgba(255,255,255,.08);}
      #sg-cmt-sheet .sg-cmt-in{flex:1;background:rgba(255,255,255,.08);border:0;border-radius:20px;padding:10px 14px;
        color:#fff;font-size:16px;outline:none;}
      #sg-cmt-sheet .sg-cmt-send{border:0;background:#FF6D00;color:#fff;font-weight:700;border-radius:20px;padding:0 16px;}
      /* These two — Share and Save — are the buttons every other row in the app
         is now measured against, so their look is stated once in one-button.css
         and read from there. The fallbacks are the values they had on
         2026-09-19, so this sidebar is unchanged if the sheet is missing. */
      .reel-action .icon{
        width:var(--sg-btn-size,44px);height:var(--sg-btn-size,44px);border-radius:50%;
        background:var(--sg-btn-bg,rgba(0,0,0,.40));
        backdrop-filter:var(--sg-btn-blur,blur(12px));
        -webkit-backdrop-filter:var(--sg-btn-blur,blur(12px));
        border:var(--sg-btn-border-width,1.5px) solid var(--sg-btn-border-color,rgba(255,255,255,.12));
        display:flex;align-items:center;justify-content:center;
        box-shadow:var(--sg-btn-shadow,0 2px 10px rgba(0,0,0,.25));
        transition:background .2s,border-color .2s;
      }
      .reel-action .icon svg{
        width:var(--sg-btn-icon,20px);height:var(--sg-btn-icon,20px);
        fill:none;stroke:currentColor;stroke-width:2;
        stroke-linecap:round;stroke-linejoin:round;
      }
      .reel-action .label{
        color:var(--sg-btn-label-color,#fff);
        font-size:var(--sg-btn-label-size,10px);
        font-weight:var(--sg-btn-label-weight,600);
        letter-spacing:var(--sg-btn-label-tracking,.2px);
        text-shadow:var(--sg-btn-label-shadow,0 1px 4px rgba(0,0,0,.8));
      }
      /* Book used to be an orange disc here (owner, 2026-09-19: make it white like its
         neighbours). It is the same button as Share and Save now: the word "Book" under
         it already says what it does, and orange stays reserved for the one real primary
         action on a screen — see one-orange.css. */

      /* ── Floating Create FAB ── */
      #create-fab{
        position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
        z-index:40;display:flex;align-items:center;gap:6px;
        padding:12px 24px;
        background:linear-gradient(135deg,#22c55e 0%,#16a34a 100%);
        border:2px solid rgba(255,255,255,.2);
        border-radius:28px;
        color:#fff;font-size:15px;font-weight:800;
        cursor:pointer;text-decoration:none;
        box-shadow:0 4px 24px rgba(34,197,94,.4),0 0 0 0 rgba(34,197,94,.3);
        transition:all .15s ease;
        animation:fabPulse 3s ease-in-out infinite;
        letter-spacing:0.3px;
      }
      #create-fab:active{transform:translateX(-50%) scale(0.92);box-shadow:0 2px 12px rgba(34,197,94,.3);}

      /* ── Task 52 (owner, 2026-09-30): Like / Comment / Save / Share / Repost ──
         TikTok's row, in TikTok's order. Save and Share were already here; Like,
         Comment and Repost are stored by /api/reels/social (server/routes/
         reel-social.js). Taps update the button at once and the server answer
         corrects it (optimistic UI, as TikTok and Instagram do); a signed-out
         tap opens the app's sign-in sheet like Share and Save already did. */
      var social = {};          // key -> {likes, comments, reposts, liked, reposted}
      var socialAsked = {};     // key -> true once requested
      function socialKey(video){ return String((video && (video.cdnKey || video.id)) || ''); }
      function fmtCount(n, word){
        if(!n) return word;
        return n >= 1000 ? (n/1000).toFixed(1).replace(/\.0$/,'') + 'K' : String(n);
      }
      /* Task 64 (owner, 2026-10-01): TikTok puts the creator's photo with a
         red + (Follow) at the top of the column — the "real people" signal.
         Uploads have a ScanSquad creator, YouTube clips a channel, and our own
         reels are ScanGym's. No photo is stored for any of them yet, so the
         circle shows the creator's initial on a colour picked from the name. */
      function creatorOf(video){
        var c = (video && video.creator) || {};
        var name = c.name || c.handle || (video && video.author) || 'ScanGym';
        var key = String(c.handle || (video && video.author) || 'scangym').toLowerCase().slice(0, 120);
        return {key:key, name:name, img: c.avatar || c.photo || ''};
      }
      function creatorButton(video){
        var cr = creatorOf(video), h = 0;
        for(var i = 0; i < cr.key.length; i++) h = (h * 31 + cr.key.charCodeAt(i)) % 360;
        var bg = cr.key === 'scangym' ? '#FF6D00' : 'hsl(' + h + ',55%,42%)';
        var face = cr.img ? '<img src="' + escHtml(cr.img) + '" alt="">' : escHtml(cr.name.replace(/^@/,'').charAt(0).toUpperCase() || 'S');
        return '<div class="reel-action sg-creator' + (follows[cr.key] ? ' sg-on' : '') + '" data-action="follow" data-ck="' + escHtml(cr.key) + '" aria-label="Follow ' + escHtml(cr.name) + '">'
          + '<div class="sg-av" style="background:' + bg + '">' + face + '</div><span class="sg-plus">' + (follows[cr.key] ? '\u2713' : '+') + '</span></div>';
      }
      var follows = {};
      function paintFollow(key){
        var els = document.querySelectorAll('.sg-creator[data-ck]');
        for(var i = 0; i < els.length; i++){
          if(els[i].getAttribute('data-ck') !== key) continue;
          els[i].classList.toggle('sg-on', !!follows[key]);
          var pl = els[i].querySelector('.sg-plus'); if(pl) pl.textContent = follows[key] ? '\u2713' : '+';
        }
      }
      fetch('/api/reels/social/follows', {credentials:'same-origin'})
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(d){ if(d && d.creators) d.creators.forEach(function(k){ follows[k] = true; paintFollow(k); }); })
        .catch(function(){});
      function toggleFollow(video){
        var cr = creatorOf(video);
        if(!_reelsUserLoggedIn && window.parent && window.parent !== window){ askSignIn('follow', video); return; }
        var on = !follows[cr.key];
        follows[cr.key] = on; paintFollow(cr.key);
        if(navigator.vibrate) navigator.vibrate(10);
        fetch('/api/reels/social/follow', {method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({creator: cr.key, on: on})})
          .then(function(r){
            if(r.status === 401){ follows[cr.key] = !on; paintFollow(cr.key); askSignIn('follow', video); return null; }
            if(!r.ok) throw new Error();
            if(typeof showToast === 'function') showToast(on ? 'Following ' + cr.name : 'Unfollowed ' + cr.name);
          }).catch(function(){ follows[cr.key] = !on; paintFollow(cr.key); });
      }
      function socialButtons(video){
        var k = escHtml(socialKey(video));
        return {
          lead: creatorButton(video) + '<div class="reel-action" data-action="like" data-sk="' + k + '"><div class="icon">' + ICONS.like + '</div><span class="label">Like</span></div>'
              + '<div class="reel-action" data-action="comment" data-sk="' + k + '"><div class="icon">' + ICONS.comment + '</div><span class="label">Comment</span></div>',
          tail: '<div class="reel-action" data-action="repost" data-sk="' + k + '"><div class="icon">' + ICONS.repost + '</div><span class="label">Repost</span></div>'
        };
      }
      function paintSocial(key){
        var st = social[key]; if(!st) return;
        var els = document.querySelectorAll('.reel-action[data-sk]');
        for(var i = 0; i < els.length; i++){
          var el = els[i]; if(el.getAttribute('data-sk') !== key) continue;
          var a = el.getAttribute('data-action'), lbl = el.querySelector('.label');
          if(a === 'like'){ el.classList.toggle('sg-on', !!st.liked); lbl.textContent = fmtCount(st.likes, 'Like'); }
          else if(a === 'comment'){ lbl.textContent = fmtCount(st.comments, 'Comment'); }
          else if(a === 'repost'){ el.classList.toggle('sg-on', !!st.reposted); lbl.textContent = fmtCount(st.reposts, 'Repost'); }
        }
      }
      var socialTimer = null;
      function loadSocialSoon(){
        clearTimeout(socialTimer);
        socialTimer = setTimeout(function(){
          var keys = [];
          Object.keys(renderedReels).forEach(function(i){
            var k = renderedReels[i] && renderedReels[i].dataset.sk;
            if(k && !socialAsked[k]){ socialAsked[k] = true; keys.push(k); }
          });
          if(!keys.length) return;
          fetch('/api/reels/social/state?ids=' + keys.map(encodeURIComponent).join(','), {credentials:'same-origin'})
            .then(function(r){ return r.ok ? r.json() : null; })
            .then(function(d){
              if(!d || !d.items) return;
              Object.keys(d.items).forEach(function(k){ social[k] = d.items[k]; paintSocial(k); });
            }).catch(function(){ keys.forEach(function(k){ delete socialAsked[k]; }); });
        }, 150);
      }
      function askSignIn(action, video){
        try { window.parent.postMessage({type:'sg-auth-request', action:action, video:{id:video.id,name:video.name}}, '*'); } catch(e){}
      }
      function toggleSocial(kind, video, forceOn){
        var key = socialKey(video); if(!key) return;
        if(!_reelsUserLoggedIn && window.parent && window.parent !== window){ askSignIn(kind, video); return; }
        var st = social[key] || (social[key] = {likes:0, comments:0, reposts:0, liked:false, reposted:false});
        var flag = kind === 'like' ? 'liked' : 'reposted', cnt = kind === 'like' ? 'likes' : 'reposts';
        var on = forceOn ? true : !st[flag];
        if(on === st[flag]) return;
        var before = {v: st[flag], n: st[cnt]};
        st[flag] = on; st[cnt] = Math.max(0, st[cnt] + (on ? 1 : -1)); paintSocial(key);
        if(navigator.vibrate) navigator.vibrate(10);
        if(on && !forceOn) trackEvent(kind, currentIndex);
        fetch('/api/reels/social/' + encodeURIComponent(key) + '/' + kind, {
          method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body: JSON.stringify({on:on})
        }).then(function(r){
          if(r.status === 401){ st[flag] = before.v; st[cnt] = before.n; paintSocial(key); askSignIn(kind, video); return null; }
          return r.ok ? r.json() : Promise.reject();
        }).then(function(d){
          if(d){ social[key] = {likes:d.likes, comments:d.comments, reposts:d.reposts, liked:d.liked, reposted:d.reposted}; paintSocial(key); }
          if(d && kind === 'repost' && on && typeof showToast === 'function') showToast('Reposted to your profile');
        }).catch(function(){ st[flag] = before.v; st[cnt] = before.n; paintSocial(key); });
      }

        /* swipe the panel down to close */
        var y0 = null, panel = wrap.querySelector('.sg-cmt-panel');
        panel.addEventListener('touchstart', function(e){ if(list.scrollTop <= 0) y0 = e.touches[0].clientY; }, {passive:true});
        panel.addEventListener('touchmove', function(e){ if(y0 !== null){ var dy = e.touches[0].clientY - y0; if(dy > 0) panel.style.transform = 'translateY(' + dy + 'px)'; } }, {passive:true});
        panel.addEventListener('touchend', function(e){ if(y0 === null) return; var dy = e.changedTouches[0].clientY - y0; y0 = null; if(dy > 90) close(); else panel.style.transform = ''; });
        function row(c){ return '<div class="sg-cmt-row"><div class="sg-cmt-name">' + escHtml(c.name) + '</div><div class="sg-cmt-body">' + escHtml(c.body) + '</div></div>'; }
        fetch('/api/reels/social/' + encodeURIComponent(key) + '/comments', {credentials:'same-origin'})
          .then(function(r){ return r.json(); })
          .then(function(d){
            var cs = (d && d.comments) || [];
            list.innerHTML = cs.length ? cs.map(row).join('') : '<p class="sg-cmt-empty">No comments yet. Be the first.</p>';
          }).catch(function(){ list.innerHTML = '<p class="sg-cmt-empty">Could not load comments.</p>'; });
        wrap.querySelector('.sg-cmt-form').addEventListener('submit', function(e){
          e.preventDefault();
          var text = input.value.trim(); if(!text) return;
          if(!_reelsUserLoggedIn && window.parent && window.parent !== window){ close(); askSignIn('comment', video); return; }
          input.disabled = true;
          fetch('/api/reels/social/' + encodeURIComponent(key) + '/comments', {
            method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body: JSON.stringify({body:text})
          }).then(function(r){
            if(r.status === 401){ close(); askSignIn('comment', video); return null; }
            return r.json();
          }).then(function(d){
            input.disabled = false;
            if(!d || !d.comment) return;
            input.value = '';
            var empty = list.querySelector('.sg-cmt-empty'); if(empty) empty.remove();
            list.insertAdjacentHTML('afterbegin', row(d.comment));
            var st = social[key] || (social[key] = {likes:0, comments:0, reposts:0, liked:false, reposted:false});
            st.comments++; paintSocial(key);
          }).catch(function(){ input.disabled = false; });
        });
      }

      // ── Constants ──

      // ══════════════════════════════════════════════════════════
      //  DISCOVERY: category rail + TikTok-style search
      //  The feed used to be one undifferentiated stream with a text
      //  "Search" button. Now the top of the tab works like TikTok's:
      //  a sideways-scrolling category rail that swaps the feed, and a
      //  search surface that suggests something to tap before you type.
      // ══════════════════════════════════════════════════════════
      var searchButton = document.getElementById('reels-search-button');
      var searchPanel = document.getElementById('reels-search-panel');
      var searchInput = document.getElementById('reels-search-input');
      var searchResults = document.getElementById('reels-search-results');
      var searchDiscover = document.getElementById('reels-search-discover');
      var catRail = document.getElementById('reels-cat-rail');
      var searchTimer, searchRequest, catRequest;
      var RECENT_KEY = 'sg_reels_recent_searches';
      var FEED_ALL = '__all__';           // the "For You" rail item
      var activeCategory = null;          // null = unfiltered feed
      var railCategories = [];            // [{label, value, count}]

      // ── Recent searches (local only, never leaves the device) ──
      function readRecent(){
        try { return JSON.parse(localStorage.getItem(RECENT_KEY) || '[]').slice(0, 6); }
        catch(e){ return []; }
      }
      function rememberRecent(q){
        try {
          var list = readRecent().filter(function(item){ return item.toLowerCase() !== q.toLowerCase(); });
          list.unshift(q);
          localStorage.setItem(RECENT_KEY, JSON.stringify(list.slice(0, 6)));
        } catch(e){}
      }
      function forgetRecent(q){
        try {
          localStorage.setItem(RECENT_KEY, JSON.stringify(readRecent().filter(function(item){
            return item !== q;
          })));
        } catch(e){}
      }

      function setCounterText(text){
        var el = document.getElementById('reel-counter');
        if(el) el.textContent = text;
      }

      // ── Swap the playable list without reloading the page ──
      function applyVideoList(videos, opts){
        opts = opts || {};
        Object.keys(renderedReels).forEach(function(key){
          releaseVideo(Number(key));
          track.removeChild(renderedReels[key]);
          delete renderedReels[key];
        });
        var _hid = hiddenReels();
        var _kw = sgMutedWords();
        var _kept = videos.filter(function(v){
          if(_hid.indexOf(v.id) !== -1) return false;
          var t = (String(v.name || '') + ' ' + String(v.category || '') + ' ' + String(v.author || '')).toLowerCase();
          return !_kw.some(function(w){ return t.indexOf(w) !== -1; }); // TikTok "Filter video keywords"
        });
        if(_kept.length) videos = _kept; // Not interested reels stay out of the feed
        /* Task 154 Home 10: no duplicate videos in one feed. */
        var _seenV = {};
        videos = videos.filter(function(v){ var k = String(v.id || v.url || v.videoUrl || ''); if(!k) return true; if(_seenV[k]) return false; _seenV[k] = 1; return true; });
        allVideos = videos;
        posterCache = {};
        currentIndex = 0;
        feedOffset = opts.offset != null ? opts.offset : videos.length;
        feedHasMore = !!opts.hasMore;
        feedServerTotal = opts.total || videos.length;
        var startAt = opts.startAt || 0;
        snapTo(startAt, false);
        playVideo(startAt);
        if(typeof updateReelCounter === 'function') updateReelCounter();
      }

      // ── Category rail ────────────────────────────────────────
      function renderCatRail(){
        catRail.textContent = '';
        railCategories.forEach(function(cat){
          var button = document.createElement('button');
          button.type = 'button';
          button.className = 'reels-cat';
          button.textContent = cat.label;
          button.setAttribute('role', 'tab');
          button.setAttribute('aria-selected', String(cat.value === (activeCategory || FEED_ALL)));
          button.addEventListener('click', function(){
            selectCategory(cat);
            button.scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
          });
          catRail.appendChild(button);
        });
      }

      function refreshFeed(){
        showToast('Refreshing\u2026');
        if(activeCategory && activeCategory.indexOf('tab:') === 0){
          var t = railCategories.filter(function(c){ return c.value === activeCategory; })[0];
          if(t) return loadTab(t);
        }
        fetch('/api/reels/feed?limit=' + PAGE_SIZE + '&offset=0&shuffle=true' + (activeCategory ? '&category=' + encodeURIComponent(activeCategory) : ''))
          .then(function(r){ if(!r.ok) throw new Error('Feed error'); return r.json(); })
          .then(function(d){ var v = d.videos || []; if(!v.length) return; feedSeed = d.seed || null; applyVideoList(v, {hasMore: d.hasMore, total: d.total, offset: v.length}); })
          .catch(function(){ showToast('Could not refresh \u2014 check your connection'); });
      }
      var HOME_TABS = [['following','Following'],['nearme','Near me'],['trending','Trending'],
        ['drama','#drama'],['movie','#movie'],['podcast','#podcast'],['live','\uD83D\uDD34 Live']];
      /* Near me asks the phone once; no answer in 6s (or a no) still works —
         the server falls back to the visitor's country. */
      function withPlace(cb){
        var done = false, finish = function(q){ if(!done){ done = true; cb(q); } };
        if(!navigator.geolocation) return finish('');
        setTimeout(function(){ finish(''); }, 6000);
        navigator.geolocation.getCurrentPosition(function(p){
          finish('?lat=' + p.coords.latitude.toFixed(3) + '&lng=' + p.coords.longitude.toFixed(3));
        }, function(){ finish(''); }, {maximumAge: 600000, timeout: 5500});
      }
      function loadTab(cat){
        var key = cat.value.slice(4);
        var go = function(q){
          fetch('/api/reels/tab/' + key + (q || ''), {credentials: 'include'})
            .then(function(r){ if(!r.ok) throw new Error('Tab error'); return r.json(); })
            .then(function(data){
              if(activeCategory !== cat.value) return; // the customer moved on
              var videos = data.videos || [];
              if(!videos.length){
                setCounterText(data.message || ('No reels in ' + cat.label));
                if(data.needsLogin){ try { window.parent.postMessage({type:'sg-auth-request', action:'following'}, '*'); } catch(e){} return; }
                /* Task 154 Home 2: never leave an empty tab on screen. */
                showToast('Nothing new in ' + cat.label + ' yet \u2014 showing For You');
                var fy = railCategories.filter(function(c){ return c.value === FEED_ALL; })[0];
                if(fy) selectCategory(fy);
                return;
              }
              feedSeed = null;
              applyVideoList(videos, {hasMore: false, total: videos.length, offset: videos.length});
            })
            .catch(function(){ setCounterText('Could not load ' + cat.label); });
        };
        if(key === 'nearme'){
          /* Task 154 Home 8: say why before the phone asks for location (once). */
          try { if(!localStorage.getItem('sg_loc_explained')){ localStorage.setItem('sg_loc_explained', '1'); showToast('\uD83D\uDCCD Allow location once to see videos and gyms near you'); } } catch(e){}
          withPlace(go);
        } else go('');
      }

      /* Task 104 step 1: Stories row (Instagram/Snapchat/Facebook) + Snapchat-style daily streak. */
      function sgStreak(){
        var d = new Date(), today = d.toDateString(), y = new Date(d.getTime() - 864e5).toDateString(), st;
        try { st = JSON.parse(localStorage.getItem('sg_streak') || '{}'); } catch(e){ st = {}; }
        if(st.last !== today){ st.n = st.last === y ? (st.n || 0) + 1 : 1; st.last = today; st.fresh = true; try { localStorage.setItem('sg_streak', JSON.stringify(st)); } catch(e){} }
        else st.fresh = false;
        return st;
      }

      // ═══════════════════════════════════════════════════════════
      //  ⑮ VIDEO ELEMENT POOL — 3 recycled elements
      // ═══════════════════════════════════════════════════════════
      //  Instead of creating/destroying <video> elements (expensive:
      //  browser must allocate decoder pipeline each time), we maintain
      //  a pool of 3 elements and reassign src. This matches how
      //  TikTok uses 3 ExoPlayer instances on Android.

      var videoPool = [];                // Array of {element, assignedIndex}
      var videoPoolMap = {};             // index → pool entry

      function initVideoPool(){
        for(var i = 0; i < POOL_SIZE; i++){
          var vid = document.createElement('video');
          vid.loop = !sgAutoScroll(); // TikTok loops by default; Auto-scroll is opt-in (long-press menu)
          vid.muted = true;
          vid.playsInline = true;
          vid.autoplay = false; // controlled per-reel via play()
          vid.setAttribute('playsinline', '');
          vid.setAttribute('webkit-playsinline', '');
          vid.setAttribute('muted', '');
          vid.preload = 'metadata';
          vid.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;pointer-events:none;';
          // Suppress console errors for 416/network failures during pool recycling
          vid.addEventListener('error', function(e){
            if(this._retrying) { e.stopImmediatePropagation(); return; }
          });
          videoPool.push({ element: vid, assignedIndex: -1, inUse: false });
        }
      }

      function acquireVideo(index){
        // If already assigned to this index, return it
        if(videoPoolMap[index]){
          return videoPoolMap[index].element;
        }

        // Find a free pool entry
        var entry = null;
        for(var i = 0; i < videoPool.length; i++){
          if(!videoPool[i].inUse){
            entry = videoPool[i];
            break;
          }
        }

        // If no free entry, evict the one farthest from current index
        if(!entry){
          var maxDist = -1;
          for(var i = 0; i < videoPool.length; i++){
            var dist = Math.abs(videoPool[i].assignedIndex - currentIndex);
            if(dist > maxDist){
              maxDist = dist;
              entry = videoPool[i];
            }
          }
          // Release the old assignment
          if(entry.assignedIndex >= 0){
            releaseVideo(entry.assignedIndex);
          }
        }

        entry.inUse = true;
        entry.assignedIndex = index;
        videoPoolMap[index] = entry;
        return entry.element;
      }

      // Minimal empty MP4 (ftyp + moov atoms) for clean decoder reset
      var EMPTY_MP4 = 'data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAAIZnJlZQAAAAhtZGF0AAAA0m1vb3YAAABsbXZoZAAAAADc39yd3N/cnQAAA+gAAAPoAAEAAAEAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAIAAABidWR0YQAAAFptZXRhAAAAIWhkbHIAAAAAAAAAAG1kaXIAAAAAAAAAAAAAAAAAAAAAK2lsc3QAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAE3RyYWs=';

      function releaseVideo(index){
        var entry = videoPoolMap[index];
        if(!entry) return;
        var vid = entry.element;
        vid.pause();
        // M7 FIX: Abort all event listeners from the previous createReel call
        // before recycling. Prevents stale closures from overwriting src.
        if(vid._abortCtrl){ vid._abortCtrl.abort(); vid._abortCtrl = null; }
        // FIX: Assign a minimal empty MP4 to cleanly reset the decoder.
        // The old approach (removeAttribute('src') + load()) sends stale
        // Range Headers to the old CDN URL → HTTP 416 floods.
        // An empty data-URI MP4 gives the decoder a valid source to replace
        // the old one, flushing all buffered byte ranges.
        vid._retryCount = 0;
        vid._retrying = true;
        vid.preload = 'none';
        vid.src = EMPTY_MP4;
        vid._retrying = false;
        // OPTIMIZATION #4: Aggressively clear buffered data references
        vid._quality = null;
        vid.poster = '';
        // Remove from parent if attached
        if(vid.parentNode) vid.parentNode.removeChild(vid);
        entry.inUse = false;
        entry.assignedIndex = -1;
        delete videoPoolMap[index];
      }

      // ═══════════════════════════════════════════════════════════
      //  ⑯ AUDIO CROSSFADE — 150ms volume fade between reels
      // ═══════════════════════════════════════════════════════════

      var fadeIntervals = [];

      function fadeVolume(vid, from, to, duration, callback){
        var steps = 8;
        var stepDur = duration / steps;
        var stepVal = (to - from) / steps;
        var current = from;
        var i = 0;
        vid.volume = Math.max(0, Math.min(1, from));
        var interval = setInterval(function(){
          i++;
          current += stepVal;
          vid.volume = Math.max(0, Math.min(1, current));
          if(i >= steps){
            clearInterval(interval);
            vid.volume = Math.max(0, Math.min(1, to));
            if(callback) callback();
          }
        }, stepDur);
        fadeIntervals.push(interval);
        return interval;
      }

      function clearAllFades(){
        for(var i = 0; i < fadeIntervals.length; i++){
          clearInterval(fadeIntervals[i]);
        }
        fadeIntervals = [];
      }

      // ═══════════════════════════════════════════════════════════
      //  ⑰ CANVAS PRE-RENDER — show decoded frame during swipe
      // ═══════════════════════════════════════════════════════════
      //  During a swipe, the next reel might not have its video
      //  ready yet. By drawing the captured poster frame onto a
      //  <canvas>, the user sees content instead of a black void.

      function drawFramePreview(reel, index){
        if(!posterCache[index]) return;
        var existing = reel.querySelector('canvas.frame-preview');
        if(existing) return; // Already drawn

        var canvas = document.createElement('canvas');
        canvas.className = 'frame-preview';
        canvas.width = 360;
        canvas.height = 640;

        var img = new Image();
        img.onload = function(){
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, 360, 640);
          // Insert before video so video overlays it when ready
          var vid = reel.querySelector('video');
          if(vid){
            reel.insertBefore(canvas, vid);
          } else {
            reel.insertBefore(canvas, reel.firstChild);
          }
        };
        img.src = posterCache[index];
      }

      function removeFramePreview(reel){
        var canvas = reel.querySelector('canvas.frame-preview');
        if(canvas) canvas.remove();
      }

      // ═══════════════════════════════════════════════════════════
      //  ㉑ BLURHASH PLACEHOLDERS — compact gradient decoder
      // ═══════════════════════════════════════════════════════════
      //  If the feed provides a `blurhash` field, decode it into
      //  a tiny blurry image for instant placeholder display.
      //  Falls back to SVG gradient if no blurhash available.

      var blurHashChars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz#$%*+,-.:;=?@[]^_{|}~';

      function decodeBlurHash(hash, width, height){
        if(!hash || hash.length < 6) return null;
        try{
          var sizeFlag = blurHashChars.indexOf(hash[0]);
          var numY = Math.floor(sizeFlag / 9) + 1;
          var numX = (sizeFlag % 9) + 1;
          var quantMaxVal = blurHashChars.indexOf(hash[1]);
          var realMaxVal = (quantMaxVal + 1) / 166;

          var colors = [];
          // DC component
          var dcVal = (blurHashChars.indexOf(hash[2]) * 4096) + (blurHashChars.indexOf(hash[3]) * 64) + blurHashChars.indexOf(hash[4]);
          colors.push(decodeDC(dcVal));

          // AC components
          for(var i = 1; i < numX * numY; i++){
            var acIdx = 4 + i * 2;
            if(acIdx + 1 >= hash.length) break;
            var acVal = blurHashChars.indexOf(hash[acIdx]) * 83 + blurHashChars.indexOf(hash[acIdx + 1]);
            colors.push(decodeAC(acVal, realMaxVal));
          }

          // Render
          var canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          var ctx = canvas.getContext('2d');
          var imageData = ctx.createImageData(width, height);
          var data = imageData.data;

          for(var y = 0; y < height; y++){
            for(var x = 0; x < width; x++){
              var r = 0, g = 0, b = 0;
              for(var j = 0; j < numY; j++){
                for(var ii = 0; ii < numX; ii++){
                  var basis = Math.cos((Math.PI * x * ii) / width) * Math.cos((Math.PI * y * j) / height);
                  var color = colors[ii + j * numX];
                  if(color){
                    r += color[0] * basis;
                    g += color[1] * basis;
                    b += color[2] * basis;
                  }
                }
              }
              var idx = (y * width + x) * 4;
              data[idx]     = linearToSrgb(r);
              data[idx + 1] = linearToSrgb(g);
              data[idx + 2] = linearToSrgb(b);
              data[idx + 3] = 255;
            }
          }
          ctx.putImageData(imageData, 0, 0);
          return canvas.toDataURL('image/webp', 0.5);
        } catch(e){
          return null;
        }
      }

      function decodeDC(val){
        var r = val >> 16;
        var g = (val >> 8) & 255;
        var b = val & 255;
        return [srgbToLinear(r), srgbToLinear(g), srgbToLinear(b)];
      }

      function decodeAC(val, maxVal){
        var qR = Math.floor(val / (19 * 19));
        var qG = Math.floor(val / 19) % 19;
        var qB = val % 19;
        return [
          signPow((qR - 9) / 9, 2) * maxVal,
          signPow((qG - 9) / 9, 2) * maxVal,
          signPow((qB - 9) / 9, 2) * maxVal
        ];
      }

      function signPow(val, exp){ return (val < 0 ? -1 : 1) * Math.pow(Math.abs(val), exp); }
      function srgbToLinear(v){ v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }
      function linearToSrgb(v){ v = Math.max(0, Math.min(1, v)); return v <= 0.0031308 ? Math.round(v * 12.92 * 255) : Math.round((1.055 * Math.pow(v, 1/2.4) - 0.055) * 255); }

      // ═══════════════════════════════════════════════════════════
      //  ⑳ CDN ABSTRACTION LAYER — future-proof URL resolver
      // ═══════════════════════════════════════════════════════════
      //  Currently resolves to Convex proxy → Google Drive.
      //  When migrating to CDN,
      //  only this function needs to change.

      var CDN_CONFIG = {
        type: 'r2',           // 'convex' | 'r2' | 'bunny' | 'direct'
        convexBase: 'https://dynamic-labrador-874.convex.site/video',
        r2Base: 'https://cdn.scangym.com/videos',
        // bunnyBase: 'https://scangym.b-cdn.net/reels',
      };

      // ═══════════════════════════════════════════════════════════
      //  OPTIMIZATION #1: ADAPTIVE BITRATE — Select quality variant
      //  based on connection speed. Variants: 360p, 480p, 720p, 1080p
      //  The feed API returns a `variants` object per video.
      // ═══════════════════════════════════════════════════════════
      var currentQuality = 'auto'; // current selected quality tier
      var qualityHistory = [];     // track quality selections for adaptation
      var bufferHealthLog = [];    // track buffer health for quality adaptation

      // OPTIMIZATION #2b: Detect H.265/HEVC support — ~50% smaller at same quality
      // Safari/iOS, Chrome Android (hardware), Edge support HEVC. Firefox does not.
      var _hevcSupported = null;
      function supportsHevc(){
        if(_hevcSupported !== null) return _hevcSupported;
        try {
          var vid = document.createElement('video');
          // Check for HEVC (hvc1 tag used for Safari compatibility)
          _hevcSupported = vid.canPlayType('video/mp4; codecs="hvc1"') === 'probably'
                        || vid.canPlayType('video/mp4; codecs="hev1"') === 'probably'
                        || vid.canPlayType('video/mp4; codecs="hvc1.1.6.L93.B0"') === 'probably';
        } catch(e) { _hevcSupported = false; }
        return _hevcSupported;
      }

      // OPTIMIZATION #2: Detect connection type for optimal quality
      function getOptimalQuality(){
        var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        if(!conn) return '720p'; // Safe default
        var ect = conn.effectiveType;
        var downlink = conn.downlink || 10; // Mbps

        // OPTIMIZATION #3: Connection-aware quality selection
        if(ect === 'slow-2g' || ect === '2g' || downlink < 0.5) return '360p';
        if(ect === '3g' || downlink < 2)   return '480p';
        if(downlink < 5)                    return '720p';
        return '1080p'; // 4G/WiFi with good bandwidth
      }

      // Resolve video URL with adaptive quality variant selection
      // Prefers H.265/HEVC variants when device supports them (50% smaller files)
      function resolveVideoUrl(video, forceQuality){
        var quality = forceQuality || getOptimalQuality();
        currentQuality = quality;

        // If video has quality variants from API, use them
        if(video.variants){
          // OPTIMIZATION #2b: Try HEVC variant first (50% smaller) if supported
          var useHevc = supportsHevc();
          if(useHevc){
            // Map quality to HEVC variant name, then fallback to H.264
            var hevcMap = { '1080p': '720p_hevc', '720p': '720p_hevc', '480p': '480p_hevc', '360p': '480p_hevc' };
            var hevcKey = hevcMap[quality];
            if(hevcKey && video.variants[hevcKey] && video.variants[hevcKey].url){
              return video.variants[hevcKey].url;
            }
          }

          // Fallback: H.264 variants — try requested quality, then fall back to next lower
          var fallbackOrder = { '1080p': ['1080p','720p','480p','360p'], '720p': ['720p','480p','360p'], '480p': ['480p','360p','720p'], '360p': ['360p','480p'] };
          var order = fallbackOrder[quality] || ['720p','480p','360p'];
          for(var i = 0; i < order.length; i++){
            if(video.variants[order[i]] && video.variants[order[i]].url){
              return video.variants[order[i]].url;
            }
          }
        }

        // Fallback: original video (no variants available yet)
        switch(CDN_CONFIG.type){
          case 'r2':
            if(video.cdnKey) return CDN_CONFIG.r2Base + '/' + video.cdnKey + '.mp4';
            return video.url || '';
          case 'bunny':
            if(video.cdnKey) return CDN_CONFIG.bunnyBase + '/' + video.cdnKey + '.mp4';
            return video.url || '';
          case 'direct':
            return video.url || '';
          default:
            return video.url || '';
        }
      }

      // PERF FIX #1: Fallback URL via server proxy (adds CORS + cache headers)
      // Used by retry logic when direct R2 CDN fails due to CORS
      function resolveVideoProxyUrl(video){
        if(video.cdnKey) return '/api/reels/cdn-proxy/' + video.cdnKey;
        return resolveVideoUrl(video); // no proxy available for non-CDN videos
      }

      // ═══════════════════════════════════════════════════════════
      //  OPTIMIZATION #1b: RUNTIME QUALITY ADAPTATION
      //  Monitor buffer health during playback. If buffering stalls,
      //  downgrade quality. If buffer is healthy, upgrade.
      // ═══════════════════════════════════════════════════════════
      var qualityAdaptTimer = null;
      var stallCount = 0;
      var lastQualityChange = 0;
      var QUALITY_TIERS = ['360p', '480p', '720p', '1080p'];

      function startQualityAdaptation(vid, index){
        stopQualityAdaptation();
        stallCount = 0;
        var checkInterval = 3000; // Check every 3s

        vid.addEventListener('waiting', function onWaiting(){
          stallCount++;
          // If stalling repeatedly, downgrade quality
          if(stallCount >= 2 && Date.now() - lastQualityChange > 5000){
            downgradeQuality(index);
          }
        }, {signal: vid._abortCtrl ? vid._abortCtrl.signal : undefined});

        qualityAdaptTimer = setInterval(function(){
          if(!vid || vid.paused) return;
          // Check buffer health
          var buffered = 0;
          if(vid.buffered.length > 0){
            buffered = vid.buffered.end(vid.buffered.length - 1) - vid.currentTime;
          }
          bufferHealthLog.push(buffered);
          if(bufferHealthLog.length > 10) bufferHealthLog.shift();

          // Average buffer seconds over last 10 checks
          var avgBuffer = bufferHealthLog.reduce(function(a,b){ return a+b; }, 0) / bufferHealthLog.length;

          // If buffer is consistently healthy (>5s ahead), try upgrading
          if(avgBuffer > 5 && stallCount === 0 && Date.now() - lastQualityChange > 10000){
            upgradeQuality(index);
          }
        }, checkInterval);
      }

      function stopQualityAdaptation(){
        if(qualityAdaptTimer){ clearInterval(qualityAdaptTimer); qualityAdaptTimer = null; }
        bufferHealthLog = [];
      }

      function downgradeQuality(index){
        var currentTierIdx = QUALITY_TIERS.indexOf(currentQuality);
        if(currentTierIdx <= 0) return; // Already at lowest

        var newQuality = QUALITY_TIERS[currentTierIdx - 1];
        var video = allVideos[index];
        if(!video || !video.variants || !video.variants[newQuality]) return;

        lastQualityChange = Date.now();
        currentQuality = newQuality;
        stallCount = 0;

        // Switch source on current video
        var reel = renderedReels[index];
        if(reel){
          var vid = reel.querySelector('video');
          if(vid){
            var currentTime = vid.currentTime;
            vid.src = video.variants[newQuality].url;
            vid.currentTime = currentTime;
            vid.play().catch(function(){});
          }
        }
      }

      function upgradeQuality(index){
        var currentTierIdx = QUALITY_TIERS.indexOf(currentQuality);
        if(currentTierIdx >= QUALITY_TIERS.length - 1) return; // Already at highest

        var optimalQ = getOptimalQuality();
        var optimalIdx = QUALITY_TIERS.indexOf(optimalQ);
        if(currentTierIdx >= optimalIdx) return; // Already at or above optimal

        var newQuality = QUALITY_TIERS[Math.min(currentTierIdx + 1, optimalIdx)];
        var video = allVideos[index];
        if(!video || !video.variants || !video.variants[newQuality]) return;

        lastQualityChange = Date.now();
        currentQuality = newQuality;

        // Don't switch current video source (disruptive) — just set for next videos
      }

      // ═══════════════════════════════════════════════════════════
      //  OPTIMIZATION #4: AGGRESSIVE MEMORY MANAGEMENT
      //  Free video data for reels far from current view.
      //  Monitor memory pressure via performance.memory API.
      // ═══════════════════════════════════════════════════════════
      var MEMORY_CHECK_INTERVAL = 5000; // 5s
      var memoryWarning = false;

      function startMemoryManagement(){
        setInterval(function(){
          // Check memory pressure (Chrome-only API)
          if(performance.memory){
            var usedMB = performance.memory.usedJSHeapSize / (1024 * 1024);
            var limitMB = performance.memory.jsHeapSizeLimit / (1024 * 1024);
            var usage = usedMB / limitMB;

            if(usage > 0.7){
              memoryWarning = true;
              // Aggressive cleanup: shrink render window
              aggressiveCleanup();
            } else {
              memoryWarning = false;
            }
          }

          // Always clean up far-away prefetched data
          cleanupFarPrefetch();
        }, MEMORY_CHECK_INTERVAL);
      }

      function aggressiveCleanup(){
        // Release videos more than 2 positions away (normally 4)
        var keys = Object.keys(renderedReels);
        for(var k = 0; k < keys.length; k++){
          var idx = parseInt(keys[k]);
          if(Math.abs(idx - currentIndex) > 2){
            var el = renderedReels[idx];
            releaseVideo(idx);
            if(el && el.parentNode) el.parentNode.removeChild(el);
            delete renderedReels[idx];
          }
        }
        // Clear old poster cache entries
        var posterKeys = Object.keys(posterCache);
        for(var p = 0; p < posterKeys.length; p++){
          var pi = parseInt(posterKeys[p]);
          if(Math.abs(pi - currentIndex) > 10){
            delete posterCache[pi];
          }
        }
      }

      function cleanupFarPrefetch(){
        // Revoke blob URLs and abort fetches for videos far from current
        var keys = Object.keys(activeAbortControllers);
        for(var k = 0; k < keys.length; k++){
          var idx = parseInt(keys[k]);
          if(Math.abs(idx - currentIndex) > PREFETCH_AHEAD + 4){
            activeAbortControllers[idx].abort();
            delete activeAbortControllers[idx];
          }
        }

        // Clear Cache API entries for very old videos
        if(window.caches){
          caches.open('reels-v8-video').then(function(cache){
            cache.keys().then(function(requests){
              requests.forEach(function(request){
                // Check if this cached URL corresponds to a far-away video
                var url = request.url;
                var isFarAway = true;
                for(var i = Math.max(0, currentIndex - 3); i <= Math.min(allVideos.length - 1, currentIndex + PREFETCH_AHEAD + 2); i++){
                  var vUrl = resolveVideoUrl(allVideos[i]);
                  if(url.indexOf(vUrl) !== -1 || vUrl.indexOf(url) !== -1){
                    isFarAway = false;
                    break;
                  }
                }
                if(isFarAway){
                  cache.delete(request).catch(function(){});
                  // Also remove from prefetched tracking
                  delete prefetchedUrls[url];
                }
              });
            }).catch(function(){});
          }).catch(function(){});
        }
      }

      // ═══════════════════════════════════════════════════════════
      //  OPTIMIZATION #3b: CONNECTION-AWARE POSTER HOLDING
      //  On slow connections, show the poster/blurhash longer and
      //  delay video playback until enough is buffered.
      // ═══════════════════════════════════════════════════════════
      function getBufferThreshold(){
        var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        if(!conn) return 0; // Play immediately
        var ect = conn.effectiveType;
        if(ect === 'slow-2g' || ect === '2g') return 3; // Wait for 3s buffered
        if(ect === '3g') return 1.5; // Wait for 1.5s buffered
        return 0; // 4G/WiFi — play immediately
      }

      function waitForBuffer(vid, threshold, callback){
        if(threshold <= 0){ callback(); return; }
        var checkId = setInterval(function(){
          if(vid.buffered.length > 0){
            var buffered = vid.buffered.end(0);
            if(buffered >= threshold){
              clearInterval(checkId);
              callback();
            }
          }
        }, 200);
        // Timeout: play anyway after 5s
        setTimeout(function(){
          clearInterval(checkId);
          callback();
        }, 5000);
      }

      function applyDragFrame(){
        if(pendingDragY !== null){
          setTrackPosition(pendingDragY);
          pendingDragY = null;
        }
        dragRafId = null;
      }

      // ── Resize handler ──
      window.addEventListener('resize', function(){
        screenH = window.innerHeight;
        var keys = Object.keys(renderedReels);
        for(var k = 0; k < keys.length; k++){
          var idx = parseInt(keys[k]);
          var el = renderedReels[idx];
          el.style.height = screenH + 'px';
          el.style.top = (idx * screenH) + 'px';
        }
        snapTo(currentIndex, false);
      });

      // ═══════════════════════════════════════════════════════════
      //  TOUCH HANDLING
      // ═══════════════════════════════════════════════════════════

      track.addEventListener('touchstart', function(e){
        track.classList.remove('snapping');
        if(dragRafId){ cancelAnimationFrame(dragRafId); dragRafId = null; }
        // Cancel pending auto-scroll when user starts swiping

        touchStartY = t.clientY;
        touchStartT = Date.now();
        touchLastY  = t.clientY;
        touchLastT  = touchStartT;

        dragDelta   = 0;
        peakVelocity = 0;  // FIX C5: reset peak velocity for new gesture

      }, {passive: true});

      track.addEventListener('touchmove', function(e){
        if(!isDragging) return;
        e.preventDefault();
        var t   = e.touches[0];
        var now = Date.now();
        var dy  = t.clientY - touchStartY;
        touchLastY = t.clientY;
        touchLastT = now;
        touchHistory.push({y: t.clientY, t: now});

          touchHistory.shift();
        }
        // FIX C5: Track peak velocity — use highest speed seen during gesture
        if(touchHistory.length >= 2){
          var ph = touchHistory[touchHistory.length - 2];
          var pdt = now - ph.t;
          if(pdt > 0){
            var pv = Math.abs(t.clientY - ph.y) / pdt;
            if(pv > peakVelocity) peakVelocity = pv;
          }
        }

        var targetOffset = -(currentIndex * screenH) + dy;
        var maxOffset    = 0;
        var minOffset    = -((allVideos.length - 1) * screenH);
        if(targetOffset > maxOffset){
          var over = targetOffset - maxOffset;
          targetOffset = maxOffset + over * RUBBER_BAND;
        } else if(targetOffset < minOffset){
          var over = minOffset - targetOffset;
          targetOffset = minOffset - over * RUBBER_BAND;
        }

        dragDelta   = dy;

        pendingDragY = trackOffset;
        if(!dragRafId){
          dragRafId = requestAnimationFrame(applyDragFrame);
        }

        // ⑧ Gesture prediction + ⑰ Canvas pre-render
        if(!gesturePreloaded){
          var absD = Math.abs(dragDelta);
          var elapsed = now - touchStartT;
          var velocity = elapsed > 0 ? Math.abs(dy) / elapsed : 0;
          if(absD > screenH * 0.3 && velocity > SNAP_VELOCITY){

            var predictedNext = dy < 0 ? currentIndex + 1 : currentIndex - 1;
            if(predictedNext >= 0 && predictedNext < allVideos.length){
              upgradePreload(predictedNext);
              // ⑰ Draw canvas preview for the predicted next reel
              var nextReel = renderedReels[predictedNext];
              if(nextReel) drawFramePreview(nextReel, predictedNext);
            }
          }
        }
      }, {passive: false});

      track.addEventListener('touchend', function(e){
        if(!isDragging) return;
        if(currentIndex === 0 && dragDelta > 120){ refreshFeed(); } // TikTok: pull down on the first video to refresh
        isDragging = false;
        if(dragRafId){ cancelAnimationFrame(dragRafId); dragRafId = null; }
        if(pendingDragY !== null){
          setTrackPosition(pendingDragY);
          pendingDragY = null;
        }

        var now = Date.now();
        var velocity = 0;
        if(touchHistory.length >= 2){
          var recent = touchHistory.filter(function(p){ return now - p.t <= 100; });
          if(recent.length >= 2){
            var first = recent[0];
            var last  = recent[recent.length - 1];
            var dt = last.t - first.t;
            if(dt > 0) velocity = (last.y - first.y) / dt;

          }

        var absV = Math.max(Math.abs(velocity), peakVelocity);
