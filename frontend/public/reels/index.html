<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/reels/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <title>ScanGym Reels — Book a Gym. Anywhere.</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ScanGym" />
    <meta property="og:title" content="ScanGym Reels — Book a Gym. Anywhere." />
    <meta property="og:description" content="Discover gyms near you. £5 day passes, no membership needed. Swipe through real gym content from creators worldwide." />
    <meta property="og:image" content="https://scangym.com/reels/og-image.png" />
    <meta name="theme-color" content="#050816" />
    <!-- Phase 3: standalone mode — no iframe dependency -->
    <link rel="manifest" href="/reels/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
      html,body{
        height:100%;height:100dvh;
        overflow:hidden;background:#000;
        font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
        touch-action:none;
        overscroll-behavior:none;
        -webkit-user-select:none;user-select:none;
      }

      /* ── Reel Track (GPU-accelerated vertical strip) ── */
      #reel-track{
        position:fixed;top:0;left:0;right:0;
        will-change:transform;
        touch-action:none;
      }
      /* v3: 280ms snap with spring overshoot */
      #reel-track.snapping{
        transition:transform 280ms cubic-bezier(0.34,1.56,0.64,1);
      }

      /* ── Individual Reel ── */
      .reel{
        position:absolute;left:0;top:0;
        width:100vw;height:100vh;height:100dvh;
        overflow:hidden;background:#0a0a16;
      }
      .reel video{
        position:absolute;top:0;left:0;width:100%;height:100%;
        object-fit:cover;
        pointer-events:none;
      }
      /* Letterbox horizontal (landscape) videos instead of cropping */
      .reel.landscape video{
        object-fit:contain !important;
      }
      .reel.landscape{
        background:#000;
      }

      /* Phase 2: Canvas pre-render overlay (shows poster during swipe) */
      .reel canvas.frame-preview{
        position:absolute;top:0;left:0;width:100%;height:100%;
        object-fit:cover;pointer-events:none;z-index:1;
      }
      .reel video.has-frame{z-index:2;}

      /* Gradient overlays */
      .reel::before{
        content:'';position:absolute;top:0;left:0;right:0;height:120px;
        background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,transparent 100%);
        z-index:10;pointer-events:none;
      }
      .reel::after{
        content:'';position:absolute;bottom:0;left:0;right:0;height:200px;
        background:linear-gradient(0deg,rgba(0,0,0,.65) 0%,transparent 100%);
        z-index:10;pointer-events:none;
      }

      /* ── Video info (bottom-left) ── */
      .reel-info{
        position:absolute;bottom:72px;left:16px;right:72px;z-index:20;
        color:#fff;
      }
      .reel-info .reel-title{
        font-size:14px;font-weight:700;line-height:1.35;
        text-shadow:0 1px 8px rgba(0,0,0,.8);
        display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
      }
      .reel-info .reel-category{
        font-size:11px;color:rgba(255,255,255,.55);margin-top:4px;
        text-shadow:0 1px 4px rgba(0,0,0,.5);
      }
      .reel-info .reel-creator{
        font-size:12px;color:#f97316;font-weight:600;margin-top:3px;
        text-shadow:0 1px 4px rgba(0,0,0,.5);
      }

      /* ── Creator affiliate CTA ── */
      .creator-cta{
        display:flex;align-items:center;gap:8px;
        margin-top:8px;padding:8px 12px;
        background:rgba(249,115,22,.15);border:1px solid rgba(249,115,22,.3);
        border-radius:12px;cursor:pointer;
        backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
        transition:all .15s;max-width:fit-content;
        text-decoration:none;
      }
      .creator-cta:active{transform:scale(0.96);background:rgba(249,115,22,.25);}
      .creator-cta-icon{font-size:16px;}
      .creator-cta-text{font-size:12px;font-weight:700;color:#f97316;line-height:1.2;}
      .creator-cta-sub{font-size:10px;color:rgba(255,255,255,.5);font-weight:500;}

      /* ── Action sidebar (right) ── */
      .reel-actions{
        position:absolute;bottom:80px;right:10px;z-index:20;
        display:flex;flex-direction:column;align-items:center;gap:12px;
      }
      .reel-action{
        display:flex;flex-direction:column;align-items:center;gap:2px;
        cursor:pointer;transition:transform .12s ease;text-decoration:none;
      }
      .reel-action:active{transform:scale(0.82);}
      .reel-action .icon{
        width:44px;height:44px;border-radius:50%;
        background:rgba(0,0,0,.4);backdrop-filter:blur(12px);
        border:1.5px solid rgba(255,255,255,.12);
        display:flex;align-items:center;justify-content:center;
        box-shadow:0 2px 10px rgba(0,0,0,.25);
        transition:background .2s,border-color .2s;
      }
      .reel-action .icon svg{
        width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;
        stroke-linecap:round;stroke-linejoin:round;
      }
      .reel-action .label{
        color:#fff;font-size:10px;font-weight:600;
        text-shadow:0 1px 4px rgba(0,0,0,.8);
      }
      .reel-action[data-action="book"] .icon{background:rgba(249,115,22,.85);border-color:rgba(249,115,22,.9);}

      /* ── Floating Create FAB ── */
      #create-fab{
        position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
        z-index:40;display:flex;align-items:center;gap:6px;
        padding:12px 24px;
        background:linear-gradient(135deg,#22c55e 0%,#16a34a 100%);
        border:2px solid rgba(255,255,255,.2);
        border-radius:28px;
        color:#fff;font-size:15px;font-weight:800;
        cursor:pointer;text-decoration:none;
        box-shadow:0 4px 24px rgba(34,197,94,.4),0 0 0 0 rgba(34,197,94,.3);
        transition:all .15s ease;
        animation:fabPulse 3s ease-in-out infinite;
        letter-spacing:0.3px;
      }
      #create-fab:active{transform:translateX(-50%) scale(0.92);box-shadow:0 2px 12px rgba(34,197,94,.3);}
      #create-fab svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
      @keyframes fabPulse{
        0%,100%{box-shadow:0 4px 24px rgba(34,197,94,.4),0 0 0 0 rgba(34,197,94,.3);}
        50%{box-shadow:0 4px 24px rgba(34,197,94,.5),0 0 0 8px rgba(34,197,94,0);}
      }
      #create-fab .fab-earn{
        font-size:10px;font-weight:600;color:rgba(255,255,255,.8);
        background:rgba(0,0,0,.2);padding:2px 8px;border-radius:10px;
        margin-left:2px;
      }

      /* ── Progress bar ── */
      .reel-progress{
        position:absolute;bottom:0;left:0;right:0;height:3px;
        z-index:25;background:rgba(255,255,255,.12);
      }
      .reel-progress-buffered{
        position:absolute;top:0;left:0;height:100%;width:0%;
        background:rgba(255,255,255,.18);
        border-radius:0 2px 2px 0;
      }
      .reel-progress-bar{
        position:absolute;top:0;left:0;height:100%;width:0%;
        background:#f97316;
        border-radius:0 2px 2px 0;
      }

      /* ── Shimmer loading ── */
      #loading{
        position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;
        background:#0a0a16;display:flex;flex-direction:column;
        align-items:center;justify-content:center;gap:16px;
      }
      .shimmer-container{
        width:100%;height:100%;position:relative;overflow:hidden;
      }
      .shimmer-content{
        position:absolute;bottom:80px;left:16px;right:72px;
        display:flex;flex-direction:column;gap:8px;
      }
      .shimmer-line{
        height:14px;border-radius:7px;
        background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.04) 75%);
        background-size:200% 100%;
        animation:shimmer 1.5s ease-in-out infinite;
      }
      .shimmer-line:nth-child(1){width:65%;}
      .shimmer-line:nth-child(2){width:45%;height:10px;}
      .shimmer-line:nth-child(3){width:80%;height:10px;margin-top:4px;}
      .shimmer-actions{
        position:absolute;bottom:80px;right:10px;
        display:flex;flex-direction:column;gap:12px;align-items:center;
      }
      .shimmer-circle{
        width:44px;height:44px;border-radius:50%;
        background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.04) 75%);
        background-size:200% 100%;
        animation:shimmer 1.5s ease-in-out infinite;
      }
      .shimmer-circle:nth-child(2){animation-delay:.15s;}
      .shimmer-circle:nth-child(3){animation-delay:.3s;}
      .shimmer-circle:nth-child(4){animation-delay:.45s;}
      .shimmer-progress{
        position:absolute;bottom:0;left:0;right:0;height:3px;
        background:linear-gradient(90deg,rgba(249,115,22,.1) 25%,rgba(249,115,22,.25) 50%,rgba(249,115,22,.1) 75%);
        background-size:200% 100%;
        animation:shimmer 1.5s ease-in-out infinite;
      }
      @keyframes shimmer{
        0%{background-position:200% 0;}
        100%{background-position:-200% 0;}
      }
      #loading p{color:rgba(255,255,255,.3);font-size:12px;position:absolute;bottom:40px;left:50%;transform:translateX(-50%);}
      .spinner{
        width:40px;height:40px;border:3px solid rgba(249,115,22,.2);
        border-top-color:#f97316;border-radius:50%;
        animation:spin .8s linear infinite;
      }
      @keyframes spin{to{transform:rotate(360deg);}}
      .reel-buffering{
        position:absolute;top:0;left:0;right:0;bottom:0;
        display:flex;align-items:center;justify-content:center;
        z-index:15;pointer-events:none;
      }

      /* ── Mute indicator ── */
      #mute-indicator{
        position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
        z-index:30;font-size:48px;opacity:0;transition:opacity .2s;
        pointer-events:none;text-shadow:0 2px 20px rgba(0,0,0,.6);
      }
      #mute-indicator.show{opacity:1;}

      /* ── Tap-for-sound indicator ── */
      #sound-hint{
        position:fixed;top:16px;right:16px;z-index:35;
        display:flex;align-items:center;gap:6px;
        padding:6px 12px;border-radius:20px;
        background:rgba(0,0,0,.6);backdrop-filter:blur(8px);
        color:#fff;font-size:12px;font-weight:600;
        pointer-events:none;opacity:0;
        transition:opacity .3s;
        animation:soundPulse 2s ease-in-out infinite;
      }
      #sound-hint.show{opacity:1;}
      #sound-hint svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;}
      @keyframes soundPulse{
        0%,100%{opacity:0.7;transform:scale(1);}
        50%{opacity:1;transform:scale(1.04);}
      }

      /* ── Double-tap like animation ── */
      .like-burst{
        position:fixed;z-index:999;pointer-events:none;
        font-size:80px;
        animation:likePop .8s cubic-bezier(.17,.89,.32,1.28) forwards;
      }
      @keyframes likePop{
        0%{transform:translate(-50%,-50%) scale(0);opacity:1;}
        50%{transform:translate(-50%,-50%) scale(1.2);opacity:1;}
        100%{transform:translate(-50%,-50%) scale(1);opacity:0;}
      }
      .like-particle{
        position:fixed;z-index:998;pointer-events:none;font-size:24px;
        animation:likeFloat 1s ease-out forwards;
      }
      @keyframes likeFloat{
        0%{opacity:1;transform:translate(-50%,-50%) scale(0) rotate(0deg);}
        40%{opacity:1;transform:translate(var(--tx),var(--ty)) scale(1) rotate(var(--rot));}
        100%{opacity:0;transform:translate(var(--tx),calc(var(--ty) - 40px)) scale(0.5) rotate(var(--rot));}
      }

      /* ── Toast ── */
      .toast{
        position:fixed;top:60px;left:50%;transform:translateX(-50%);
        background:#22c55e;color:#fff;font-size:13px;font-weight:700;
        padding:8px 20px;border-radius:12px;z-index:999;
        animation:toastIn .2s ease-out;pointer-events:none;
        box-shadow:0 4px 20px rgba(34,197,94,.3);
      }
      @keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-10px);}}

      /* ── Video error overlay ── */
      .reel-error{
        position:absolute;top:0;left:0;right:0;bottom:0;z-index:15;
        display:flex;flex-direction:column;align-items:center;justify-content:center;
        background:rgba(10,10,22,.9);color:rgba(255,255,255,.5);gap:8px;
      }
      .reel-error span{font-size:40px;}
      .reel-error p{font-size:13px;}

      /* ── Swipe hint ── */
      .swipe-hint{
        position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
        z-index:35;display:flex;flex-direction:column;align-items:center;
        gap:4px;pointer-events:none;
        animation:hintBounce 1.8s ease-in-out infinite;
      }
      .swipe-hint svg{width:28px;height:28px;stroke:#fff;stroke-width:2;fill:none;opacity:.6;}
      .swipe-hint span{color:rgba(255,255,255,.5);font-size:11px;font-weight:600;}
      @keyframes hintBounce{
        0%,100%{transform:translateX(-50%) translateY(0);}
        50%{transform:translateX(-50%) translateY(-12px);}
      }
    </style>
  </head>
  <body>
    <!-- Shimmer skeleton loading -->
    <div id="loading">
      <div class="shimmer-container">
        <div class="shimmer-content">
          <div class="shimmer-line"></div>
          <div class="shimmer-line"></div>
          <div class="shimmer-line"></div>
        </div>
        <div class="shimmer-actions">
          <div class="shimmer-circle"></div>
          <div class="shimmer-circle"></div>
          <div class="shimmer-circle"></div>
          <div class="shimmer-circle"></div>
        </div>
        <div class="shimmer-progress"></div>
      </div>
      <p>ScanGym</p>
    </div>
    <div id="mute-indicator"></div>
    <!-- Tap-for-sound indicator -->
    <div id="sound-hint">
      <svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
      Tap for sound
    </div>
    <div id="reel-track"></div>
    <div class="swipe-hint" id="swipe-hint">
      <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      <span>Swipe up</span>
    </div>

    <!-- Create FAB moved to right sidebar actions (per reel) -->

    <script>
    /**
     * ScanGym Reels v4 — Native-Grade + Infrastructure
     * ──────────────────────────────────────────────────
     * Phase 2 (Native-Grade Polish):
     *   ⑮ Video element pool  — 3 recycled <video> elements, zero DOM create/destroy
     *   ⑯ Audio crossfade     — 150ms volume fade between reels
     *   ⑰ Canvas pre-render   — decoded first-frame drawn during swipe
     *   ⑱ Desktop refinements — trackpad momentum, smoother wheel handling
     *
     * Phase 3 (Infrastructure):
     *   ⑲ Service worker      — stale-while-revalidate feed, cache-first videos
     *   ⑳ CDN abstraction     — video URL resolver for future CDN migration
     *   ㉑ BlurHash placeholders — 4×3 decoded gradient from compact hash
     *   ㉒ Standalone mode     — no iframe dependency, PWA-ready meta tags
     *
     * Retained: all v2 (①–⑤) and v3 (⑥–⑭) optimizations
     */
    (function(){
      'use strict';

      // ── SVG Icons ──
      var ICONS = {
        book:   '<svg viewBox="0 0 24 24"><path d="M8 2v4m8-4v4"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18"/><path d="M9 16l2 2 4-4"/></svg>',
        share:  '<svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98"/></svg>',
        save:   '<svg viewBox="0 0 24 24"><path d="M12 4v12m0 0l-4-4m4 4l4-4"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>',
        more:   '<svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5" fill="#fff" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="#fff" stroke="none"/><circle cx="12" cy="19" r="1.5" fill="#fff" stroke="none"/></svg>',
        create: '<svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>'
      };

      // ── Constants ──
      var SNAP_VELOCITY    = 0.3;
      var SNAP_THRESHOLD   = 0.2;
      var SNAP_DURATION    = 280;
      var RUBBER_BAND      = 0.3;
      var RENDER_WINDOW    = 3;       // Keep 3 reels above + below rendered
      var PREFETCH_AHEAD   = 8;      // Prefetch next 8 videos
      var PAGE_SIZE        = 20;
      var LOAD_MORE_AT     = 5;      // Start loading more earlier
      var POOL_SIZE        = 5;      // ⑮ video element pool — 5 for smoother fast scrolling
      var CROSSFADE_MS     = 150;    // ⑯ audio crossfade duration

      // ── Placeholder poster (SVG) ──
      var PLACEHOLDER_POSTER = 'data:image/svg+xml,' + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="360" height="640">'
        + '<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">'
        + '<stop offset="0%" stop-color="#16162a"/>'
        + '<stop offset="100%" stop-color="#0a0a16"/>'
        + '</linearGradient></defs>'
        + '<rect width="360" height="640" fill="url(#g)"/>'
        + '<circle cx="180" cy="300" r="32" fill="none" stroke="rgba(249,115,22,0.2)" stroke-width="3"/>'
        + '<polygon points="172,286 172,314 196,300" fill="rgba(249,115,22,0.25)"/>'
        + '</svg>'
      );

      // ── State ──
      var allVideos      = [];
      var currentIndex   = 0;
      var isMuted        = true;
      var screenH        = window.innerHeight;
      var trackOffset    = 0;
      var renderedReels  = {};
      var prefetchedUrls = {};
      var posterCache    = {};
      var progressRafId  = null;
      var feedHasMore    = true;
      var feedOffset     = 0;
      var feedLoading    = false;
      var soundHintShown = false;

      var track   = document.getElementById('reel-track');
      var loading = document.getElementById('loading');
      var hint    = document.getElementById('swipe-hint');

      // ── Touch state ──
      var touchStartY   = 0;
      var touchStartT   = 0;
      var touchLastY    = 0;
      var touchLastT    = 0;
      var isDragging    = false;
      var dragDelta     = 0;
      var touchHistory  = [];
      var pendingDragY  = null;
      var dragRafId     = null;
      var gesturePreloaded = false;

      // ═══════════════════════════════════════════════════════════
      //  ⑮ VIDEO ELEMENT POOL — 3 recycled elements
      // ═══════════════════════════════════════════════════════════
      //  Instead of creating/destroying <video> elements (expensive:
      //  browser must allocate decoder pipeline each time), we maintain
      //  a pool of 3 elements and reassign src. This matches how
      //  TikTok uses 3 ExoPlayer instances on Android.

      var videoPool = [];                // Array of {element, assignedIndex}
      var videoPoolMap = {};             // index → pool entry

      function initVideoPool(){
        for(var i = 0; i < POOL_SIZE; i++){
          var vid = document.createElement('video');
          vid.loop = true;
          vid.muted = isMuted;
          vid.playsInline = true;
          vid.setAttribute('playsinline', '');
          vid.setAttribute('webkit-playsinline', '');
          vid.preload = 'metadata';
          vid.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;pointer-events:none;';
          videoPool.push({ element: vid, assignedIndex: -1, inUse: false });
        }
      }

      function acquireVideo(index){
        // If already assigned to this index, return it
        if(videoPoolMap[index]){
          return videoPoolMap[index].element;
        }

        // Find a free pool entry
        var entry = null;
        for(var i = 0; i < videoPool.length; i++){
          if(!videoPool[i].inUse){
            entry = videoPool[i];
            break;
          }
        }

        // If no free entry, evict the one farthest from current index
        if(!entry){
          var maxDist = -1;
          for(var i = 0; i < videoPool.length; i++){
            var dist = Math.abs(videoPool[i].assignedIndex - currentIndex);
            if(dist > maxDist){
              maxDist = dist;
              entry = videoPool[i];
            }
          }
          // Release the old assignment
          if(entry.assignedIndex >= 0){
            releaseVideo(entry.assignedIndex);
          }
        }

        entry.inUse = true;
        entry.assignedIndex = index;
        videoPoolMap[index] = entry;
        return entry.element;
      }

      function releaseVideo(index){
        var entry = videoPoolMap[index];
        if(!entry) return;
        var vid = entry.element;
        vid.pause();
        vid.removeAttribute('src');
        vid.load(); // Reset internal state
        // Remove from parent if attached
        if(vid.parentNode) vid.parentNode.removeChild(vid);
        entry.inUse = false;
        entry.assignedIndex = -1;
        delete videoPoolMap[index];
      }

      // ═══════════════════════════════════════════════════════════
      //  ⑯ AUDIO CROSSFADE — 150ms volume fade between reels
      // ═══════════════════════════════════════════════════════════

      var fadeIntervals = [];

      function fadeVolume(vid, from, to, duration, callback){
        var steps = 8;
        var stepDur = duration / steps;
        var stepVal = (to - from) / steps;
        var current = from;
        var i = 0;
        vid.volume = Math.max(0, Math.min(1, from));
        var interval = setInterval(function(){
          i++;
          current += stepVal;
          vid.volume = Math.max(0, Math.min(1, current));
          if(i >= steps){
            clearInterval(interval);
            vid.volume = Math.max(0, Math.min(1, to));
            if(callback) callback();
          }
        }, stepDur);
        fadeIntervals.push(interval);
        return interval;
      }

      function clearAllFades(){
        for(var i = 0; i < fadeIntervals.length; i++){
          clearInterval(fadeIntervals[i]);
        }
        fadeIntervals = [];
      }

      // ═══════════════════════════════════════════════════════════
      //  ⑰ CANVAS PRE-RENDER — show decoded frame during swipe
      // ═══════════════════════════════════════════════════════════
      //  During a swipe, the next reel might not have its video
      //  ready yet. By drawing the captured poster frame onto a
      //  <canvas>, the user sees content instead of a black void.

      function drawFramePreview(reel, index){
        if(!posterCache[index]) return;
        var existing = reel.querySelector('canvas.frame-preview');
        if(existing) return; // Already drawn

        var canvas = document.createElement('canvas');
        canvas.className = 'frame-preview';
        canvas.width = 360;
        canvas.height = 640;

        var img = new Image();
        img.onload = function(){
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, 360, 640);
          // Insert before video so video overlays it when ready
          var vid = reel.querySelector('video');
          if(vid){
            reel.insertBefore(canvas, vid);
          } else {
            reel.insertBefore(canvas, reel.firstChild);
          }
        };
        img.src = posterCache[index];
      }

      function removeFramePreview(reel){
        var canvas = reel.querySelector('canvas.frame-preview');
        if(canvas) canvas.remove();
      }

      // ═══════════════════════════════════════════════════════════
      //  ㉑ BLURHASH PLACEHOLDERS — compact gradient decoder
      // ═══════════════════════════════════════════════════════════
      //  If the feed provides a `blurhash` field, decode it into
      //  a tiny blurry image for instant placeholder display.
      //  Falls back to SVG gradient if no blurhash available.

      var blurHashChars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz#$%*+,-.:;=?@[]^_{|}~';

      function decodeBlurHash(hash, width, height){
        if(!hash || hash.length < 6) return null;
        try{
          var sizeFlag = blurHashChars.indexOf(hash[0]);
          var numY = Math.floor(sizeFlag / 9) + 1;
          var numX = (sizeFlag % 9) + 1;
          var quantMaxVal = blurHashChars.indexOf(hash[1]);
          var realMaxVal = (quantMaxVal + 1) / 166;

          var colors = [];
          // DC component
          var dcVal = (blurHashChars.indexOf(hash[2]) * 4096) + (blurHashChars.indexOf(hash[3]) * 64) + blurHashChars.indexOf(hash[4]);
          colors.push(decodeDC(dcVal));

          // AC components
          for(var i = 1; i < numX * numY; i++){
            var acIdx = 4 + i * 2;
            if(acIdx + 1 >= hash.length) break;
            var acVal = blurHashChars.indexOf(hash[acIdx]) * 83 + blurHashChars.indexOf(hash[acIdx + 1]);
            colors.push(decodeAC(acVal, realMaxVal));
          }

          // Render
          var canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          var ctx = canvas.getContext('2d');
          var imageData = ctx.createImageData(width, height);
          var data = imageData.data;

          for(var y = 0; y < height; y++){
            for(var x = 0; x < width; x++){
              var r = 0, g = 0, b = 0;
              for(var j = 0; j < numY; j++){
                for(var ii = 0; ii < numX; ii++){
                  var basis = Math.cos((Math.PI * x * ii) / width) * Math.cos((Math.PI * y * j) / height);
                  var color = colors[ii + j * numX];
                  if(color){
                    r += color[0] * basis;
                    g += color[1] * basis;
                    b += color[2] * basis;
                  }
                }
              }
              var idx = (y * width + x) * 4;
              data[idx]     = linearToSrgb(r);
              data[idx + 1] = linearToSrgb(g);
              data[idx + 2] = linearToSrgb(b);
              data[idx + 3] = 255;
            }
          }
          ctx.putImageData(imageData, 0, 0);
          return canvas.toDataURL('image/webp', 0.5);
        } catch(e){
          return null;
        }
      }

      function decodeDC(val){
        var r = val >> 16;
        var g = (val >> 8) & 255;
        var b = val & 255;
        return [srgbToLinear(r), srgbToLinear(g), srgbToLinear(b)];
      }

      function decodeAC(val, maxVal){
        var qR = Math.floor(val / (19 * 19));
        var qG = Math.floor(val / 19) % 19;
        var qB = val % 19;
        return [
          signPow((qR - 9) / 9, 2) * maxVal,
          signPow((qG - 9) / 9, 2) * maxVal,
          signPow((qB - 9) / 9, 2) * maxVal
        ];
      }

      function signPow(val, exp){ return (val < 0 ? -1 : 1) * Math.pow(Math.abs(val), exp); }
      function srgbToLinear(v){ v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }
      function linearToSrgb(v){ v = Math.max(0, Math.min(1, v)); return v <= 0.0031308 ? Math.round(v * 12.92 * 255) : Math.round((1.055 * Math.pow(v, 1/2.4) - 0.055) * 255); }

      // ═══════════════════════════════════════════════════════════
      //  ⑳ CDN ABSTRACTION LAYER — future-proof URL resolver
      // ═══════════════════════════════════════════════════════════
      //  Currently resolves to Convex proxy → Google Drive.
      //  When migrating to CDN (Cloudflare R2, BunnyCDN, etc.),
      //  only this function needs to change.

      var CDN_CONFIG = {
        type: 'r2',           // 'convex' | 'r2' | 'bunny' | 'direct'
        convexBase: 'https://dynamic-labrador-874.convex.site/video',
        r2Base: 'https://cdn.scangym.com/videos',
        // bunnyBase: 'https://scangym.b-cdn.net/reels',
      };

      function resolveVideoUrl(video){
        switch(CDN_CONFIG.type){
          case 'convex':
            if(video.driveId) return CDN_CONFIG.convexBase + '?id=' + video.driveId;
            return video.url || '';
          case 'r2':
            if(video.cdnKey) return CDN_CONFIG.r2Base + '/' + video.cdnKey + '.mp4';
            // Fallback: use Convex proxy for Google Drive videos not yet migrated to R2
            if(video.driveId) return CDN_CONFIG.convexBase + '?id=' + video.driveId;
            return video.url || '';
          case 'bunny':
            return CDN_CONFIG.bunnyBase + '/' + (video.cdnKey || video.driveId) + '.mp4';
          case 'direct':
            return video.url || '';
          default:
            return video.url || '';
        }
      }

      // PERF FIX #1: Fallback URL via server proxy (adds CORS + cache headers)
      // Used by retry logic when direct R2 CDN fails due to CORS
      function resolveVideoProxyUrl(video){
        if(video.cdnKey) return '/api/reels/cdn-proxy/' + video.cdnKey;
        return resolveVideoUrl(video); // no proxy available for non-CDN videos
      }

      // Adaptive quality based on connection
      function getOptimalQuality(){
        var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        if(!conn) return 'auto';
        var ect = conn.effectiveType;
        if(ect === '4g') return '1080p';
        if(ect === '3g') return '720p';
        return '360p';
      }

      function applyDragFrame(){
        if(pendingDragY !== null){
          setTrackPosition(pendingDragY);
          pendingDragY = null;
        }
        dragRafId = null;
      }

      // ── Resize handler ──
      window.addEventListener('resize', function(){
        screenH = window.innerHeight;
        var keys = Object.keys(renderedReels);
        for(var k = 0; k < keys.length; k++){
          var idx = parseInt(keys[k]);
          var el = renderedReels[idx];
          el.style.height = screenH + 'px';
          el.style.top = (idx * screenH) + 'px';
        }
        snapTo(currentIndex, false);
      });

      // ═══════════════════════════════════════════════════════════
      //  TOUCH HANDLING
      // ═══════════════════════════════════════════════════════════

      track.addEventListener('touchstart', function(e){
        track.classList.remove('snapping');
        if(dragRafId){ cancelAnimationFrame(dragRafId); dragRafId = null; }
        var t = e.touches[0];
        touchStartY = t.clientY;
        touchStartT = Date.now();
        touchLastY  = t.clientY;
        touchLastT  = touchStartT;
        isDragging  = true;
        dragDelta   = 0;
        gesturePreloaded = false;
        touchHistory = [{y: t.clientY, t: touchStartT}];
      }, {passive: true});

      track.addEventListener('touchmove', function(e){
        if(!isDragging) return;
        e.preventDefault();
        var t   = e.touches[0];
        var now = Date.now();
        var dy  = t.clientY - touchStartY;
        touchLastY = t.clientY;
        touchLastT = now;
        touchHistory.push({y: t.clientY, t: now});
        while(touchHistory.length > 1 && now - touchHistory[0].t > 150){
          touchHistory.shift();
        }

        var targetOffset = -(currentIndex * screenH) + dy;
        var maxOffset    = 0;
        var minOffset    = -((allVideos.length - 1) * screenH);
        if(targetOffset > maxOffset){
          var over = targetOffset - maxOffset;
          targetOffset = maxOffset + over * RUBBER_BAND;
        } else if(targetOffset < minOffset){
          var over = minOffset - targetOffset;
          targetOffset = minOffset - over * RUBBER_BAND;
        }
        trackOffset = targetOffset;
        dragDelta   = dy;

        pendingDragY = trackOffset;
        if(!dragRafId){
          dragRafId = requestAnimationFrame(applyDragFrame);
        }

        // ⑧ Gesture prediction + ⑰ Canvas pre-render
        if(!gesturePreloaded){
          var absD = Math.abs(dragDelta);
          var elapsed = now - touchStartT;
          var velocity = elapsed > 0 ? Math.abs(dy) / elapsed : 0;
          if(absD > screenH * 0.3 && velocity > SNAP_VELOCITY){
            gesturePreloaded = true;
            var predictedNext = dy < 0 ? currentIndex + 1 : currentIndex - 1;
            if(predictedNext >= 0 && predictedNext < allVideos.length){
              upgradePreload(predictedNext);
              // ⑰ Draw canvas preview for the predicted next reel
              var nextReel = renderedReels[predictedNext];
              if(nextReel) drawFramePreview(nextReel, predictedNext);
            }
          }
        }
      }, {passive: false});

      track.addEventListener('touchend', function(e){
        if(!isDragging) return;
        isDragging = false;
        if(dragRafId){ cancelAnimationFrame(dragRafId); dragRafId = null; }
        if(pendingDragY !== null){
          setTrackPosition(pendingDragY);
          pendingDragY = null;
        }

        var now = Date.now();
        var velocity = 0;
        if(touchHistory.length >= 2){
          var recent = touchHistory.filter(function(p){ return now - p.t <= 100; });
          if(recent.length >= 2){
            var first = recent[0];
            var last  = recent[recent.length - 1];
            var dt = last.t - first.t;
            if(dt > 0) velocity = (last.y - first.y) / dt;
          } else {
            var totalTime = now - touchStartT;
            if(totalTime > 0) velocity = (touchLastY - touchStartY) / totalTime;
          }
        }

        var absD = Math.abs(dragDelta);
        var absV = Math.abs(velocity);
        var next = currentIndex;
        if(absD > screenH * SNAP_THRESHOLD || absV > SNAP_VELOCITY){
          if(dragDelta < 0 && currentIndex < allVideos.length - 1){
            next = currentIndex + 1;
          } else if(dragDelta > 0 && currentIndex > 0){
            next = currentIndex - 1;
          }
        }
        snapTo(next, true);
        if(next !== currentIndex && navigator.vibrate) navigator.vibrate(10);

        if(hint){
          var h = hint;
          hint = null;
          h.style.opacity = '0';
          h.style.transition = 'opacity .3s';
          setTimeout(function(){ if(h.parentNode) h.parentNode.removeChild(h); }, 400);
        }
      }, {passive: true});

      document.body.addEventListener('touchmove', function(e){
        if(isDragging) e.preventDefault();
      }, {passive: false});

      // ── ⑱ Desktop wheel — improved trackpad/mouse handling ──
      var wheelAccum    = 0;
      var wheelLock     = false;
      var wheelResetId  = null;
      var lastWheelTime = 0;

      window.addEventListener('wheel', function(e){
        e.preventDefault();
        if(wheelLock) return;

        var now = Date.now();
        var dt = now - lastWheelTime;
        lastWheelTime = now;

        // Detect trackpad vs mouse: trackpad sends many small deltas quickly
        var isTrackpad = dt < 50 && Math.abs(e.deltaY) < 40;
        var threshold = isTrackpad ? 80 : 50;

        wheelAccum += e.deltaY;
        if(wheelResetId) clearTimeout(wheelResetId);
        wheelResetId = setTimeout(function(){ wheelAccum = 0; }, isTrackpad ? 200 : 150);

        if(Math.abs(wheelAccum) > threshold){
          wheelLock = true;
          var dir = wheelAccum > 0 ? 1 : -1;
          wheelAccum = 0;
          setTimeout(function(){ wheelLock = false; }, SNAP_DURATION + 80);
          var next = currentIndex + dir;
          if(next >= 0 && next < allVideos.length){
            snapTo(next, true);
          }
        }
      }, {passive: false});

      // ── Keyboard nav ──
      document.addEventListener('keydown', function(e){
        if(e.key === 'ArrowDown' || e.key === 'j'){
          if(currentIndex < allVideos.length - 1) snapTo(currentIndex + 1, true);
        } else if(e.key === 'ArrowUp' || e.key === 'k'){
          if(currentIndex > 0) snapTo(currentIndex - 1, true);
        } else if(e.key === 'm'){
          toggleMute();
        }
      });

      // ═══════════════════════════════════════════════════════════
      //  SNAP ENGINE
      // ═══════════════════════════════════════════════════════════

      function setTrackPosition(y){
        track.style.transform = 'translate3d(0,' + y + 'px,0)';
      }

      function snapTo(index, animate){
        var prevIndex = currentIndex;
        currentIndex  = index;
        trackOffset   = -(index * screenH);
        if(animate){
          track.classList.add('snapping');
          setTimeout(function(){ track.classList.remove('snapping'); }, SNAP_DURATION + 10);
        }
        setTrackPosition(trackOffset);
        reconcileWindow(index);
        if(prevIndex !== index){
          // ⑯ Audio crossfade
          crossfadeTransition(prevIndex, index);
          prefetchAhead(index);
          applySmartPreload(index);
          // ⑨ Check if we need to load more
          if(allVideos.length - index <= LOAD_MORE_AT && feedHasMore && !feedLoading){
            loadMoreFeed();
          }
          // ⑬ Sound hint
          if(!soundHintShown && isMuted && index === 1){
            soundHintShown = true;
            showSoundHint();
          }
        }
      }

      // ═══════════════════════════════════════════════════════════
      //  ⑯ CROSSFADE TRANSITION
      // ═══════════════════════════════════════════════════════════

      function crossfadeTransition(prevIndex, nextIndex){
        clearAllFades();

        // Pause previous with fade-out
        var prevReel = renderedReels[prevIndex];
        if(prevReel){
          var prevVid = prevReel.querySelector('video');
          if(prevVid){
            if(!isMuted && prevVid.volume > 0){
              fadeVolume(prevVid, prevVid.volume, 0, CROSSFADE_MS, function(){
                prevVid.pause();
                prevVid.currentTime = 0;
              });
            } else {
              prevVid.pause();
              prevVid.currentTime = 0;
            }
            var bar = prevReel.querySelector('.reel-progress-bar');
            if(bar) bar.style.width = '0%';
            var buf = prevReel.querySelector('.reel-progress-buffered');
            if(buf) buf.style.width = '0%';
          }
        }
        stopProgressLoop();

        // Play next with fade-in
        var nextReel = renderedReels[nextIndex];
        if(nextReel){
          var nextVid = nextReel.querySelector('video');
          if(nextVid){
            nextVid.muted = isMuted;
            if(!isMuted){
              nextVid.volume = 0;
              nextVid.play().catch(function(){});
              fadeVolume(nextVid, 0, 1, CROSSFADE_MS);
            } else {
              nextVid.play().catch(function(){});
            }
            startProgressLoop(nextReel, nextVid);
            capturePoster(nextVid, nextIndex);
            // ⑰ Remove canvas preview once video plays
            nextVid.addEventListener('playing', function onPlay(){
              nextVid.removeEventListener('playing', onPlay);
              nextVid.classList.add('has-frame');
              removeFramePreview(nextReel);
            }, {once: true});
          }
        }
      }

      // ═══════════════════════════════════════════════════════════
      //  VIRTUAL DOM WINDOW — ⑮ uses video pool
      // ═══════════════════════════════════════════════════════════

      function reconcileWindow(centerIndex){
        var minIdx = Math.max(0, centerIndex - RENDER_WINDOW);
        var maxIdx = Math.min(allVideos.length - 1, centerIndex + RENDER_WINDOW);

        // Remove elements outside window
        var keys = Object.keys(renderedReels);
        for(var k = 0; k < keys.length; k++){
          var idx = parseInt(keys[k]);
          if(idx < minIdx || idx > maxIdx){
            var el = renderedReels[idx];
            // ⑮ Release video back to pool instead of destroying
            releaseVideo(idx);
            track.removeChild(el);
            delete renderedReels[idx];
          }
        }

        // Add missing elements within window
        for(var i = minIdx; i <= maxIdx; i++){
          if(!renderedReels[i]){
            var reel = createReel(allVideos[i], i);
            track.appendChild(reel);
            renderedReels[i] = reel;
          }
        }
      }

      // ── Smart preloading — preload current + next 2 fully ──
      function applySmartPreload(centerIndex){
        var keys = Object.keys(renderedReels);
        for(var k = 0; k < keys.length; k++){
          var idx = parseInt(keys[k]);
          var el  = renderedReels[idx];
          var vid = el.querySelector('video');
          if(!vid) continue;
          // Preload current + next 2 videos fully, rest metadata only
          vid.preload = (idx >= centerIndex && idx <= centerIndex + 2) ? 'auto' : 'metadata';
        }
      }

      function upgradePreload(index){
        var el = renderedReels[index];
        if(!el) return;
        var vid = el.querySelector('video');
        if(!vid) return;
        vid.preload = 'auto';
        if(vid.readyState < 2) vid.load();
        // Also upgrade the one after
        var el2 = renderedReels[index + 1];
        if(el2){
          var vid2 = el2.querySelector('video');
          if(vid2){ vid2.preload = 'auto'; if(vid2.readyState < 2) vid2.load(); }
        }
      }

      // ═══════════════════════════════════════════════════════════
      //  VIDEO MANAGEMENT
      // ═══════════════════════════════════════════════════════════

      function playVideo(i){
        var reel = renderedReels[i];
        if(!reel) return;
        var vid = reel.querySelector('video');
        if(!vid) return;
        vid.muted = isMuted;
        vid.play().catch(function(){});
        startProgressLoop(reel, vid);
        capturePoster(vid, i);
      }

      function pauseVideo(i){
        var reel = renderedReels[i];
        if(!reel) return;
        var vid = reel.querySelector('video');
        if(!vid) return;
        vid.pause();
        vid.currentTime = 0;
        var bar = reel.querySelector('.reel-progress-bar');
        if(bar) bar.style.width = '0%';
        var buf = reel.querySelector('.reel-progress-buffered');
        if(buf) buf.style.width = '0%';
        stopProgressLoop();
      }

      // ── PERF FIX #5: Enhanced poster capture with localStorage persistence ──
      // TikTok pre-generates thumbnails server-side. We capture first frame client-side
      // and persist to localStorage so repeat visits show posters instantly.
      var POSTER_STORAGE_KEY = 'sg_reel_posters_v1';
      var POSTER_MAX_STORED = 30; // Keep last 30 poster frames in localStorage

      // Load persisted posters on startup
      (function loadPersistedPosters(){
        try {
          var stored = localStorage.getItem(POSTER_STORAGE_KEY);
          if(stored){
            var parsed = JSON.parse(stored);
            // parsed is { cdnKey: dataUrl, ... }
            window._persistedPosters = parsed;
          }
        } catch(e){}
        if(!window._persistedPosters) window._persistedPosters = {};
      })();

      function getPersistedPoster(video){
        var key = video.cdnKey || video.id || '';
        return key ? (window._persistedPosters[key] || null) : null;
      }

      function persistPoster(video, dataUrl){
        var key = video.cdnKey || video.id || '';
        if(!key || !dataUrl) return;
        try {
          window._persistedPosters[key] = dataUrl;
          // Trim to max entries
          var keys = Object.keys(window._persistedPosters);
          if(keys.length > POSTER_MAX_STORED){
            var toRemove = keys.slice(0, keys.length - POSTER_MAX_STORED);
            for(var i = 0; i < toRemove.length; i++) delete window._persistedPosters[toRemove[i]];
          }
          localStorage.setItem(POSTER_STORAGE_KEY, JSON.stringify(window._persistedPosters));
        } catch(e){} // localStorage full — no big deal
      }

      function capturePoster(vid, index){
        if(posterCache[index]) return;
        var doCapture = function(){
          try{
            if(vid.videoWidth === 0 || vid.videoHeight === 0) return;
            var canvas = document.createElement('canvas');
            // PERF FIX #5: Smaller poster = faster decode (180px wide is enough for blur-up)
            var scale = Math.min(180 / vid.videoWidth, 320 / vid.videoHeight, 1);
            canvas.width  = Math.round(vid.videoWidth * scale);
            canvas.height = Math.round(vid.videoHeight * scale);
            var ctx = canvas.getContext('2d');
            ctx.drawImage(vid, 0, 0, canvas.width, canvas.height);
            var dataUrl = canvas.toDataURL('image/webp', 0.5);
            if(dataUrl && dataUrl.length > 100){
              posterCache[index] = dataUrl;
              vid.poster = dataUrl;
              // Persist for next visit
              if(index < allVideos.length) persistPoster(allVideos[index], dataUrl);
            }
          } catch(e){}
        };
        if(vid.readyState >= 2){
          requestAnimationFrame(doCapture);
        } else {
          vid.addEventListener('loadeddata', function onLoad(){
            vid.removeEventListener('loadeddata', onLoad);
            requestAnimationFrame(doCapture);
          });
        }
      }

      // ── rAF progress ──
      function startProgressLoop(reel, vid){
        stopProgressLoop();
        var bar = reel.querySelector('.reel-progress-bar');
        var buf = reel.querySelector('.reel-progress-buffered');
        if(!bar) return;
        function tick(){
          if(vid.duration && !isNaN(vid.duration)){
            bar.style.width = (vid.currentTime / vid.duration * 100) + '%';
            if(buf && vid.buffered.length > 0){
              buf.style.width = (vid.buffered.end(vid.buffered.length - 1) / vid.duration * 100) + '%';
            }
          }
          progressRafId = requestAnimationFrame(tick);
        }
        progressRafId = requestAnimationFrame(tick);
      }

      function stopProgressLoop(){
        if(progressRafId){ cancelAnimationFrame(progressRafId); progressRafId = null; }
      }

      // ── Prefetch — use fetch() + Cache API for real pre-download ──
      // PERF FIX #1 + #3: Fixed cache name (was hardcoded to v4), removed mode:'cors'
      // that was breaking Cloudflare edge caching, added connection-aware prefetch depth
      function prefetchAhead(fromIndex){
        // PERF FIX #3: Adaptive prefetch depth based on connection speed
        var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        var prefetchCount = PREFETCH_AHEAD;
        if(conn){
          var ect = conn.effectiveType;
          if(ect === 'slow-2g' || ect === '2g') prefetchCount = 1;
          else if(ect === '3g') prefetchCount = 3;
        }

        var urls = [];
        for(var i = fromIndex + 1; i <= fromIndex + prefetchCount && i < allVideos.length; i++){
          var url = resolveVideoUrl(allVideos[i]);
          if(!url || prefetchedUrls[url]) continue;
          prefetchedUrls[url] = true;
          urls.push(url);
        }
        if(urls.length === 0) return;

        // PERF FIX #1: Removed mode:'cors' — R2 CDN doesn't send CORS headers,
        // so cors mode was causing EVERY prefetch to fail silently.
        // Without mode:'cors', the browser uses default mode which works fine.
        if(window.caches){
          caches.open('reels-v7-video').then(function(cache){
            urls.forEach(function(url, idx){
              setTimeout(function(){
                cache.match(url).then(function(existing){
                  if(!existing){
                    fetch(url, { credentials: 'omit' }).then(function(resp){
                      if(resp.ok) cache.put(url, resp);
                    }).catch(function(){});
                  }
                });
              }, idx < 2 ? 0 : idx * 400);
            });
          });
        }

        // Also tell service worker to cache these videos
        if(navigator.serviceWorker && navigator.serviceWorker.controller){
          navigator.serviceWorker.controller.postMessage({ type: 'PRECACHE_VIDEOS', urls: urls });
        }
      }

      // ═══════════════════════════════════════════════════════════
      //  PAGINATED FEED
      // ═══════════════════════════════════════════════════════════

      var feedSeed = null; // seeded shuffle for consistent pagination

      function loadFeed(){
        feedLoading = true;
        fetch('/api/reels/feed?limit=' + PAGE_SIZE + '&offset=0&shuffle=true')
          .then(function(r){
            if(!r.ok) throw new Error('Feed error');
            return r.json();
          })
          .then(function(data){
            allVideos = data.videos || [];
            feedOffset = allVideos.length;
            feedHasMore = data.hasMore;
            feedSeed = data.seed; // save seed for consistent pagination
            feedLoading = false;
            if(allVideos.length === 0){
              showFatalError('No reels available yet');
              return;
            }
            // ㉑ Decode blurhash for first few videos if available
            for(var i = 0; i < Math.min(allVideos.length, 5); i++){
              if(allVideos[i].blurhash && !posterCache[i]){
                var bh = decodeBlurHash(allVideos[i].blurhash, 4, 3);
                if(bh) posterCache[i] = bh;
              }
            }
            // PERF FIX #5: Load persisted poster frames for first batch
            for(var i = 0; i < Math.min(allVideos.length, 10); i++){
              if(!posterCache[i]){
                var pp = getPersistedPoster(allVideos[i]);
                if(pp) posterCache[i] = pp;
              }
            }
            reconcileWindow(0);
            loading.style.display = 'none';
            // PERF FIX #3: Start playback immediately (was 100ms delay)
            playVideo(0);
            // Defer prefetch to avoid competing with first video load
            setTimeout(function(){
              prefetchAhead(0);
              applySmartPreload(0);
            }, 500);
          })
          .catch(function(err){
            console.error('Feed load error:', err);
            feedLoading = false;
            showFatalError('Failed to load reels. Please try again.');
          });
      }

      function loadMoreFeed(){
        if(feedLoading || !feedHasMore) return;
        feedLoading = true;
        fetch('/api/reels/feed?limit=' + PAGE_SIZE + '&offset=' + feedOffset + '&shuffle=true' + (feedSeed ? '&seed=' + feedSeed : ''))
          .then(function(r){
            if(!r.ok) throw new Error('Feed error');
            return r.json();
          })
          .then(function(data){
            var newVideos = data.videos || [];
            allVideos = allVideos.concat(newVideos);
            feedOffset += newVideos.length;
            feedHasMore = data.hasMore;
            feedLoading = false;
            reconcileWindow(currentIndex);
          })
          .catch(function(err){
            console.error('Feed load more error:', err);
            feedLoading = false;
          });
      }

      // ═══════════════════════════════════════════════════════════
      //  REEL ELEMENT CREATION — ⑮ uses video pool
      // ═══════════════════════════════════════════════════════════

      function createReel(video, index){
        var div = document.createElement('div');
        div.className = 'reel';
        div.style.height = screenH + 'px';
        div.style.top = (index * screenH) + 'px';
        div.dataset.index = index;

        var videoUrl = resolveVideoUrl(video);

        // ⑮ Acquire video element from pool
        var vid = acquireVideo(index);
        vid.src = videoUrl;
        vid.muted = isMuted;

        // PERF FIX #3: Connection-aware preloading
        // On slow connections, only fully preload current video
        var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        var preloadWindow = 2; // default: preload current + next 2
        if(conn){
          var ect = conn.effectiveType;
          if(ect === 'slow-2g' || ect === '2g') preloadWindow = 0;
          else if(ect === '3g') preloadWindow = 1;
        }
        vid.preload = (index >= currentIndex && index <= currentIndex + preloadWindow) ? 'auto' : 'metadata';

        // PERF FIX #5: Poster priority: persisted frame > cached frame > blurhash > placeholder SVG
        // (thumb URLs from reels-videos.json are broken — point to non-existent paths)
        var persisted = getPersistedPoster(video);
        var poster = posterCache[index] || persisted || PLACEHOLDER_POSTER;
        if(!posterCache[index] && !persisted && video.blurhash){
          var bh = decodeBlurHash(video.blurhash, 4, 3);
          if(bh){ poster = bh; posterCache[index] = bh; }
        }
        if(persisted && !posterCache[index]) posterCache[index] = persisted;
        vid.poster = poster;
        vid.classList.remove('has-frame');
        div.appendChild(vid);

        // Detect horizontal (landscape) videos and apply letterboxing
        // Use server-side orientation field first, then fall back to hints/runtime
        if(video.orientation === 'horizontal'){
          div.classList.add('landscape');
        } else if(!video.orientation){
          var cdnKey = (video.cdnKey || video.url || '').toLowerCase();
          if(cdnKey.indexOf('horizontal') !== -1){
            div.classList.add('landscape');
          }
        }
        vid.addEventListener('loadedmetadata', function(){
          if(vid.videoWidth > vid.videoHeight * 1.2){
            div.classList.add('landscape');
          }
        });

        // Error handling — retry with CDN proxy before showing error
        // FIX: Added _retrying flag to prevent race condition where
        // removeAttribute('src')+load() fires a synchronous error event
        // that increments _retryCount before the actual retry URL is set.
        vid._retryCount = 0;
        vid._retrying = false;
        vid.addEventListener('error', function(){
          // Guard: ignore errors fired during source reset
          if(vid._retrying) return;
          var idx = parseInt(div.dataset.index);
          if(vid._retryCount === 0 && idx < allVideos.length){
            vid._retryCount++;
            vid._retrying = true;
            // First retry: try the CORS proxy instead of direct CDN
            var proxyUrl = resolveVideoProxyUrl(allVideos[idx]);
            setTimeout(function(){
              vid.removeAttribute('src');
              vid.src = proxyUrl;
              vid._retrying = false;
              vid.load();
            }, 100);
            return;
          }
          if(vid._retryCount === 1){
            vid._retryCount++;
            vid._retrying = true;
            // Second retry: cache-bust the original URL
            var origUrl = resolveVideoUrl(allVideos[idx]);
            setTimeout(function(){
              vid.removeAttribute('src');
              vid.src = origUrl + (origUrl.indexOf('?') === -1 ? '?' : '&') + '_r=' + Date.now();
              vid._retrying = false;
              vid.load();
            }, 200);
            return;
          }
          if(div.querySelector('.reel-error')) return;
          var errDiv = document.createElement('div');
          errDiv.className = 'reel-error';
          errDiv.innerHTML = '<span>\uD83C\uDFAC</span><p>Video unavailable</p>';
          div.appendChild(errDiv);
          setTimeout(function(){
            if(parseInt(div.dataset.index) === currentIndex && currentIndex < allVideos.length - 1){
              snapTo(currentIndex + 1, true);
            }
          }, 1500);
        });

        // Buffering spinner — show when video is waiting for data
        var bufSpinner = document.createElement('div');
        bufSpinner.className = 'reel-buffering';
        bufSpinner.innerHTML = '<div class="spinner"></div>';
        bufSpinner.style.display = 'none';
        div.appendChild(bufSpinner);

        vid.addEventListener('waiting', function(){ bufSpinner.style.display = 'flex'; });
        vid.addEventListener('canplay', function(){ bufSpinner.style.display = 'none'; });
        vid.addEventListener('playing', function(){ bufSpinner.style.display = 'none'; });

        // Progress bar
        var progressWrap = document.createElement('div');
        progressWrap.className = 'reel-progress';
        var progressBuf = document.createElement('div');
        progressBuf.className = 'reel-progress-buffered';
        var progressBar = document.createElement('div');
        progressBar.className = 'reel-progress-bar';
        progressWrap.appendChild(progressBuf);
        progressWrap.appendChild(progressBar);
        div.appendChild(progressWrap);

        // Creator info
        var hasCreator = video.creator && (video.creator.name || video.creator.handle);
        var hasAffiliate = video.creator && video.creator.affiliateLink;

        var info = document.createElement('div');
        info.className = 'reel-info';

        var creatorHtml = '';
        if(hasCreator){
          creatorHtml = '<p class="reel-creator">\uD83C\uDFA5 ' + escHtml(video.creator.name || video.creator.handle || 'Creator') + '</p>';
        }

        var affiliateHtml = '';
        if(hasAffiliate){
          affiliateHtml = '<a class="creator-cta" href="' + escHtml(video.creator.affiliateLink) + '">'
            + '<span class="creator-cta-icon">\uD83D\uDCB0</span>'
            + '<div><div class="creator-cta-text">Book via ' + escHtml(video.creator.name || video.creator.handle || 'Creator') + ' \u2014 \u00A35</div>'
            + '<div class="creator-cta-sub">Creator earns on your booking</div></div></a>';
        } else if(hasCreator){
          affiliateHtml = '<a class="creator-cta" href="/">'
            + '<span class="creator-cta-icon">\uD83D\uDCAA</span>'
            + '<div><div class="creator-cta-text">Book a Gym \u2014 \u00A35</div>'
            + '<div class="creator-cta-sub">No membership needed</div></div></a>';
        }

        info.innerHTML = '<p class="reel-title">' + escHtml(humanizeTitle(video.name)) + '</p>'
          + '<p class="reel-category">\uD83C\uDFAC ' + escHtml(humanizeCategory(video.category)) + '</p>'
          + creatorHtml + affiliateHtml;
        div.appendChild(info);

        // Action sidebar
        var actions = document.createElement('div');
        actions.className = 'reel-actions';
        var bookHref = hasAffiliate ? escHtml(video.creator.affiliateLink) : '/explore';

        actions.innerHTML = ''
          + '<a class="reel-action" data-action="book" href="' + bookHref + '">'
          +   '<div class="icon">' + ICONS.book + '</div><span class="label">Book</span></a>'
          + '<div class="reel-action" data-action="share">'
          +   '<div class="icon">' + ICONS.share + '</div><span class="label">Share</span></div>'
          + '<div class="reel-action" data-action="save">'
          +   '<div class="icon">' + ICONS.save + '</div><span class="label">Save</span></div>'
          + '<a class="reel-action" data-action="create" href="/upload">'
          +   '<div class="icon" style="background:rgba(34,197,94,.85);border-color:rgba(34,197,94,.9)">' + ICONS.create + '</div><span class="label">Create</span></a>'
          + '<div class="reel-action" data-action="more">'
          +   '<div class="icon">' + ICONS.more + '</div><span class="label">More</span></div>';
        div.appendChild(actions);

        // Double-tap like
        var lastTapTime = 0;
        div.addEventListener('click', function(e){
          if(e.target.closest('.reel-actions') || e.target.closest('.reel-info') || e.target.closest('.creator-cta')) return;
          if(Math.abs(dragDelta) > 10) return;
          var now = Date.now();
          if(now - lastTapTime < 300){
            doubleTapLike(e.clientX, e.clientY);
            lastTapTime = 0;
          } else {
            lastTapTime = now;
            setTimeout(function(){
              if(lastTapTime !== 0 && Date.now() - lastTapTime >= 280){
                toggleMute();
                lastTapTime = 0;
              }
            }, 300);
          }
        });

        // Action handlers
        actions.querySelectorAll('.reel-action').forEach(function(btn){
          btn.addEventListener('click', function(e){
            var action = btn.dataset.action;
            if(action === 'book') return;   // <a> navigates to /explore
            if(action === 'create') return; // <a> navigates to /upload
            e.preventDefault();
            e.stopPropagation();
            if(action === 'share') handleShare(video);
            else if(action === 'save') handleSave(video, videoUrl);
            else if(action === 'more') window.location.href = '/more';
          });
        });

        return div;
      }

      // ═══════════════════════════════════════════════════════════
      //  ENGAGEMENT
      // ═══════════════════════════════════════════════════════════

      function doubleTapLike(x, y){
        if(navigator.vibrate) navigator.vibrate([10, 30, 10]);
        var heart = document.createElement('div');
        heart.className = 'like-burst';
        heart.textContent = '\u2764\uFE0F';
        heart.style.left = x + 'px';
        heart.style.top = y + 'px';
        document.body.appendChild(heart);
        setTimeout(function(){ heart.remove(); }, 900);

        var emojis = ['\u2764\uFE0F', '\uD83E\uDDE1', '\uD83D\uDC9B', '\uD83D\uDCAA', '\uD83D\uDD25'];
        for(var i = 0; i < 6; i++){
          var p = document.createElement('div');
          p.className = 'like-particle';
          p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
          p.style.left = x + 'px';
          p.style.top = y + 'px';
          var angle = (Math.PI * 2 / 6) * i + (Math.random() - 0.5) * 0.5;
          var dist = 60 + Math.random() * 40;
          p.style.setProperty('--tx', Math.round(Math.cos(angle) * dist) + 'px');
          p.style.setProperty('--ty', Math.round(Math.sin(angle) * dist) + 'px');
          p.style.setProperty('--rot', Math.round(Math.random() * 360) + 'deg');
          p.style.animationDelay = (i * 0.04) + 's';
          document.body.appendChild(p);
          setTimeout(function(el){ el.remove(); }, 1100, p);
        }
        showToast('\u2764\uFE0F Liked!');
      }

      function handleShare(video){
        if(navigator.vibrate) navigator.vibrate(10);
        var url = (video.creator && video.creator.affiliateLink) || 'https://scangym.com/reels';
        var displayName = humanizeTitle(video.name);
        var text = (displayName || 'ScanGym Reels') + ' \u2014 Book a gym for \u00A35! \uD83D\uDCAA';
        if(video.creator && video.creator.name){
          text = (displayName || 'ScanGym Reels') + ' by ' + video.creator.name + ' \u2014 Book for \u00A35! \uD83D\uDCAA';
        }
        if(navigator.share){
          navigator.share({title:'ScanGym Reels',text:text,url:url}).catch(function(){});
        } else {
          navigator.clipboard.writeText(text + '\n' + url).then(function(){ showToast('\uD83D\uDD17 Link copied!'); });
        }
      }

      function handleSave(video, url){
        if(navigator.vibrate) navigator.vibrate(10);
        if(url){
          var a = document.createElement('a');
          a.href = url;
          a.download = (video.name || 'scangym-reel').replace(/[^a-zA-Z0-9_-]/g, '_') + '.mp4';
          a.target = '_blank';
          document.body.appendChild(a);
          a.click();
          a.remove();
          showToast('\u2B07\uFE0F Downloading...');
        }
      }

      function showSoundHint(){
        var el = document.getElementById('sound-hint');
        if(!el) return;
        el.classList.add('show');
        setTimeout(function(){
          el.classList.remove('show');
          setTimeout(function(){ el.style.display = 'none'; }, 400);
        }, 4000);
      }

      // ═══════════════════════════════════════════════════════════
      //  HELPERS
      // ═══════════════════════════════════════════════════════════

      function toggleMute(){
        isMuted = !isMuted;
        var vids = document.querySelectorAll('.reel video');
        for(var i = 0; i < vids.length; i++){
          vids[i].muted = isMuted;
          if(!isMuted) vids[i].volume = 1;
        }
        showMuteIndicator(isMuted);
        if(!isMuted){
          var sh = document.getElementById('sound-hint');
          if(sh){ sh.classList.remove('show'); sh.style.display = 'none'; }
        }
      }

      function showMuteIndicator(muted){
        var el = document.getElementById('mute-indicator');
        el.textContent = muted ? '\uD83D\uDD07' : '\uD83D\uDD0A';
        el.classList.add('show');
        setTimeout(function(){ el.classList.remove('show'); }, 600);
      }

      function escHtml(s){
        if(!s) return '';
        return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      }

      // Humanize raw filenames into display titles
      // "03_workout_montage_horizontal" → "Workout Montage"
      // "10 Mubarak Pvc Sp100 S50 Sb75 V3 Processed" → "Mubarak"
      function humanizeTitle(name){
        if(!name) return 'ScanGym Reels';
        var s = name;
        // Strip file extensions
        s = s.replace(/\.(mp4|webm|mov)$/i, '');
        // Replace underscores with spaces
        s = s.replace(/_/g, ' ');
        // Remove leading numbers/indices (e.g. "03 ", "01 ")
        s = s.replace(/^\d{1,3}\s+/, '');
        // Strip internal source prefixes (Yt, YT, IG, FB, CMO, Auto-Reel, etc.)
        s = s.replace(/^(TikTok-Reels?\s*AI|Auto-Reel|YouTube\s*AI|AI\s*Cinematic|CMO|Yt|YT|IG|FB)\s*[-:]?\s*/i, '');
        // Remove "No Membership" scraping artifact
        s = s.replace(/\bNo\s+Membership\b/gi, '').trim();
        // Remove orientation tags
        s = s.replace(/\b(horizontal|vertical)\b/gi, '');
        // Remove technical suffixes (v1, v2, processed, sp100, s50, sb75, etc.)
        s = s.replace(/\b(v\d+|processed|sp\d+|s\d+|sb\d+|pvc)\b/gi, '');
        // Clean up extra whitespace
        s = s.replace(/\s{2,}/g, ' ').trim();
        // Title case if all lowercase
        if(s === s.toLowerCase()){
          s = s.replace(/\b\w/g, function(c){ return c.toUpperCase(); });
        }
        return s || 'Gym Workout';
      }

      function humanizeCategory(cat){
        if(!cat) return 'Fitness';
        var s = cat;
        // Strip internal prefixes: "TikTok-Reels AI", "CMO", "Yt", etc.
        s = s.replace(/^(TikTok-Reels?\s*AI|CMO|Yt|YT|IG|FB)\s*[-:]?\s*/i, '');
        // Strip "No Membership" suffix if it's a prefix artifact
        s = s.replace(/\bNo\s+Membership\b/gi, '').trim();
        // Map known internal categories to clean display names
        var categoryMap = {
          'viral': 'Viral',
          'motivation': 'Motivation',
          'transformation': 'Transformation',
          'tutorial': 'Tutorial',
          'gym tour': 'Gym Tour',
          'workout': 'Workout',
          'tips': 'Tips',
          'challenge': 'Challenge',
          'auto-reel': 'Workout',
          'ai cinematic': 'Cinematic',
          'youtube ai': 'Fitness',
          'general': 'General',
          'content': 'Fitness'
        };
        var lower = s.toLowerCase().trim();
        if(categoryMap[lower]) return categoryMap[lower];
        // Clean up and title case
        s = s.replace(/\s{2,}/g, ' ').trim();
        if(!s) return 'Fitness';
        if(s === s.toLowerCase()){
          s = s.replace(/\b\w/g, function(c){ return c.toUpperCase(); });
        }
        return s;
      }

      function showToast(msg){
        var t = document.createElement('div');
        t.className = 'toast';
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(function(){ t.remove(); }, 2000);
      }

      function showFatalError(msg){
        loading.innerHTML = '<div class="spinner"></div>'
          + '<p style="color:#fff;font-size:18px;font-weight:700;position:static;transform:none;margin-top:16px">' + msg + '</p>'
          + '<button onclick="location.reload()" style="margin-top:16px;background:#f97316;color:#fff;border:none;padding:12px 28px;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer">Retry</button>';
      }

      // ═══════════════════════════════════════════════════════════
      //  ⑲ SERVICE WORKER REGISTRATION
      // ═══════════════════════════════════════════════════════════

      function registerServiceWorker(){
        if(!('serviceWorker' in navigator)) return;
        navigator.serviceWorker.register('/reels/sw.js', { scope: '/reels/' })
          .then(function(reg){
            console.log('[Reels] Service worker registered:', reg.scope);
          })
          .catch(function(err){
            console.warn('[Reels] SW registration failed:', err);
          });
      }

      // ── Init ──
      initVideoPool();
      registerServiceWorker();
      loadFeed();
    })();
    </script>
