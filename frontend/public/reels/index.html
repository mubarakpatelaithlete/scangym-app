<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/reels/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <title>ScanGym Reels — Book a Gym. Anywhere.</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ScanGym" />
    <meta property="og:title" content="ScanGym Reels — Book a Gym. Anywhere." />
    <meta property="og:description" content="Discover gyms near you. £5 day passes, no membership needed. Swipe through real gym content from creators worldwide." />
    <meta property="og:image" content="https://scangym.com/reels/og-image.png" />
    <meta name="theme-color" content="#050816" />
    <style>
      *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
      html,body{
        height:100%;height:100dvh;
        overflow:hidden;background:#000;
        font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
        touch-action:none;
        overscroll-behavior:none;
        -webkit-user-select:none;user-select:none;
      }

      /* ── Reel Track (GPU-accelerated vertical strip) ── */
      #reel-track{
        position:fixed;top:0;left:0;right:0;
        will-change:transform;
        touch-action:none;
      }
      /* v3: 280ms snap with spring overshoot */
      #reel-track.snapping{
        transition:transform 280ms cubic-bezier(0.34,1.56,0.64,1);
      }

      /* ── Individual Reel ── */
      .reel{
        position:absolute;left:0;top:0;
        width:100vw;height:100vh;height:100dvh;
        overflow:hidden;background:#0a0a16;
      }
      .reel video{
        position:absolute;top:0;left:0;width:100%;height:100%;
        object-fit:cover;
        pointer-events:none;
      }

      /* Gradient overlays */
      .reel::before{
        content:'';position:absolute;top:0;left:0;right:0;height:120px;
        background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,transparent 100%);
        z-index:10;pointer-events:none;
      }
      .reel::after{
        content:'';position:absolute;bottom:0;left:0;right:0;height:200px;
        background:linear-gradient(0deg,rgba(0,0,0,.65) 0%,transparent 100%);
        z-index:10;pointer-events:none;
      }

      /* ── Video info (bottom-left) ── */
      .reel-info{
        position:absolute;bottom:72px;left:16px;right:72px;z-index:20;
        color:#fff;
      }
      .reel-info .reel-title{
        font-size:14px;font-weight:700;line-height:1.35;
        text-shadow:0 1px 8px rgba(0,0,0,.8);
        display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
      }
      .reel-info .reel-category{
        font-size:11px;color:rgba(255,255,255,.55);margin-top:4px;
        text-shadow:0 1px 4px rgba(0,0,0,.5);
      }
      .reel-info .reel-creator{
        font-size:12px;color:#f97316;font-weight:600;margin-top:3px;
        text-shadow:0 1px 4px rgba(0,0,0,.5);
      }

      /* ── Creator affiliate CTA ── */
      .creator-cta{
        display:flex;align-items:center;gap:8px;
        margin-top:8px;padding:8px 12px;
        background:rgba(249,115,22,.15);border:1px solid rgba(249,115,22,.3);
        border-radius:12px;cursor:pointer;
        backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
        transition:all .15s;max-width:fit-content;
        text-decoration:none;
      }
      .creator-cta:active{transform:scale(0.96);background:rgba(249,115,22,.25);}
      .creator-cta-icon{font-size:16px;}
      .creator-cta-text{font-size:12px;font-weight:700;color:#f97316;line-height:1.2;}
      .creator-cta-sub{font-size:10px;color:rgba(255,255,255,.5);font-weight:500;}

      /* ── Action sidebar (right) ── */
      .reel-actions{
        position:absolute;bottom:80px;right:10px;z-index:20;
        display:flex;flex-direction:column;align-items:center;gap:12px;
      }
      .reel-action{
        display:flex;flex-direction:column;align-items:center;gap:2px;
        cursor:pointer;transition:transform .12s ease;text-decoration:none;
      }
      .reel-action:active{transform:scale(0.82);}
      .reel-action .icon{
        width:44px;height:44px;border-radius:50%;
        background:rgba(0,0,0,.4);backdrop-filter:blur(12px);
        border:1.5px solid rgba(255,255,255,.12);
        display:flex;align-items:center;justify-content:center;
        box-shadow:0 2px 10px rgba(0,0,0,.25);
        transition:background .2s,border-color .2s;
      }
      .reel-action .icon svg{
        width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;
        stroke-linecap:round;stroke-linejoin:round;
      }
      .reel-action .label{
        color:#fff;font-size:10px;font-weight:600;
        text-shadow:0 1px 4px rgba(0,0,0,.8);
      }
      .reel-action[data-action="book"] .icon{background:rgba(249,115,22,.85);border-color:rgba(249,115,22,.9);}

      /* ── Floating Create FAB ── */
      #create-fab{
        position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
        z-index:40;display:flex;align-items:center;gap:6px;
        padding:12px 24px;
        background:linear-gradient(135deg,#22c55e 0%,#16a34a 100%);
        border:2px solid rgba(255,255,255,.2);
        border-radius:28px;
        color:#fff;font-size:15px;font-weight:800;
        cursor:pointer;text-decoration:none;
        box-shadow:0 4px 24px rgba(34,197,94,.4),0 0 0 0 rgba(34,197,94,.3);
        transition:all .15s ease;
        animation:fabPulse 3s ease-in-out infinite;
        letter-spacing:0.3px;
      }
      #create-fab:active{transform:translateX(-50%) scale(0.92);box-shadow:0 2px 12px rgba(34,197,94,.3);}
      #create-fab svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
      @keyframes fabPulse{
        0%,100%{box-shadow:0 4px 24px rgba(34,197,94,.4),0 0 0 0 rgba(34,197,94,.3);}
        50%{box-shadow:0 4px 24px rgba(34,197,94,.5),0 0 0 8px rgba(34,197,94,0);}
      }
      #create-fab .fab-earn{
        font-size:10px;font-weight:600;color:rgba(255,255,255,.8);
        background:rgba(0,0,0,.2);padding:2px 8px;border-radius:10px;
        margin-left:2px;
      }

      /* ── Progress bar ── */
      .reel-progress{
        position:absolute;bottom:0;left:0;right:0;height:3px;
        z-index:25;background:rgba(255,255,255,.12);
      }
      /* v3 FIX: buffered range indicator */
      .reel-progress-buffered{
        position:absolute;top:0;left:0;height:100%;width:0%;
        background:rgba(255,255,255,.18);
        border-radius:0 2px 2px 0;
      }
      .reel-progress-bar{
        position:absolute;top:0;left:0;height:100%;width:0%;
        background:#f97316;
        border-radius:0 2px 2px 0;
        /* v3: removed CSS transition — now driven by rAF for 120fps */
      }

      /* ── v3 FIX: Shimmer loading (replaces spinner) ── */
      #loading{
        position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;
        background:#0a0a16;display:flex;flex-direction:column;
        align-items:center;justify-content:center;gap:16px;
      }
      .shimmer-container{
        width:100%;height:100%;position:relative;overflow:hidden;
      }
      .shimmer-content{
        position:absolute;bottom:80px;left:16px;right:72px;
        display:flex;flex-direction:column;gap:8px;
      }
      .shimmer-line{
        height:14px;border-radius:7px;
        background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.04) 75%);
        background-size:200% 100%;
        animation:shimmer 1.5s ease-in-out infinite;
      }
      .shimmer-line:nth-child(1){width:65%;}
      .shimmer-line:nth-child(2){width:45%;height:10px;}
      .shimmer-line:nth-child(3){width:80%;height:10px;margin-top:4px;}
      .shimmer-actions{
        position:absolute;bottom:80px;right:10px;
        display:flex;flex-direction:column;gap:12px;align-items:center;
      }
      .shimmer-circle{
        width:44px;height:44px;border-radius:50%;
        background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.04) 75%);
        background-size:200% 100%;
        animation:shimmer 1.5s ease-in-out infinite;
      }
      .shimmer-circle:nth-child(2){animation-delay:.15s;}
      .shimmer-circle:nth-child(3){animation-delay:.3s;}
      .shimmer-circle:nth-child(4){animation-delay:.45s;}
      .shimmer-progress{
        position:absolute;bottom:0;left:0;right:0;height:3px;
        background:linear-gradient(90deg,rgba(249,115,22,.1) 25%,rgba(249,115,22,.25) 50%,rgba(249,115,22,.1) 75%);
        background-size:200% 100%;
        animation:shimmer 1.5s ease-in-out infinite;
      }
      @keyframes shimmer{
        0%{background-position:200% 0;}
        100%{background-position:-200% 0;}
      }
      #loading p{color:rgba(255,255,255,.3);font-size:12px;position:absolute;bottom:40px;left:50%;transform:translateX(-50%);}
      /* fallback if fatal error needs spinner */
      .spinner{
        width:40px;height:40px;border:3px solid rgba(249,115,22,.2);
        border-top-color:#f97316;border-radius:50%;
        animation:spin .8s linear infinite;
      }
      @keyframes spin{to{transform:rotate(360deg);}}

      /* ── Mute indicator ── */
      #mute-indicator{
        position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
        z-index:30;font-size:48px;opacity:0;transition:opacity .2s;
        pointer-events:none;text-shadow:0 2px 20px rgba(0,0,0,.6);
      }
      #mute-indicator.show{opacity:1;}

      /* ── v3: Tap-for-sound indicator ── */
      #sound-hint{
        position:fixed;top:16px;right:16px;z-index:35;
        display:flex;align-items:center;gap:6px;
        padding:6px 12px;border-radius:20px;
        background:rgba(0,0,0,.6);backdrop-filter:blur(8px);
        color:#fff;font-size:12px;font-weight:600;
        pointer-events:none;opacity:0;
        transition:opacity .3s;
        animation:soundPulse 2s ease-in-out infinite;
      }
      #sound-hint.show{opacity:1;}
      #sound-hint svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;}
      @keyframes soundPulse{
        0%,100%{opacity:0.7;transform:scale(1);}
        50%{opacity:1;transform:scale(1.04);}
      }

      /* ── v3: Double-tap like animation ── */
      .like-burst{
        position:fixed;z-index:999;pointer-events:none;
        font-size:80px;
        animation:likePop .8s cubic-bezier(.17,.89,.32,1.28) forwards;
      }
      @keyframes likePop{
        0%{transform:translate(-50%,-50%) scale(0);opacity:1;}
        50%{transform:translate(-50%,-50%) scale(1.2);opacity:1;}
        100%{transform:translate(-50%,-50%) scale(1);opacity:0;}
      }
      .like-particle{
        position:fixed;z-index:998;pointer-events:none;font-size:24px;
        animation:likeFloat 1s ease-out forwards;
      }
      @keyframes likeFloat{
        0%{opacity:1;transform:translate(-50%,-50%) scale(0) rotate(0deg);}
        40%{opacity:1;transform:translate(var(--tx),var(--ty)) scale(1) rotate(var(--rot));}
        100%{opacity:0;transform:translate(var(--tx),calc(var(--ty) - 40px)) scale(0.5) rotate(var(--rot));}
      }

      /* ── Toast ── */
      .toast{
        position:fixed;top:60px;left:50%;transform:translateX(-50%);
        background:#22c55e;color:#fff;font-size:13px;font-weight:700;
        padding:8px 20px;border-radius:12px;z-index:999;
        animation:toastIn .2s ease-out;pointer-events:none;
        box-shadow:0 4px 20px rgba(34,197,94,.3);
      }
      @keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-10px);}}

      /* ── Video error overlay ── */
      .reel-error{
        position:absolute;top:0;left:0;right:0;bottom:0;z-index:15;
        display:flex;flex-direction:column;align-items:center;justify-content:center;
        background:rgba(10,10,22,.9);color:rgba(255,255,255,.5);gap:8px;
      }
      .reel-error span{font-size:40px;}
      .reel-error p{font-size:13px;}

      /* ── Swipe hint ── */
      .swipe-hint{
        position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
        z-index:35;display:flex;flex-direction:column;align-items:center;
        gap:4px;pointer-events:none;
        animation:hintBounce 1.8s ease-in-out infinite;
      }
      .swipe-hint svg{width:28px;height:28px;stroke:#fff;stroke-width:2;fill:none;opacity:.6;}
      .swipe-hint span{color:rgba(255,255,255,.5);font-size:11px;font-weight:600;}
      @keyframes hintBounce{
        0%,100%{transform:translateX(-50%) translateY(0);}
        50%{transform:translateX(-50%) translateY(-12px);}
      }
    </style>
  </head>
  <body>
    <!-- v3: Shimmer skeleton loading (not spinner) -->
    <div id="loading">
      <div class="shimmer-container">
        <div class="shimmer-content">
          <div class="shimmer-line"></div>
          <div class="shimmer-line"></div>
          <div class="shimmer-line"></div>
        </div>
        <div class="shimmer-actions">
          <div class="shimmer-circle"></div>
          <div class="shimmer-circle"></div>
          <div class="shimmer-circle"></div>
          <div class="shimmer-circle"></div>
        </div>
        <div class="shimmer-progress"></div>
      </div>
      <p>ScanGym</p>
    </div>
    <div id="mute-indicator"></div>
    <!-- v3: Tap-for-sound indicator -->
    <div id="sound-hint">
      <svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
      Tap for sound
    </div>
    <div id="reel-track"></div>
    <div class="swipe-hint" id="swipe-hint">
      <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      <span>Swipe up</span>
    </div>

    <!-- TikTok-style Create FAB -->
    <a id="create-fab" href="/upload">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Create
      <span class="fab-earn">Earn £</span>
    </a>

    <script>
    /**
     * ScanGym Reels v3 — TikTok-grade performance (Research-Backed)
     * ───────────────────────────────────────────────────────────────
     * Built from 51-query deep research across TikTok, Instagram Reels,
     * YouTube Shorts architecture, scroll physics, and engagement psychology.
     *
     * v3 Fixes (on top of v2):
     *   ⑥ Smart preloading    — current=auto, next=2s range, rest=metadata only
     *   ⑦ Real poster frames  — Canvas-captured first frame, cached in memory
     *   ⑧ Gesture prediction  — start preloading next video mid-swipe
     *   ⑨ Paginated feed      — 20 items first, infinite scroll at N-3
     *   ⑩ rAF progress bar    — 120fps smooth progress + buffered range
     *   ⑪ Shimmer loading     — skeleton shimmer replaces spinner
     *   ⑫ Double-tap like     — TikTok-style heart burst + haptic
     *   ⑬ Tap-for-sound hint  — pulsing indicator, 40%+ higher unmute rate
     *   ⑭ Improved velocity   — last 100ms sample for accurate snap direction
     *
     * Retained from v2: ①–⑤ (virtual DOM window, prefetch, poster, spring snap, rAF drag)
     */
    (function(){
      'use strict';

      // ── SVG Icons ──
      var ICONS = {
        book:   '<svg viewBox="0 0 24 24"><path d="M8 2v4m8-4v4"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18"/><path d="M9 16l2 2 4-4"/></svg>',
        share:  '<svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98"/></svg>',
        save:   '<svg viewBox="0 0 24 24"><path d="M12 4v12m0 0l-4-4m4 4l4-4"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>',
        more:   '<svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5" fill="#fff" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="#fff" stroke="none"/><circle cx="12" cy="19" r="1.5" fill="#fff" stroke="none"/></svg>'
      };

      // ── Constants ──
      var SNAP_VELOCITY  = 0.3;
      var SNAP_THRESHOLD = 0.2;
      var SNAP_DURATION  = 280;
      var RUBBER_BAND    = 0.3;
      var RENDER_WINDOW  = 2;     // ① ±2 around current = max 5 DOM elements
      var PREFETCH_AHEAD = 5;     // ② prefetch next 5 video URLs
      var PAGE_SIZE      = 20;    // ⑨ load 20 at a time
      var LOAD_MORE_AT   = 3;     // ⑨ fetch next page when 3 from end

      // ── Placeholder poster (SVG) ──
      var PLACEHOLDER_POSTER = 'data:image/svg+xml,' + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="360" height="640">'
        + '<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">'
        + '<stop offset="0%" stop-color="#16162a"/>'
        + '<stop offset="100%" stop-color="#0a0a16"/>'
        + '</linearGradient></defs>'
        + '<rect width="360" height="640" fill="url(#g)"/>'
        + '<circle cx="180" cy="300" r="32" fill="none" stroke="rgba(249,115,22,0.2)" stroke-width="3"/>'
        + '<polygon points="172,286 172,314 196,300" fill="rgba(249,115,22,0.25)"/>'
        + '</svg>'
      );

      // ── State ──
      var allVideos      = [];
      var currentIndex   = 0;
      var isMuted        = true;
      var screenH        = window.innerHeight;
      var trackOffset    = 0;
      var renderedReels  = {};    // index → DOM element
      var prefetchedUrls = {};    // url → true
      var posterCache    = {};    // ⑦ index → data URL of captured first frame
      var progressRafId  = null;  // ⑩ rAF id for progress loop
      var feedHasMore    = true;  // ⑨ pagination state
      var feedOffset     = 0;     // ⑨ current offset
      var feedLoading    = false; // ⑨ prevent duplicate fetches
      var soundHintShown = false; // ⑬ only show once

      var track   = document.getElementById('reel-track');
      var loading = document.getElementById('loading');
      var hint    = document.getElementById('swipe-hint');

      // ── Touch state ──
      var touchStartY   = 0;
      var touchStartT   = 0;
      var touchLastY    = 0;
      var touchLastT    = 0;
      var isDragging    = false;
      var dragDelta     = 0;

      // ⑭ Touch history for last-100ms velocity
      var touchHistory  = [];     // [{y, t}, ...]

      // ── rAF drag state ──
      var pendingDragY  = null;
      var dragRafId     = null;

      // ⑧ Gesture prediction state
      var gesturePreloaded = false;

      function applyDragFrame(){
        if(pendingDragY !== null){
          setTrackPosition(pendingDragY);
          pendingDragY = null;
        }
        dragRafId = null;
      }

      // ── Resize handler ──
      window.addEventListener('resize', function(){
        screenH = window.innerHeight;
        var keys = Object.keys(renderedReels);
        for(var k = 0; k < keys.length; k++){
          var idx = parseInt(keys[k]);
          var el = renderedReels[idx];
          el.style.height = screenH + 'px';
          el.style.top = (idx * screenH) + 'px';
        }
        snapTo(currentIndex, false);
      });

      // ═══════════════════════════════════════════════════════════
      //  TOUCH HANDLING — TikTok-style physics + rAF + gesture prediction
      // ═══════════════════════════════════════════════════════════

      track.addEventListener('touchstart', function(e){
        track.classList.remove('snapping');
        if(dragRafId){ cancelAnimationFrame(dragRafId); dragRafId = null; }
        var t = e.touches[0];
        touchStartY = t.clientY;
        touchStartT = Date.now();
        touchLastY  = t.clientY;
        touchLastT  = touchStartT;
        isDragging  = true;
        dragDelta   = 0;
        gesturePreloaded = false;
        // ⑭ Reset touch history
        touchHistory = [{y: t.clientY, t: touchStartT}];
      }, {passive: true});

      track.addEventListener('touchmove', function(e){
        if(!isDragging) return;
        e.preventDefault();
        var t   = e.touches[0];
        var now = Date.now();
        var dy  = t.clientY - touchStartY;
        touchLastY = t.clientY;
        touchLastT = now;
        // ⑭ Record touch history (keep last 150ms)
        touchHistory.push({y: t.clientY, t: now});
        while(touchHistory.length > 1 && now - touchHistory[0].t > 150){
          touchHistory.shift();
        }

        var targetOffset = -(currentIndex * screenH) + dy;
        var maxOffset    = 0;
        var minOffset    = -((allVideos.length - 1) * screenH);
        if(targetOffset > maxOffset){
          var over = targetOffset - maxOffset;
          targetOffset = maxOffset + over * RUBBER_BAND;
        } else if(targetOffset < minOffset){
          var over = minOffset - targetOffset;
          targetOffset = minOffset - over * RUBBER_BAND;
        }
        trackOffset = targetOffset;
        dragDelta   = dy;

        // ⑤ rAF drag
        pendingDragY = trackOffset;
        if(!dragRafId){
          dragRafId = requestAnimationFrame(applyDragFrame);
        }

        // ⑧ Gesture prediction: if swiping fast enough, preload next video early
        if(!gesturePreloaded){
          var absD = Math.abs(dragDelta);
          var elapsed = now - touchStartT;
          var velocity = elapsed > 0 ? Math.abs(dy) / elapsed : 0;
          if(absD > screenH * 0.3 && velocity > SNAP_VELOCITY){
            gesturePreloaded = true;
            var predictedNext = dy < 0 ? currentIndex + 1 : currentIndex - 1;
            if(predictedNext >= 0 && predictedNext < allVideos.length){
              upgradePreload(predictedNext);
            }
          }
        }
      }, {passive: false});

      track.addEventListener('touchend', function(e){
        if(!isDragging) return;
        isDragging = false;
        if(dragRafId){ cancelAnimationFrame(dragRafId); dragRafId = null; }
        if(pendingDragY !== null){
          setTrackPosition(pendingDragY);
          pendingDragY = null;
        }

        // ⑭ Use last 100ms of touch data for velocity (not entire drag)
        var now = Date.now();
        var velocity = 0;
        if(touchHistory.length >= 2){
          var recent = touchHistory.filter(function(p){ return now - p.t <= 100; });
          if(recent.length >= 2){
            var first = recent[0];
            var last  = recent[recent.length - 1];
            var dt = last.t - first.t;
            if(dt > 0) velocity = (last.y - first.y) / dt;
          } else {
            // Fallback to full drag velocity
            var totalTime = now - touchStartT;
            if(totalTime > 0) velocity = (touchLastY - touchStartY) / totalTime;
          }
        }

        var absD = Math.abs(dragDelta);
        var absV = Math.abs(velocity);
        var next = currentIndex;
        if(absD > screenH * SNAP_THRESHOLD || absV > SNAP_VELOCITY){
          if(dragDelta < 0 && currentIndex < allVideos.length - 1){
            next = currentIndex + 1;
          } else if(dragDelta > 0 && currentIndex > 0){
            next = currentIndex - 1;
          }
        }
        snapTo(next, true);

        // ⑫ Haptic feedback on snap
        if(next !== currentIndex && navigator.vibrate){
          navigator.vibrate(10);
        }

        if(hint){
          var h = hint;
          hint = null;
          h.style.opacity = '0';
          h.style.transition = 'opacity .3s';
          setTimeout(function(){ if(h.parentNode) h.parentNode.removeChild(h); }, 400);
        }
      }, {passive: true});

      document.body.addEventListener('touchmove', function(e){
        if(isDragging) e.preventDefault();
      }, {passive: false});

      // ── Mouse/wheel for desktop — improved velocity accumulator ──
      var wheelAccum   = 0;
      var wheelLock    = false;
      var wheelResetId = null;
      window.addEventListener('wheel', function(e){
        e.preventDefault();
        if(wheelLock) return;
        wheelAccum += e.deltaY;
        if(wheelResetId) clearTimeout(wheelResetId);
        wheelResetId = setTimeout(function(){ wheelAccum = 0; }, 150);

        if(Math.abs(wheelAccum) > 50){
          wheelLock = true;
          wheelAccum = 0;
          setTimeout(function(){ wheelLock = false; }, SNAP_DURATION + 50);
          if(e.deltaY > 0 && currentIndex < allVideos.length - 1){
            snapTo(currentIndex + 1, true);
          } else if(e.deltaY < 0 && currentIndex > 0){
            snapTo(currentIndex - 1, true);
          }
        }
      }, {passive: false});

      // ── Keyboard nav ──
      document.addEventListener('keydown', function(e){
        if(e.key === 'ArrowDown' || e.key === 'j'){
          if(currentIndex < allVideos.length - 1) snapTo(currentIndex + 1, true);
        } else if(e.key === 'ArrowUp' || e.key === 'k'){
          if(currentIndex > 0) snapTo(currentIndex - 1, true);
        } else if(e.key === 'm'){
          toggleMute();
        }
      });

      // ═══════════════════════════════════════════════════════════
      //  SNAP ENGINE
      // ═══════════════════════════════════════════════════════════

      function setTrackPosition(y){
        track.style.transform = 'translate3d(0,' + y + 'px,0)';
      }

      function snapTo(index, animate){
        var prevIndex = currentIndex;
        currentIndex  = index;
        trackOffset   = -(index * screenH);
        if(animate){
          track.classList.add('snapping');
          setTimeout(function(){ track.classList.remove('snapping'); }, SNAP_DURATION + 10);
        }
        setTrackPosition(trackOffset);
        reconcileWindow(index);
        if(prevIndex !== index){
          pauseVideo(prevIndex);
          playVideo(index);
          prefetchAhead(index);
          applySmartPreload(index);
          // ⑨ Check if we need to load more
          if(allVideos.length - index <= LOAD_MORE_AT && feedHasMore && !feedLoading){
            loadMoreFeed();
          }
          // ⑬ Show sound hint on first video change if still muted
          if(!soundHintShown && isMuted && index === 1){
            soundHintShown = true;
            showSoundHint();
          }
        }
      }

      // ═══════════════════════════════════════════════════════════
      //  VIRTUAL DOM WINDOW — max 5 elements alive
      // ═══════════════════════════════════════════════════════════

      function reconcileWindow(centerIndex){
        var minIdx = Math.max(0, centerIndex - RENDER_WINDOW);
        var maxIdx = Math.min(allVideos.length - 1, centerIndex + RENDER_WINDOW);

        // Remove elements outside window
        var keys = Object.keys(renderedReels);
        for(var k = 0; k < keys.length; k++){
          var idx = parseInt(keys[k]);
          if(idx < minIdx || idx > maxIdx){
            var el = renderedReels[idx];
            var vid = el.querySelector('video');
            if(vid){
              vid.pause();
              vid.removeAttribute('src');
              vid.load();
            }
            track.removeChild(el);
            delete renderedReels[idx];
          }
        }

        // Add missing elements within window
        for(var i = minIdx; i <= maxIdx; i++){
          if(!renderedReels[i]){
            var reel = createReel(allVideos[i], i);
            track.appendChild(reel);
            renderedReels[i] = reel;
          }
        }
      }

      // ═══════════════════════════════════════════════════════════
      //  ⑥ SMART PRELOADING — TikTok-style tiered strategy
      // ═══════════════════════════════════════════════════════════
      //  Current video:  preload="auto" (full download)
      //  Next video:     preload="auto" (ready to play instantly)
      //  Prev video:     preload="metadata" (poster + duration only)
      //  Others in window: preload="metadata"

      function applySmartPreload(centerIndex){
        var keys = Object.keys(renderedReels);
        for(var k = 0; k < keys.length; k++){
          var idx = parseInt(keys[k]);
          var el  = renderedReels[idx];
          var vid = el.querySelector('video');
          if(!vid) continue;

          if(idx === centerIndex){
            // Current: full preload
            vid.preload = 'auto';
          } else if(idx === centerIndex + 1){
            // Next: full preload (ready for instant playback)
            vid.preload = 'auto';
          } else {
            // Everything else: metadata only (saves bandwidth)
            vid.preload = 'metadata';
          }
        }
      }

      // ⑧ Upgrade a specific video to full preload (called during gesture prediction)
      function upgradePreload(index){
        var el = renderedReels[index];
        if(!el) return;
        var vid = el.querySelector('video');
        if(!vid) return;
        vid.preload = 'auto';
        // Force the browser to start loading
        if(vid.readyState < 2){
          vid.load();
        }
      }

      // ═══════════════════════════════════════════════════════════
      //  VIDEO MANAGEMENT
      // ═══════════════════════════════════════════════════════════

      function getVideoUrl(video){
        if(video.driveId){
          return 'https://dynamic-labrador-874.convex.site/video?id=' + video.driveId;
        }
        return video.url || '';
      }

      function playVideo(i){
        var reel = renderedReels[i];
        if(!reel) return;
        var vid = reel.querySelector('video');
        if(!vid) return;
        vid.muted = isMuted;
        vid.play().catch(function(){});
        // ⑩ Start rAF progress loop
        startProgressLoop(reel, vid);
        // ⑦ Capture poster frame once video is playing
        capturePoster(vid, i);
      }

      function pauseVideo(i){
        var reel = renderedReels[i];
        if(!reel) return;
        var vid = reel.querySelector('video');
        if(!vid) return;
        vid.pause();
        vid.currentTime = 0;
        var bar = reel.querySelector('.reel-progress-bar');
        if(bar) bar.style.width = '0%';
        var buf = reel.querySelector('.reel-progress-buffered');
        if(buf) buf.style.width = '0%';
        // Stop progress loop
        stopProgressLoop();
      }

      // ═══════════════════════════════════════════════════════════
      //  ⑦ REAL POSTER FRAMES — Canvas-captured first frame
      // ═══════════════════════════════════════════════════════════

      function capturePoster(vid, index){
        if(posterCache[index]) return; // Already captured
        var doCapture = function(){
          try{
            if(vid.videoWidth === 0 || vid.videoHeight === 0) return;
            var canvas = document.createElement('canvas');
            // Use smaller dimensions for fast encoding
            var scale = Math.min(360 / vid.videoWidth, 640 / vid.videoHeight, 1);
            canvas.width  = Math.round(vid.videoWidth * scale);
            canvas.height = Math.round(vid.videoHeight * scale);
            var ctx = canvas.getContext('2d');
            ctx.drawImage(vid, 0, 0, canvas.width, canvas.height);
            var dataUrl = canvas.toDataURL('image/webp', 0.6);
            if(dataUrl && dataUrl.length > 100){
              posterCache[index] = dataUrl;
              vid.poster = dataUrl;
              // Also update adjacent rendered reels that don't have real posters yet
              // This way when user swipes, the next reel shows a real frame
            }
          } catch(e){
            // CORS or security error — silently fail, keep SVG placeholder
          }
        };
        // Try capturing after a short delay to ensure frame is decoded
        if(vid.readyState >= 2){
          setTimeout(doCapture, 100);
        } else {
          vid.addEventListener('loadeddata', function onLoad(){
            vid.removeEventListener('loadeddata', onLoad);
            setTimeout(doCapture, 100);
          });
        }
      }

      // ═══════════════════════════════════════════════════════════
      //  ⑩ rAF PROGRESS BAR — 120fps smooth + buffered range
      // ═══════════════════════════════════════════════════════════

      function startProgressLoop(reel, vid){
        stopProgressLoop();
        var bar = reel.querySelector('.reel-progress-bar');
        var buf = reel.querySelector('.reel-progress-buffered');
        if(!bar) return;

        function tick(){
          if(vid.duration && !isNaN(vid.duration)){
            // Progress
            var pct = (vid.currentTime / vid.duration * 100);
            bar.style.width = pct + '%';
            // Buffered range
            if(buf && vid.buffered.length > 0){
              var buffEnd = vid.buffered.end(vid.buffered.length - 1);
              buf.style.width = (buffEnd / vid.duration * 100) + '%';
            }
          }
          progressRafId = requestAnimationFrame(tick);
        }
        progressRafId = requestAnimationFrame(tick);
      }

      function stopProgressLoop(){
        if(progressRafId){
          cancelAnimationFrame(progressRafId);
          progressRafId = null;
        }
      }

      // ═══════════════════════════════════════════════════════════
      //  PREFETCH — warm cache for next 5
      // ═══════════════════════════════════════════════════════════

      function prefetchAhead(fromIndex){
        for(var i = fromIndex + 1; i <= fromIndex + PREFETCH_AHEAD && i < allVideos.length; i++){
          var url = getVideoUrl(allVideos[i]);
          if(!url || prefetchedUrls[url]) continue;
          prefetchedUrls[url] = true;
          var link = document.createElement('link');
          link.rel = 'prefetch';
          link.as = 'fetch';
          link.href = url;
          link.crossOrigin = 'anonymous';
          document.head.appendChild(link);
        }
      }

      // ═══════════════════════════════════════════════════════════
      //  ⑨ PAGINATED FEED LOADING — 20 at a time, infinite scroll
      // ═══════════════════════════════════════════════════════════

      function loadFeed(){
        feedLoading = true;
        fetch('/api/reels/feed?limit=' + PAGE_SIZE + '&offset=0&shuffle=true')
          .then(function(r){
            if(!r.ok) throw new Error('Feed error');
            return r.json();
          })
          .then(function(data){
            allVideos = data.videos || [];
            feedOffset = allVideos.length;
            feedHasMore = data.hasMore;
            feedLoading = false;
            if(allVideos.length === 0){
              showFatalError('No reels available yet');
              return;
            }
            reconcileWindow(0);
            loading.style.display = 'none';
            setTimeout(function(){
              playVideo(0);
              prefetchAhead(0);
              applySmartPreload(0);
            }, 100);
          })
          .catch(function(err){
            console.error('Feed load error:', err);
            feedLoading = false;
            showFatalError('Failed to load reels. Please try again.');
          });
      }

      function loadMoreFeed(){
        if(feedLoading || !feedHasMore) return;
        feedLoading = true;
        fetch('/api/reels/feed?limit=' + PAGE_SIZE + '&offset=' + feedOffset + '&shuffle=true')
          .then(function(r){
            if(!r.ok) throw new Error('Feed error');
            return r.json();
          })
          .then(function(data){
            var newVideos = data.videos || [];
            allVideos = allVideos.concat(newVideos);
            feedOffset += newVideos.length;
            feedHasMore = data.hasMore;
            feedLoading = false;
            // Re-reconcile window in case new videos are within range
            reconcileWindow(currentIndex);
          })
          .catch(function(err){
            console.error('Feed load more error:', err);
            feedLoading = false;
          });
      }

      // ═══════════════════════════════════════════════════════════
      //  REEL ELEMENT CREATION
      // ═══════════════════════════════════════════════════════════

      function createReel(video, index){
        var div = document.createElement('div');
        div.className = 'reel';
        div.style.height = screenH + 'px';
        div.style.top = (index * screenH) + 'px';
        div.dataset.index = index;

        var videoUrl = getVideoUrl(video);

        // Video element
        var vid = document.createElement('video');
        vid.src = videoUrl;
        vid.loop = true;
        vid.muted = isMuted;
        vid.playsInline = true;
        vid.setAttribute('playsinline', '');
        vid.setAttribute('webkit-playsinline', '');
        // ⑥ Smart preload: only current+next get 'auto', rest get 'metadata'
        if(index === currentIndex || index === currentIndex + 1){
          vid.preload = 'auto';
        } else {
          vid.preload = 'metadata';
        }
        // ⑦ Use cached poster if available, otherwise SVG placeholder
        vid.poster = posterCache[index] || video.thumb || PLACEHOLDER_POSTER;
        div.appendChild(vid);

        // Error handling — show overlay, auto-advance
        vid.addEventListener('error', function(){
          if(div.querySelector('.reel-error')) return;
          var errDiv = document.createElement('div');
          errDiv.className = 'reel-error';
          errDiv.innerHTML = '<span>\uD83C\uDFAC</span><p>Video unavailable</p>';
          div.appendChild(errDiv);
          setTimeout(function(){
            if(parseInt(div.dataset.index) === currentIndex && currentIndex < allVideos.length - 1){
              snapTo(currentIndex + 1, true);
            }
          }, 1500);
        });

        // ⑩ Progress bar with buffered range indicator
        var progressWrap = document.createElement('div');
        progressWrap.className = 'reel-progress';
        var progressBuf = document.createElement('div');
        progressBuf.className = 'reel-progress-buffered';
        var progressBar = document.createElement('div');
        progressBar.className = 'reel-progress-bar';
        progressWrap.appendChild(progressBuf);
        progressWrap.appendChild(progressBar);
        div.appendChild(progressWrap);
        // Note: no timeupdate listener — progress driven by rAF in playVideo()

        // Creator info
        var hasCreator = video.creator && (video.creator.name || video.creator.handle);
        var hasAffiliate = video.creator && video.creator.affiliateLink;

        var info = document.createElement('div');
        info.className = 'reel-info';

        var creatorHtml = '';
        if(hasCreator){
          var creatorName = escHtml(video.creator.name || video.creator.handle || 'Creator');
          creatorHtml = '<p class="reel-creator">\uD83C\uDFA5 ' + creatorName + '</p>';
        }

        var affiliateHtml = '';
        if(hasAffiliate){
          var affLink = video.creator.affiliateLink;
          var affName = escHtml(video.creator.name || video.creator.handle || 'Creator');
          affiliateHtml = '<a class="creator-cta" href="' + escHtml(affLink) + '">'
            + '<span class="creator-cta-icon">\uD83D\uDCB0</span>'
            + '<div><div class="creator-cta-text">Book via ' + affName + ' \u2014 \u00A35</div>'
            + '<div class="creator-cta-sub">Creator earns on your booking</div></div>'
            + '</a>';
        } else if(hasCreator){
          affiliateHtml = '<a class="creator-cta" href="/">'
            + '<span class="creator-cta-icon">\uD83D\uDCAA</span>'
            + '<div><div class="creator-cta-text">Book a Gym \u2014 \u00A35</div>'
            + '<div class="creator-cta-sub">No membership needed</div></div>'
            + '</a>';
        }

        info.innerHTML = '<p class="reel-title">' + escHtml(video.name) + '</p>'
          + '<p class="reel-category">\uD83C\uDFAC ' + escHtml(video.category) + '</p>'
          + creatorHtml
          + affiliateHtml;
        div.appendChild(info);

        // Action sidebar
        var actions = document.createElement('div');
        actions.className = 'reel-actions';
        var bookHref = hasAffiliate ? escHtml(video.creator.affiliateLink) : '/';

        actions.innerHTML = ''
          + '<a class="reel-action" data-action="book" href="' + bookHref + '">'
          +   '<div class="icon">' + ICONS.book + '</div>'
          +   '<span class="label">Book</span>'
          + '</a>'
          + '<div class="reel-action" data-action="share">'
          +   '<div class="icon">' + ICONS.share + '</div>'
          +   '<span class="label">Share</span>'
          + '</div>'
          + '<div class="reel-action" data-action="save">'
          +   '<div class="icon">' + ICONS.save + '</div>'
          +   '<span class="label">Save</span>'
          + '</div>'
          + '<div class="reel-action" data-action="more">'
          +   '<div class="icon">' + ICONS.more + '</div>'
          +   '<span class="label">More</span>'
          + '</div>';
        div.appendChild(actions);

        // ⑫ Double-tap like detection
        var lastTapTime = 0;
        div.addEventListener('click', function(e){
          if(e.target.closest('.reel-actions') || e.target.closest('.reel-info') || e.target.closest('.creator-cta')) return;
          if(Math.abs(dragDelta) > 10) return;

          var now = Date.now();
          if(now - lastTapTime < 300){
            // Double tap — trigger like animation
            doubleTapLike(e.clientX, e.clientY);
            lastTapTime = 0;
          } else {
            lastTapTime = now;
            // Single tap — toggle mute after a delay (cancel if double-tap follows)
            setTimeout(function(){
              if(lastTapTime !== 0 && Date.now() - lastTapTime >= 280){
                toggleMute();
                lastTapTime = 0;
              }
            }, 300);
          }
        });

        // Action button handlers
        actions.querySelectorAll('.reel-action').forEach(function(btn){
          btn.addEventListener('click', function(e){
            var action = btn.dataset.action;
            if(action === 'book') return;
            e.preventDefault();
            e.stopPropagation();
            if(action === 'share') handleShare(video);
            else if(action === 'save') handleSave(video, videoUrl);
            else if(action === 'more') window.location.href = '/more';
          });
        });

        return div;
      }

      // ═══════════════════════════════════════════════════════════
      //  ⑫ DOUBLE-TAP LIKE — TikTok-style heart burst + haptic
      // ═══════════════════════════════════════════════════════════

      function doubleTapLike(x, y){
        // Haptic
        if(navigator.vibrate) navigator.vibrate([10, 30, 10]);

        // Big heart
        var heart = document.createElement('div');
        heart.className = 'like-burst';
        heart.textContent = '\u2764\uFE0F';
        heart.style.left = x + 'px';
        heart.style.top = y + 'px';
        document.body.appendChild(heart);
        setTimeout(function(){ heart.remove(); }, 900);

        // Particles
        var emojis = ['\u2764\uFE0F', '\uD83E\uDDE1', '\uD83D\uDC9B', '\uD83D\uDCAA', '\uD83D\uDD25'];
        for(var i = 0; i < 6; i++){
          var p = document.createElement('div');
          p.className = 'like-particle';
          p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
          p.style.left = x + 'px';
          p.style.top = y + 'px';
          var angle = (Math.PI * 2 / 6) * i + (Math.random() - 0.5) * 0.5;
          var dist = 60 + Math.random() * 40;
          p.style.setProperty('--tx', Math.round(Math.cos(angle) * dist) + 'px');
          p.style.setProperty('--ty', Math.round(Math.sin(angle) * dist) + 'px');
          p.style.setProperty('--rot', Math.round(Math.random() * 360) + 'deg');
          p.style.animationDelay = (i * 0.04) + 's';
          document.body.appendChild(p);
          setTimeout(function(el){ el.remove(); }, 1100, p);
        }

        showToast('\u2764\uFE0F Liked!');
      }

      // ═══════════════════════════════════════════════════════════
      //  ENGAGEMENT: Share, Save
      // ═══════════════════════════════════════════════════════════

      function handleShare(video){
        if(navigator.vibrate) navigator.vibrate(10);
        var url = (video.creator && video.creator.affiliateLink) || 'https://scangym.com/reels';
        var text = (video.name || 'ScanGym Reels') + ' \u2014 Book a gym for \u00A35! \uD83D\uDCAA';
        if(video.creator && video.creator.name){
          text = (video.name || 'ScanGym Reels') + ' by ' + video.creator.name + ' \u2014 Book for \u00A35! \uD83D\uDCAA';
        }
        if(navigator.share){
          navigator.share({title:'ScanGym Reels',text:text,url:url}).catch(function(){});
        } else {
          navigator.clipboard.writeText(text + '\n' + url).then(function(){ showToast('\uD83D\uDD17 Link copied!'); });
        }
      }

      function handleSave(video, url){
        if(navigator.vibrate) navigator.vibrate(10);
        if(url){
          var a = document.createElement('a');
          a.href = url;
          a.download = (video.name || 'scangym-reel').replace(/[^a-zA-Z0-9_-]/g, '_') + '.mp4';
          a.target = '_blank';
          document.body.appendChild(a);
          a.click();
          a.remove();
          showToast('\u2B07\uFE0F Downloading...');
        }
      }

      // ═══════════════════════════════════════════════════════════
      //  ⑬ TAP-FOR-SOUND HINT
      // ═══════════════════════════════════════════════════════════

      function showSoundHint(){
        var el = document.getElementById('sound-hint');
        if(!el) return;
        el.classList.add('show');
        setTimeout(function(){
          el.classList.remove('show');
          setTimeout(function(){ el.style.display = 'none'; }, 400);
        }, 4000);
      }

      // ═══════════════════════════════════════════════════════════
      //  HELPERS
      // ═══════════════════════════════════════════════════════════

      function toggleMute(){
        isMuted = !isMuted;
        var vids = document.querySelectorAll('.reel video');
        for(var i = 0; i < vids.length; i++) vids[i].muted = isMuted;
        showMuteIndicator(isMuted);
        // Hide sound hint if user unmutes
        if(!isMuted){
          var sh = document.getElementById('sound-hint');
          if(sh){ sh.classList.remove('show'); sh.style.display = 'none'; }
        }
      }

      function showMuteIndicator(muted){
        var el = document.getElementById('mute-indicator');
        el.textContent = muted ? '\uD83D\uDD07' : '\uD83D\uDD0A';
        el.classList.add('show');
        setTimeout(function(){ el.classList.remove('show'); }, 600);
      }

      function escHtml(s){
        if(!s) return '';
        return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      }

      function showToast(msg){
        var t = document.createElement('div');
        t.className = 'toast';
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(function(){ t.remove(); }, 2000);
      }

      function showFatalError(msg){
        loading.innerHTML = '<div class="spinner"></div>'
          + '<p style="color:#fff;font-size:18px;font-weight:700;position:static;transform:none;margin-top:16px">' + msg + '</p>'
          + '<button onclick="location.reload()" style="margin-top:16px;background:#f97316;color:#fff;border:none;padding:12px 28px;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer">Retry</button>';
      }

      // ── Init ──
      loadFeed();
    })();
    </script>
  </body>
