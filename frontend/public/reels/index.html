      function escHtml(s){
        if(!s) return '';
        return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      }

      // Humanize raw filenames into display titles
      // "03_workout_montage_horizontal" → "Workout Montage"
      // "10 Mubarak Pvc Sp100 S50 Sb75 V3 Processed" → "Mubarak"
      function humanizeTitle(name){
        if(!name) return 'ScanGym Reels';
        // UX fix: some uploads carry raw machine names (pure hex hashes like
        // "02152304fbea…", "1.mp4_30b9911b…"). Never show those to users.
        var probe = String(name).replace(/\.(mp4|webm|mov)$/i,'').replace(/[\s_.-]/g,'');
        if(/^\d{1,4}$/.test(probe) || (probe.length >= 12 && /^[0-9a-f]+$/i.test(probe)) || /[0-9a-f]{16,}/i.test(probe)){
          return 'ScanGym Reels';
        }
        var s = name;
        // Strip file extensions
        s = s.replace(/\.(mp4|webm|mov)$/i, '');
        // Replace underscores with spaces
        s = s.replace(/_/g, ' ');
        // Remove leading numbers/indices (e.g. "03 ", "01 ")
        s = s.replace(/^\d{1,3}\s+/, '');
        // Strip internal source prefixes
        s = s.replace(/^(TikTok-Reels?\s*AI|Auto-Reel|YouTube\s*AI|AI\s*Cinematic|CMO|Yt|YT|IG|FB)\s*[-:]?\s*/i, '');
        // Remove "No Membership" scraping artifact
        s = s.replace(/\bNo\s+Membership\b/gi, '').trim();
        // Remove orientation tags
        s = s.replace(/\b(horizontal|vertical)\b/gi, '');
        // Remove CMO-style version prefixes (V14, V32, V44, V52, V56, etc.)
        s = s.replace(/\bV\d{1,3}\b\s*/g, '');
        // Remove ScanGym- prefix from internal naming
        s = s.replace(/^ScanGym[-\s]*/i, '');
        // Remove technical suffixes (v1, v2, processed, sp100, s50, sb75, etc.)
        s = s.replace(/\b(v\d+|processed|sp\d+|s\d+|sb\d+|pvc)\b/gi, '');
        // Insert spaces before capitals in CamelCase (JogToGym → Jog To Gym)
        s = s.replace(/([a-z])([A-Z])/g, '$1 $2');
        // Clean up extra whitespace and dashes
        s = s.replace(/[-]{2,}/g, ' ').replace(/\s{2,}/g, ' ').trim();
        // Title case if all lowercase
        if(s === s.toLowerCase()){
          s = s.replace(/\b\w/g, function(c){ return c.toUpperCase(); });
        }
        return s || 'Gym Workout';
      }

      function humanizeCategory(cat){
        if(!cat) return 'Fitness';
        var s = cat;
        // Strip internal prefixes: "TikTok-Reels AI", "CMO", "Yt", etc.
        s = s.replace(/^(TikTok-Reels?\s*AI|CMO|Yt|YT|IG|FB)\s*[-:]?\s*/i, '');
        // Strip "No Membership" suffix if it's a prefix artifact
        s = s.replace(/\bNo\s+Membership\b/gi, '').trim();
        // Map known internal categories to clean display names
        var categoryMap = {
          'viral': 'Viral',
          'motivation': 'Motivation',
          'transformation': 'Transformation',
          'tutorial': 'Tutorial',
          'gym tour': 'Gym Tour',
          'workout': 'Workout',
          'tips': 'Tips',
          'challenge': 'Challenge',
          'ai cinematic': 'Cinematic',
          'youtube ai': 'Fitness',
          'general': 'General',
          'content': 'Fitness',
          'ugc videos': 'Community',
          'ugc': 'Community'
        };
        var lower = s.toLowerCase().trim();
        if(categoryMap[lower]) return categoryMap[lower];
        // Clean up and title case
        s = s.replace(/\s{2,}/g, ' ').trim();
        if(!s) return 'Fitness';
        if(s === s.toLowerCase()){
          s = s.replace(/\b\w/g, function(c){ return c.toUpperCase(); });
        }
        return s;
      }

      function showToast(msg){
        var t = document.createElement('div');
        t.className = 'toast';
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(function(){ t.remove(); }, 2000);
      }

      function showFatalError(msg){
        loading.innerHTML = '<div class="spinner"></div>'
          + '<p style="color:#fff;font-size:18px;font-weight:700;position:static;transform:none;margin-top:16px">' + msg + '</p>'
          + '<button onclick="location.reload()" style="margin-top:16px;background:#FF6D00;color:#fff;border:none;padding:12px 28px;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer">Retry</button>';
      }

      // ═══════════════════════════════════════════════════════════
      //  ⑲ SERVICE WORKER REGISTRATION
      // ═══════════════════════════════════════════════════════════

      function registerServiceWorker(){
        if(!('serviceWorker' in navigator)) return;
        navigator.serviceWorker.register('/reels/sw.js', { scope: '/reels/' })
          .then(function(reg){
            console.log('[Reels] Service worker registered:', reg.scope);
          })
          .catch(function(err){
            console.warn('[Reels] SW registration failed:', err);
          });
      }

      updateReelCounter();
      // ── Auto-dismiss swipe hint after 3 seconds ──
      setTimeout(function(){
        if(hint){
          hint.style.opacity = '0';
          hint.style.transition = 'opacity .5s';
          setTimeout(function(){ if(hint && hint.parentNode) hint.parentNode.removeChild(hint); hint = null; }, 600);
        }
      }, 3000);

      // ── Init ──
      initVideoPool();
      registerServiceWorker();
      loadFeed();

      // ═══ #6: Camera filters + #7: AI enhance + #5: moderation ═══
      // Create reel button — removed, moved to Profile tab

      // Camera overlay with filter picker
      window._sgCameraFilters = [
        {id:'none',name:'Normal',css:'none'},
        {id:'scangym-brand',name:'ScanGym',css:'brightness(1.1) saturate(1.2)'},
        {id:'gym-glow',name:'Glow',css:'contrast(1.15) saturate(1.3) brightness(1.05)'},
        {id:'bw-pump',name:'B&W',css:'grayscale(1) contrast(1.4)'},
        {id:'warm-flex',name:'Warm',css:'sepia(0.3) saturate(1.4) brightness(1.05)'},
        {id:'neon-night',name:'Neon',css:'hue-rotate(30deg) saturate(1.5) contrast(1.1)'},
        {id:'cold-steel',name:'Steel',css:'saturate(0.7) brightness(1.1) contrast(1.2) hue-rotate(-10deg)'}
      ];
      window._sgSelectedFilter = 'none';

      window._sgOpenCamera = function(){
        var ov = document.createElement('div');
        ov.id = 'sg-camera-overlay';
        ov.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#000;display:flex;flex-direction:column';
        ov.innerHTML = '<div style="flex:1;position:relative">'
          + '<video id="sg-camera-preview" autoplay muted playsinline style="width:100%;height:100%;object-fit:cover"></video>'
          + '<div id="sg-camera-filter-strip" style="position:absolute;bottom:80px;left:0;right:0;display:flex;gap:10px;padding:0 16px;overflow-x:auto;scrollbar-width:none"></div>'
          + '<div style="position:absolute;top:16px;left:16px;z-index:2"><button onclick="window._sgCloseCamera()" style="background:rgba(0,0,0,.5);border:none;color:#fff;width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer">\u2715</button></div>'
          + '<div style="position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:24px;align-items:center">'
          + '<button id="sg-camera-record" style="width:64px;height:64px;border-radius:50%;background:#FF6D00;border:4px solid #fff;cursor:pointer" onclick="window._sgToggleRecord()"></button>'
          + '</div>'
          + '<div style="position:absolute;top:16px;right:16px;display:flex;gap:8px">'
          + '<button onclick="window._sgFlipCamera()" style="background:rgba(0,0,0,.5);border:none;color:#fff;width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer">\u{1F504}</button>'
          + '<button onclick="window._sgAIEnhance()" style="background:rgba(0,0,0,.5);border:none;color:#fff;width:40px;height:40px;border-radius:50%;font-size:14px;cursor:pointer;font-weight:700">AI</button>'
          + '</div>'
          + '</div>';
        document.body.appendChild(ov);
        // Populate filter strip
        var strip = document.getElementById('sg-camera-filter-strip');
        window._sgCameraFilters.forEach(function(f){
          var chip = document.createElement('button');
          chip.style.cssText = 'flex-shrink:0;padding:8px 16px;border-radius:20px;border:2px solid rgba(255,255,255,.2);background:rgba(0,0,0,.4);color:#fff;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .2s';
          chip.textContent = f.name;
          chip.onclick = function(){
            window._sgSelectedFilter = f.css;
            var vid = document.getElementById('sg-camera-preview');
            if(vid) vid.style.filter = f.css === 'none' ? '' : f.css;
            strip.querySelectorAll('button').forEach(function(b){b.style.borderColor='rgba(255,255,255,.2)';b.style.background='rgba(0,0,0,.4)';});
            chip.style.borderColor='#FF6D00';chip.style.background='rgba(255,109,0,.3)';
          };
          strip.appendChild(chip);
        });
        // Start camera
        window._sgStartCamera();
      };

      window._sgCameraStream = null;
      window._sgCameraFacing = 'user';
      window._sgStartCamera = function(){
        navigator.mediaDevices.getUserMedia({video:{facingMode:window._sgCameraFacing},audio:true})
          .then(function(stream){
            window._sgCameraStream = stream;
            var vid = document.getElementById('sg-camera-preview');
            if(vid){vid.srcObject = stream;}
          })
          .catch(function(){ alert('Camera access required to create Reels'); });
      };
      window._sgFlipCamera = function(){
        window._sgCameraFacing = window._sgCameraFacing === 'user' ? 'environment' : 'user';
        if(window._sgCameraStream){window._sgCameraStream.getTracks().forEach(function(t){t.stop();});}
        window._sgStartCamera();
      };
      window._sgCloseCamera = function(){
        if(window._sgCameraStream){window._sgCameraStream.getTracks().forEach(function(t){t.stop();});}
        var ov = document.getElementById('sg-camera-overlay');
        if(ov) ov.remove();
      };
      window._sgRecording = false;
      window._sgMediaRecorder = null;
      window._sgRecordedChunks = [];
      window._sgToggleRecord = function(){
        var btn = document.getElementById('sg-camera-record');
        if(!window._sgRecording){
          window._sgRecordedChunks = [];
          var mr = new MediaRecorder(window._sgCameraStream, {mimeType:'video/webm;codecs=vp9'});
          mr.ondataavailable = function(e){if(e.data.size>0)window._sgRecordedChunks.push(e.data);};
          mr.onstop = function(){
            var blob = new Blob(window._sgRecordedChunks, {type:'video/webm'});
            window._sgPostRecord(blob);
          };
          mr.start(100);
          window._sgMediaRecorder = mr;
          window._sgRecording = true;
          if(btn){btn.style.background='#ef4444';btn.style.borderRadius='12px';}
        } else {
          window._sgMediaRecorder.stop();
          window._sgRecording = false;
          if(btn){btn.style.background='#FF6D00';btn.style.borderRadius='50%';}
        }
      };
      // After recording: run #5 moderation + optional #7 AI enhance
      window._sgPostRecord = async function(blob){
        // Show preview
        var url = URL.createObjectURL(blob);
        var ov = document.getElementById('sg-camera-overlay');
        if(ov) ov.innerHTML = '<div style="position:relative;width:100%;height:100%">'
          + '<video src="' + url + '" autoplay loop muted playsinline style="width:100%;height:100%;object-fit:cover;filter:' + (window._sgSelectedFilter !== 'none' ? window._sgSelectedFilter : '') + '"></video>'
          + '<div style="position:absolute;bottom:0;left:0;right:0;padding:20px;background:linear-gradient(transparent,rgba(0,0,0,.8))">'
          + '<textarea id="sg-reel-caption" placeholder="Add a caption..." style="width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:12px;color:#fff;font-size:14px;resize:none;height:60px;outline:none;box-sizing:border-box;margin-bottom:12px"></textarea>'
          + '<div style="display:flex;gap:12px"><button onclick="window._sgCloseCamera()" style="flex:1;padding:14px;border-radius:12px;background:rgba(255,255,255,.1);border:none;color:#fff;font-size:15px;font-weight:600;cursor:pointer">Discard</button>'
          + '<button onclick="window._sgUploadReel()" style="flex:1;padding:14px;border-radius:12px;background:#FF6D00;border:none;color:#fff;font-size:15px;font-weight:700;cursor:pointer">Post Reel</button></div></div></div>';
        window._sgReelBlob = blob;
      };
      window._sgAIEnhance = function(){
        // #7: AI enhance button on camera
        if(window._sgSelectedFilter === 'none') window._sgSelectedFilter = 'contrast(1.1) saturate(1.2) brightness(1.05)';
        var vid = document.getElementById('sg-camera-preview');
        if(vid) vid.style.filter = window._sgSelectedFilter;
        // Visual feedback
        var btn = event.target;
        btn.style.background = 'rgba(255,109,0,.5)';
        btn.textContent = 'AI \u2713';
        setTimeout(function(){ btn.style.background = 'rgba(0,0,0,.5)'; }, 1500);
      };
      /* Task 156 B5: this used to say "uploaded!" without uploading anything.
         Recorded clips now go through the real upload sheet (progress + drafts). */
      window._sgUploadReel = function(){
        var caption = (document.getElementById('sg-reel-caption') || {}).value || '';
        var blob = window._sgReelBlob;
        window._sgCloseCamera();
        if (blob && window.sgHomePost) window.sgHomePost.compose(blob, caption, null);
      };

      // ── Floating Book CTA removed (C4 fix) ──
      // The aggressive CTA banner was removed because it:
      //   1. Re-appeared on every swipe, covering video content
      //   2. Sat at bottom:16px overlapping the progress bar
      //   3. Accidental taps navigated users out of Reels, pausing all videos
      // Users can still book via the "Book" tab in the tab bar.
    })();
    </script>
  <script src="/sg-tabbar.js?v=1.3" defer></script>
  <script src="/sg-home-post.js?v=1.1" defer></script>
  <link rel="stylesheet" href="/sg-glass.css?v=1.1">

  <!--
    Voice, on the tab most visitors land on.

    /reels is not the SPA — it is this standalone SSR page, so none of the scripts
    index.html loads are present here. That is why Reels was mute: not just a route
    pattern that matched nothing, but the entire voice stack being absent from the
    page. Adding a personality to the SPA did nothing for this file.

    Order matters and mirrors index.html: engine, then personality, then the arming
    layer that reads the personalities. All deferred, so none of this competes with
    the video feed for first paint.
  -->
  <script src="/voice.js?v=3.0" defer></script>
  <script src="/chat-agent.js?v=5.0" defer></script>
  <script src="/reels-chat.js?v=1.0" defer></script>
  <script src="/sg-dock.js?v=1.8" defer></script>
  <script src="/voice-always.js?v=1.1" defer></script>
  <script src="/sg-icons.js?v=1.1" defer></script>
<script src="/sg-half-sheet.js?v=1.5" defer></script>
<script src="/rails.js?v=3.9" defer></script>
</body>
