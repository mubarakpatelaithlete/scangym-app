[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["cd server && npm install --production"]

[phases.build]
cmds = [
  "cp -r server/* .",
  "cp -r frontend/public ./public",
  "ls -la routes/liveSearch.js || echo 'WARNING: liveSearch.js missing!'",
  "echo 'Build complete - v3.2.0'"
]

[start]
cmd = "node server.js"
